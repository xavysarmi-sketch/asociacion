<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Cómo poner la app NH en tu móvil</title>
<style>
body{margin:0;background:#F5F0EB;font-family:system-ui,-apple-system,sans-serif;color:#111}
.w{max-width:560px;margin:0 auto;padding:12px}
img{width:100%;height:auto;display:block;border-radius:14px}
.otro{display:block;width:100%;margin:16px 0;padding:14px;border:2px solid #1B4332;border-radius:14px;background:#fff;color:#1B4332;font-size:17px;font-weight:800}
.nota{display:none;margin:10px 4px 0;font-size:17px;line-height:1.4;font-weight:700;color:#1B4332}
</style></head><body><div class="w">
<!-- v45.61+ · Pasos con dibujos para poner la app en el móvil. Sin datos de nadie: es pública. -->
<img id="a" alt="Pasos"><p class="nota" id="na"></p><button class="otro" id="b"></button><img id="c" alt="Pasos" style="display:none"><p class="nota" id="nc"></p>
<script>
var ua=navigator.userAgent||"", and=/Android/.test(ua);
var p=and?["android.jpg","iphone.jpg","¿Tienes iPhone? Ver sus pasos"]:["iphone.jpg","android.jpg","¿Tienes Android? Ver sus pasos"];
document.getElementById("a").src=p[0]; document.getElementById("c").src=p[1]; var b=document.getElementById("b"); b.textContent=p[2];
// v46.36: en el iPhone, Compartir puede estar detrás de los tres puntos; se dice debajo del dibujo del iPhone
var NOTA="Si no ves Compartir, toca primero los tres puntos ··· de abajo.";
function nota(id){ var e=document.getElementById(id); e.textContent=NOTA; e.style.display="block"; }
if(!and)nota("na");
b.onclick=function(){ document.getElementById("c").style.display="block"; b.style.display="none"; if(and)nota("nc"); };
</script></div></body></html>
