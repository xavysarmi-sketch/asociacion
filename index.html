let SYNC_STATUS="init";

function load(){
  if(READONLY_ID||ES_MODO_GRUPO){
    DATA=sanitizeData(migrateData(JSON.parse(JSON.stringify(INITIAL))));
    document.getElementById("app").innerHTML='<div style="text-align:center;padding:60px 20px"><div style="font-size:40px;margin-bottom:12px">⏳</div><div style="font-size:16px;font-weight:600;color:#2D6A4F">Cargando datos...</div></div>';
    const tryLoad=async()=>{
      if(!window._fbReady){
        await new Promise(res=>{
          const t=setTimeout(res,7000);
          window.addEventListener("firebase-ready",()=>{clearTimeout(t);res();},{once:true});
        });
      }
      try{
        const fbData=await window._fbLoad();
        if(fbData){DATA=sanitizeData(migrateData(fbData));if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});}
        SYNC_STATUS="ok";
      }catch(e){console.error("Firebase readonly load failed:",e);SYNC_STATUS="error";}
      setCurrentMonthYear();
      render();
    };
    tryLoad();
    return;
  }

  // Modo administrador: localStorage primero (inmediato), Firebase después (en background)
  try{
    const s=localStorage.getItem(KEY);
    DATA=s?sanitizeData(migrateData(JSON.parse(s))):sanitizeData(migrateData(JSON.parse(JSON.stringify(INITIAL))));
    if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
  }catch{DATA=sanitizeData(migrateData(JSON.parse(JSON.stringify(INITIAL))));}
  // Respetar el mes/año guardado (solo se fija el actual si no hubiera ninguno)
  setCurrentMonthYear();
  SYNC_STATUS="init";
  render(); // Renderizar con datos locales inmediatamente

  // FIX IPHONE: sincronizar con Firebase UNA SOLA VEZ al cargar
  // Sin onSnapshot — sin WebSocket persistente — sin congelados
  const tryFirebase=async()=>{
    if(!window._fbReady){
      await new Promise(res=>{
        const t=setTimeout(res,5000);
        window.addEventListener("firebase-ready",()=>{clearTimeout(t);res();},{once:true});
      });
    }
    try{
      const fbData=await window._fbLoad();
      const hayLocal = !!localStorage.getItem(KEY) && DATA && DATA.members && DATA.members.length>0;
      if(!hayLocal && fbData){
        // localStorage vacío (teléfono nuevo, app reinstalada o caché borrada):
        // recuperar los datos desde el respaldo de la nube.
        DATA=sanitizeData(migrateData(fbData));
        if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
        localStorage.setItem(KEY,JSON.stringify(DATA));
      }else if(hayLocal && fbData && typeof fbData.updatedAt==="number" && fbData.updatedAt>(DATA.updatedAt||0)){
        // La nube tiene datos MÁS RECIENTES que este dispositivo (editaste desde otro
        // aparato). No se decide en automático: se pregunta. Mientras esté pendiente,
        // save() no debe subir nada a Firebase (evitaría pisar lo reciente con esto viejo).
        SYNC_DECISION_PENDING=true;
        MODAL={type:"sync_conflict",cloudData:fbData,localUpdatedAt:DATA.updatedAt||null,cloudUpdatedAt:fbData.updatedAt};
        SYNC_STATUS="ok";
        render();
        return; // el flujo continúa en resolverConflictoSync() cuando se elija una opción
      }else{
        // CASO NORMAL (un solo dispositivo): lo LOCAL es la verdad. Firebase NUNCA
        // pisa lo local; solo se usa como respaldo, subiendo la copia local a la nube.
        // Así una ayuda recién registrada no puede desaparecer al reabrir.
        try{await window._fbSave(DATA);}catch(e){}
      }
      SYNC_STATUS="ok";
    }catch(e){
      console.error("Firebase load failed:",e);
      SYNC_STATUS="error";
    }
    setCurrentMonthYear(SYNC_STATUS==="ok"); // v44.12: guarda el cambio automático de mes solo si la nube respondió bien
    render();
    // FIX IPHONE: NO llamamos a _fbListen aquí — eliminado completamente
  };
  tryFirebase();
}

// Guarda una copia de `data` en los respaldos locales (máx 3, se descarta la más
// antigua). origen indica de dónde viene esa copia ("local" o "nube") y ts la fecha
// de esos datos (DATA.updatedAt), para mostrarla luego en Gestión.
function guardarRespaldoLocal(data,origen,ts){
  try{
    const raw=localStorage.getItem(KEY_BACKUPS);
    const arr=raw?JSON.parse(raw):[];
    arr.push({ts:ts||Date.now(),origen,guardadoEn:Date.now(),data});
    while(arr.length>3)arr.shift();
    localStorage.setItem(KEY_BACKUPS,JSON.stringify(arr));
  }catch(e){console.error("No se pudo guardar el respaldo local:",e);}
}
function listarRespaldosLocales(){
  try{const raw=localStorage.getItem(KEY_BACKUPS);return raw?JSON.parse(raw):[];}catch{return[];}
}

// El usuario decide qué hacer ante un conflicto de sincronización (modal "sync_conflict").
async function resolverConflictoSync(choice){
  if(!MODAL||MODAL.type!=="sync_conflict")return;
  const cloudData=MODAL.cloudData;
  if(choice==="cloud"){
    // Antes de reemplazar lo local por lo de la nube, respaldar lo local actual con su fecha.
    guardarRespaldoLocal(DATA,"local",MODAL.localUpdatedAt);
    DATA=sanitizeData(migrateData(cloudData));
    if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
    try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch{}
    toast("☁️ Datos de la nube cargados ✓");
  }else{
    // Mantener local: los de la nube van a quedar pisados por la subida de abajo, así
    // que primero se respaldan (con su propia fecha) para que no se destruyan sin copia.
    guardarRespaldoLocal(cloudData,"nube",MODAL.cloudUpdatedAt);
    toast("📱 Mantienes los datos de este dispositivo");
  }
  MODAL=null;
  SYNC_DECISION_PENDING=false; // se reanuda el flujo normal de save()
  render();
  if(choice==="local"){
    // Continúa el flujo normal (caso de siempre): lo local es la verdad, se sube como respaldo.
    try{await window._fbSave(DATA);}catch(e){}
  }
  setCurrentMonthYear(true); // v44.12: conflicto resuelto → se puede guardar el cambio automático de mes
  render();
}

// Restaura una copia de respaldo (por índice en listarRespaldosLocales()). Antes de
// restaurar, guarda el estado actual como respaldo también: ninguna restauración
// puede destruir datos sin que quede su copia.
async function restaurarRespaldoLocal(idx){
  const arr=listarRespaldosLocales();
  const bk=arr[idx];
  if(!bk)return;
  guardarRespaldoLocal(DATA,"local",DATA.updatedAt||Date.now());
  DATA=sanitizeData(migrateData(JSON.parse(JSON.stringify(bk.data))));
  if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
  closeModal();
  await save();
  toast("♻️ Copia de seguridad restaurada ✓");
  render();
}

// Diagnóstico: releer localStorage SIN tocar nada y comparar con memoria
function diagLeerLS(){
  let raw=""; try{raw=localStorage.getItem(KEY)||"";}catch(e){toast("No se puede leer localStorage: "+e.message);return;}
  if(!raw){toast("⚠️ localStorage VACÍO — el teléfono está borrando los datos");return;}
  let c=0; try{const o=JSON.parse(raw);(o.members||[]).forEach(m=>{c+=(m.loans||[]).length;});}catch(e){toast("localStorage corrupto");return;}
  let mem=0; DATA.members.forEach(m=>{mem+=(m.loans||[]).length;});
  toast("Teléfono: "+c+" ayudas · Memoria: "+mem+" ayudas");
}
async function subirAhoraNube(){
  DATA.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch{}
  if(!window._fbReady){toast("Conectando con la nube, espera un momento e inténtalo de nuevo");return;}
  toast("Subiendo a la nube...");
  try{
    const ok=await window._fbSave(DATA);
    if(ok){SYNC_STATUS="ok";toast("✓ Datos subidos a la nube ("+DATA.members.length+" miembros)");}
    else{SYNC_STATUS="error";toast("No se pudo subir. Revisa tu conexión.");}
  }catch(e){SYNC_STATUS="error";toast("Error al subir a la nube");}
  const dot=document.querySelector(".sync-indicator");
  if(dot)dot.innerHTML=syncHTML();
}

async function save(){
  DATA.updatedAt=Date.now(); // marca de tiempo: para que gane siempre la versión más reciente
  invalidateAuditCache(); // los datos cambiaron: la próxima lectura del chip/tarjeta recalcula
  try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch{}

  if(SYNC_DECISION_PENDING)return; // hay un conflicto de sync sin resolver: solo local, nada de Firebase

  if(!READONLY_ID&&!ES_MODO_GRUPO){
    SYNC_STATUS="saving";
    // FIX IPHONE: actualizar solo el indicador, sin re-renderizar todo
    const dot=document.querySelector(".sync-indicator");
    if(dot)dot.innerHTML=syncHTML();

    try{
      if(window._fbReady){
        const ok=await window._fbSave(DATA);
        SYNC_STATUS=ok?"ok":"error";
      }else{
        SYNC_STATUS="offline";
      }
    }catch{SYNC_STATUS="error";}

    // Actualizar solo el indicador de sync, no todo el render
    const dot2=document.querySelector(".sync-indicator");
    if(dot2)dot2.innerHTML=syncHTML();
  }
}

function syncHTML(){
  if(SYNC_STATUS==="ok")return'<span class="sync-dot sync-ok"></span>Sincronizado';
  if(SYNC_STATUS==="saving")return'<span class="sync-dot sync-ing"></span>Guardando...';
  if(SYNC_STATUS==="error")return'<span class="sync-dot sync-err"></span>Sin conexión — guardado local';
  if(SYNC_STATUS==="offline")return'<span class="sync-dot sync-err"></span>Offline — guardado local';
  return'<span class="sync-dot sync-ing"></span>Conectando...';
}

function toast(msg,dur=2500){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),dur);}

// Total real de aportes de un mes: aporte de cada asociado que pagó (50 o 100)
// + sus aportes extra de ese mes. Refleja el dinero real aportado.
function totalAportesMes(rm,ry){
  const md=getMesData(rm,ry);
  const aportes=(md&&md.aportes)||{};
  const mesKey=getMesKey(rm,ry);
  let t=0;
  DATA.members.forEach(m=>{
    if(m.type==="tercero")return;
    if(aportes[m.id]) t+=aporteNetoMes(m,rm,ry); // v45: aporte elegido ese mes − bono por referido
  });
  return t;
}

// Salidas por devoluciones de aportaciones puntuales en un mes (capital+5% que se
// devuelve al aportante). Es dinero que SALE del fondo ese mes.
function salidasPuntualesMes(rm,ry){
  let t=0;
  if(DATA.aportesPuntuales){
    Object.values(DATA.aportesPuntuales).forEach(arr=>{
      (arr||[]).forEach(ap=>{ if(ap.mesDev===rm&&ap.anioDev===ry) t+=ap.total; });
    });
  }
  return t;
}
// Desglose de las devoluciones de aportes puntuales que TOCAN devolverse en rm/ry,
// separando lo ya devuelto de lo aún pendiente (devuelto:false). Ambos importes salen
// del disponible: el pendiente es un compromiso ya adquirido, no dinero disponible.
function salidasPuntualesSplit(rm,ry){
  let devuelto=0,pendiente=0;const items=[];
  if(DATA.aportesPuntuales){
    Object.entries(DATA.aportesPuntuales).forEach(([mid,arr])=>{
      (arr||[]).forEach(ap=>{
        if(ap.mesDev===rm&&ap.anioDev===ry){
          const nom=(DATA.members.find(x=>x.id===mid)||{}).name||"";
          if(ap.devuelto){devuelto+=ap.total;}else{pendiente+=ap.total;}
          items.push({nombre:nom,total:ap.total,devuelto:!!ap.devuelto});
        }
      });
    });
  }
  return {devuelto,pendiente,total:devuelto+pendiente,items};
}

function due(m,rm,ry){
  // Suma la cuota cuyo mes es EXACTAMENTE rm/ry (no la próxima sin pagar),
  // incluyendo ayudas cerradas (una cuota pagada ese mes es devolución contable real).
  // Usa cuotaDe() (respeta aplazamientos y ayudas sin migrar) — no leer l.inst aquí.
  let t=0;
  const todas=[...(m.loans||[]),...(m.closedLoans||[])];
  todas.forEach(l=>{
    l.pays.forEach((p,i)=>{ if(p.m===rm&&p.y===ry) t+=cuotaDe(l,i); });
  });
  return Math.round(t*100)/100;
}
// Pendiente real de una ayuda: suma las cuotas NO pagadas usando cuotaDe() (fuente de verdad,
// respeta aplazamientos y genera cuotas al vuelo con ayudaCuotas si la ayuda no está migrada).
function pendLoan(l){
  let t=0;
  l.pays.forEach((p,i)=>{ if(!p.paid) t+=cuotaDe(l,i); });
  return Math.round(t*100)/100;
}
function pendAll(m){let t=0;m.loans.forEach(l=>t+=pendLoan(l));return Math.round(t*100)/100;}

// Cuotas de un miembro que vencen EXACTAMENTE en rm/ry, separando pagado/pendiente.
// (No arrastra atrasos de meses anteriores: solo el mes en curso.)
function dueSplit(m,rm,ry){
  let cobrado=0,pendiente=0;
  const todas=[...(m.loans||[]),...(m.closedLoans||[])];
  todas.forEach(l=>{
    l.pays.forEach((p,i)=>{ if(p.m===rm&&p.y===ry){ const imp=cuotaDe(l,i); if(p.paid)cobrado+=imp; else pendiente+=imp; } });
  });
  cobrado=Math.round(cobrado*100)/100; pendiente=Math.round(pendiente*100)/100;
  return {cobrado,pendiente};
}
// Aportes del mes rm/ry: cobrado (los que pagaron) y pendiente (asociados activos
// con derecho a aportar ese mes que aún no han pagado).
function aportesSplit(rm,ry){
  const md=getMesData(rm,ry);
  const aportes=(md&&md.aportes)||{};
  const ri=MONTHS.indexOf(rm);
  let cobrado=0,pendiente=0;
  DATA.members.forEach(m=>{
    if(m.type==="tercero"||!m.joinMonth)return;
    // Solo cuenta si el asociado ya estaba activo ese mes (ingresó antes o en ese mes)
    const ji=MONTHS.indexOf(m.joinMonth),jy=m.joinYear;
    const activoEseMes=(jy<ry)||(jy===ry&&ji<=ri);
    if(!activoEseMes)return;
    // Baja: desde el mes de baja (inclusive) el asociado deja de aportar, así que
    // no debe contar ni como cobrado ni como pendiente en la recaudación de ese mes.
    if(!cuentaComoActivo(m,getMesKey(rm,ry)))return;
    const cuota=aporteNetoMes(m,rm,ry);
    if(aportes[m.id])cobrado+=cuota; else pendiente+=cuota;
  });
  return {cobrado,pendiente};
}

// Recargo por cuota de una ayuda = % del capital (una vez por cuota), en céntimos exactos.
function recargoPorCuota(l){return Math.round(l.capital*((l.rate!=null?l.rate:DATA.rate)/100)*100)/100;}

// Total de una ayuda = capital + recargo simple por cada cuota (capital*rate/100*n),
// SIEMPRE redondeado al alza a euro entero (v44.1 — decisión de Ángel: lo que se cobra
// en mano nunca lleva céntimos; el fondo se queda con la fracción de más). El -1e-9 es
// solo para que el redondeo de coma flotante no empuje un total exacto al euro siguiente.
// rate puede venir undefined (ayudas antiguas) → usa DATA.rate como fallback.
// OJO: esto es independiente de recargoPorCuota(), que se queda en céntimos exactos a
// propósito (es una magnitud contable, no un importe que nadie paga en efectivo).
function ayudaTotal(capital,n,rate){
  const r=(rate!=null?rate:DATA.rate)/100;
  return Math.ceil(capital+capital*r*n-1e-9);
}

// Reparte el total (ya entero) en n cuotas ENTERAS de forma EQUILIBRADA (v44.1,
// corrección de Ángel): las primeras "resto" cuotas llevan 1€ más que el resto —
// el salto máximo entre cuotas es de 1€, nunca se concentra toda la diferencia en
// la última (evita que una última cuota mucho más baja parezca un descuento/error).
// sum(cuotas) === total SIEMPRE.
function ayudaCuotas(capital,n,rate){
  const total=ayudaTotal(capital,n,rate);
  if(!n||n<1)return {total,cuotas:[]};
  const base=Math.floor(total/n);
  const resto=total-base*n; // nº de cuotas (las primeras) que llevan 1€ más
  const cuotas=[];
  for(let i=0;i<n;i++) cuotas.push(i<resto?base+1:base);
  return {total,cuotas};
}

// Formatea un importe para TEXTO mostrado (pantalla/WhatsApp/PDF): sin decimales si es
// .00, si no con coma decimal española. NUNCA usar en value= de un <input> ni en nada
// que se vuelva a parsear — ahí siempre punto (parseFloat/parseInt no entienden la coma).
function fmtEur(x){
  const r=Math.round(x*100)/100;
  return Number.isInteger(r)?String(r):r.toFixed(2).replace(".",",");
}

// Importe EXACTO de la cuota i de una ayuda (respeta aplazamientos). Único helper de lectura
// para dinero por-cuota: úsalo en vez de leer l.inst directamente en cualquier sitio nuevo.
function cuotaDe(l,i){
  const p=(l.pays||[])[i];
  if(p&&p.aplazada) return (p.instAplazada!=null?p.instAplazada:recargoPorCuota(l));
  if(l.cuotas&&l.cuotas.length===(l.pays||[]).length) return l.cuotas[i];
  return ayudaCuotas(l.capital,l.n,l.rate).cuotas[i]; // fallback ayudas sin migrar
}

// Recargo automático del mes = suma del recargo de cada cuota PAGADA cuyo mes es rm/ry
function recargoAutoMes(rm,ry){
  let t=0;
  DATA.members.forEach(m=>{
    [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
      l.pays.forEach(p=>{ if(p.m===rm&&p.y===ry&&p.paid&&!p.compensada) t+=recargoPorCuota(l); });
    });
  });
  return Math.round(t*100)/100;
}

// Índice absoluto de mes (para comparar "Ago 2025" con "Jul 2027" con una sola resta).
function _idxMes(mes,anio){ return anio*12+MONTHS.indexOf(mes); }

// La app registra el recargo desde jun-2026. Los meses anteriores son históricos y
// viven en NH_Contabilidad_Maestra.xlsx (hoja Reparto_Mensual, celdas azules fijas).
const RECARGO_DESDE="2026-06";

// Auditoría interna: SOLO informa, nunca corrige nada. Devuelve {errores, advertencias}
// (arrays de texto legible). Recorre TODO DATA (miembros, ayudas, meses) — con ~50-60
// personas y ~55 ayudas es barato, por eso el chip de cabecera puede llamarla en cada render().
function auditarNH(){
  const errores=[],advertencias=[];
  const todasLasAyudas=[]; // {m,l,cerrada} — para controles 3,4,5,11,12
  DATA.members.forEach(m=>{
    (m.loans||[]).forEach(l=>todasLasAyudas.push({m,l}));
    (m.closedLoans||[]).forEach(l=>todasLasAyudas.push({m,l}));
  });

  // 1 y 2: historial vs ayuda vinculada
  DATA.members.forEach(m=>{
    const todas=[...(m.loans||[]),...(m.closedLoans||[])];
    (m.history||[]).forEach(h=>{
      if(h.lid){
        const l=todas.find(x=>x.id===h.lid);
        if(l&&l.capital!==h.capital){
          errores.push(`Historial: ${m.name} — ${h.gMonth} ${h.gYear} capital ${h.capital}€ ≠ ayuda vinculada (${l.capital}€)`);
        }
      }else{
        const hayMismoPeriodo=todas.some(l=>l.gMonth===h.gMonth&&l.gYear===h.gYear);
        if(hayMismoPeriodo){
          errores.push(`Historial: ${m.name} — ${h.gMonth} ${h.gYear} sin lid, pero hay una ayuda del mismo periodo sin vincular`);
        }
      }
    });
  });

  // 3 y 4: total y cuotas de cada ayuda
  todasLasAyudas.forEach(({m,l})=>{
    const n=l.n||l.pays.length;
    const totalEsperado=ayudaTotal(l.capital,n,l.rate);
    // v44.17: importeHistorico = apoyo de antes de la regla de redondeo (se cobró el importe exacto de entonces)
    if(!l.importeHistorico&&Math.abs((l.total!=null?l.total:0)-totalEsperado)>0.005){
      errores.push(`Total: ${m.name} — ayuda ${l.gMonth} ${l.gYear} tiene total ${l.total}€, calculado ${totalEsperado}€`);
    }
    if(Array.isArray(l.cuotas)){
      const sumaCuotas=Math.round(l.cuotas.reduce((s,c)=>s+c,0)*100)/100;
      const totalRef=l.total!=null?l.total:totalEsperado;
      if(Math.abs(sumaCuotas-totalRef)>0.005){
        errores.push(`Cuotas: ${m.name} — ayuda ${l.gMonth} ${l.gYear} suma de cuotas ${sumaCuotas}€ ≠ total ${totalRef}€`);
      }
    }
  });

  // 5: pagos duplicados dentro de una misma ayuda (mismo mes/año dos veces)
  todasLasAyudas.forEach(({m,l})=>{
    const vistos=new Set();
    (l.pays||[]).forEach(p=>{
      const k=p.m+"-"+p.y;
      if(vistos.has(k)){
        errores.push(`Pago duplicado: ${m.name} — ayuda ${l.gMonth} ${l.gYear} tiene dos cuotas en ${p.m} ${p.y}`);
      }
      vistos.add(k);
    });
  });

  // 6: recargo mensual guardado vs calculado, desde RECARGO_DESDE en adelante (no solo
  // el mes activo). Antes de esa fecha el recargo es histórico fijo de la Maestra
  // (Excel) y nunca se llevó en la app — no son errores, se excluyen del todo.
  // Si Ángel lo fijó a mano (recargoManual), es una decisión suya: no se marca como error.
  const mesesRecargoAusente=[];
  Object.keys(DATA.monthlyData||{}).sort().forEach(k=>{
    if(k<RECARGO_DESDE)return; // histórico anterior a la app: vive en la Maestra, no se audita
    const md=DATA.monthlyData[k];
    if(!md||md.recargoManual)return;
    const[ys,ms]=k.split("-");
    const ry=parseInt(ys),rm=MONTHS[parseInt(ms)-1];
    if(!rm)return;
    if(md.recargo==null){
      mesesRecargoAusente.push(`${rm} ${ry}`);
      return;
    }
    const calculado=recargoAutoMes(rm,ry);
    const guardado=md.recargo;
    if(Math.abs(guardado-calculado)>0.005){
      errores.push(`Retorno ${rm} ${ry}: guardado ${guardado}€, calculado ${calculado}€ (diferencia ${Math.round((calculado-guardado)*100)/100}€)`);
    }
  });
  if(mesesRecargoAusente.length>0){
    advertencias.push(`${mesesRecargoAusente.length} mes${mesesRecargoAusente.length>1?"es":""} desde ${RECARGO_DESDE} sin retorno registrado en la app (${mesesRecargoAusente.join(", ")}) — revisar si están pendientes de cerrar`);
  }

  // 7: personas duplicadas por nombre (tildes/mayúsculas/espacios)
  {
    const porNombre={};
    DATA.members.forEach(m=>{
      const k=_normNombre(m.name);
      if(!porNombre[k])porNombre[k]=[];
      porNombre[k].push(m);
    });
    Object.values(porNombre).forEach(grupo=>{
      if(grupo.length>1)errores.push(`Nombre duplicado: "${grupo[0].name}" aparece ${grupo.length} veces (ids: ${grupo.map(x=>x.id).join(", ")})`);
    });
  }

  // 8: ids de miembro duplicados
  {
    const vistos={};
    DATA.members.forEach(m=>{
      vistos[m.id]=(vistos[m.id]||0)+1;
    });
    Object.keys(vistos).forEach(id=>{ if(vistos[id]>1)errores.push(`Id de miembro duplicado: "${id}" (${vistos[id]} veces)`); });
  }

  // 9: lids (ids de ayuda) duplicados ENTRE personas distintas
  {
    const dueño={};
    todasLasAyudas.forEach(({m,l})=>{
      if(dueño[l.id]&&dueño[l.id]!==m.id){
        errores.push(`Id de ayuda duplicado: "${l.id}" existe en ${dueño[l.id+"__name"]} y en ${m.name}`);
      }
      dueño[l.id]=m.id; dueño[l.id+"__name"]=m.name;
    });
  }

  // 10: terceros sin avalista
  DATA.members.forEach(m=>{
    if(m.type==="tercero"&&!m.ref)errores.push(`Tercero sin avalista: ${m.name}`);
  });

  // 10b: refs históricas que la migración v11 no pudo resolver de forma segura.
  // Son avisos, nunca autocorrecciones. Se recalculan en cada carga y no se guardan
  // dentro de DATA, por lo que no añaden campos ni alteran el documento histórico.
  (window.NH_TERCEROS_REF_WARNINGS||[]).forEach(aviso=>{
    const tercero=DATA.members.find(m=>m.id===aviso.terceroId);
    const nombre=tercero?tercero.name:aviso.terceroId;
    if(aviso.tipo==="ambiguo"){
      advertencias.push(`Avalista ambiguo: ${nombre} — ${aviso.candidatos.length} asociados coinciden; revisar manualmente`);
    }else if(aviso.tipo==="sin_coincidencia"){
      advertencias.push(`Avalista pendiente: ${nombre} — la referencia histórica no coincide con ningún asociado; revisar manualmente`);
    }else if(aviso.tipo==="nombre_pendiente"){
      advertencias.push(`Avalista pendiente de migración: ${nombre} — revisar manualmente`);
    }
  });

  // 11: reglas del Documento Maestro §11/§12 sobre plazos y capital máximo.
  // MATIZ OBLIGATORIO: plazoBase excluye las cuotas aplazadas (un aplazamiento con causa
  // justificada no convierte una ayuda corta en plazo largo — caso Melanny).
  todasLasAyudas.forEach(({m,l})=>{
    const nAplazadas=(l.pays||[]).filter(p=>p.aplazada).length;
    const n=l.n||l.pays.length;
    const plazoBase=n-nAplazadas;
    const esTerc=(l.tipoEnConcesion!=null?l.tipoEnConcesion:m.type)==="tercero"; // v44.17: se juzga con la condición de la concesión
    // Doc Maestro §11.1: asociados 100–1.000€ libre; 1.000–3.000€ con aprobación previa
    // del coordinador (aviso, no error); por encima de 3.000€ no se concede ninguna ayuda.
    // Terceros: tope fijo de 500€ (no está sujeto a esta escala).
    if(esTerc){
      if(l.capital>500){
        errores.push(`Capital excedido: ${m.name} (tercero) — ayuda ${l.gMonth} ${l.gYear} de ${l.capital}€ supera el máximo de 500€`);
      }
    }else{
      if(l.capital>3000){
        errores.push(`Capital excedido: ${m.name} (asociado) — ayuda ${l.gMonth} ${l.gYear} de ${l.capital}€ supera el máximo absoluto de 3.000€ (Maestro AY-5)`);
      }else if(l.capital>1000){
        advertencias.push(`Requiere aprobación del coordinador: ${m.name} (asociado) — ayuda ${l.gMonth} ${l.gYear} de ${l.capital}€ está entre 1.000€ y 3.000€ (Maestro AY-5)`);
      }
    }
    if(esTerc&&plazoBase>5){
      errores.push(`Plazo excedido: ${m.name} (tercero) — ayuda ${l.gMonth} ${l.gYear} con plazo base ${plazoBase} meses (máximo 5 para terceros)`);
    }
    if(!esTerc&&_idxMes(l.gMonth,l.gYear)>=AY_V18_DESDE){
      const cicloC=l.cicloEnConcesion!=null?l.cicloEnConcesion:m.ciclo;
      if(cicloC===12&&l.capital>500)errores.push(`Importe excedido: ${m.name} — ayuda ${l.gMonth} ${l.gYear} de ${l.capital}€ con permanencia de 12 meses (máximo 500 €, Maestro AY-1)`);
    }
    if(!esTerc&&plazoBase>5){
      const ciclo=l.cicloEnConcesion!=null?l.cicloEnConcesion:m.ciclo;
      const cicloOk=(ciclo===24||ciclo===36||ciclo===0);
      if(!cicloOk){
        errores.push(`Plazo largo sin permanencia suficiente: ${m.name} — ayuda ${l.gMonth} ${l.gYear} con plazo base ${plazoBase} meses requiere permanencia de 24, 36 meses o indefinida; tenía ${ciclo===0?"indefinida":ciclo+" meses"} (Maestro AY-1)`);
      }
    }
  });

  // 11b (v45 · Maestro PE-1): asociados activos sin permanencia guardada (la ficha no debe suponer 12)
  DATA.members.filter(m=>m.type==="asociado"&&!m.baja&&m.ciclo==null).forEach(m=>{
    errores.push(`Sin permanencia: ${m.name} no tiene permanencia guardada — guárdala en Gestión → ⚙️ Permanencia y aporte (Maestro PE-1)`);
  });

  // 12: ayudas sin condición histórica (tipoEnConcesion) — UNA sola advertencia agrupada.
  const sinCondicion=todasLasAyudas.filter(({l})=>l.tipoEnConcesion==null);
  if(sinCondicion.length>0){
    advertencias.push(`${sinCondicion.length} ayuda${sinCondicion.length>1?"s":""} sin condición histórica registrada (tipoEnConcesion/avalistaEnConcesion/cicloEnConcesion) — de antes de esta actualización, no se han migrado`);
  }

  // 13: el plazo del apoyo no puede exceder la permanencia comprometida (el apoyo puede
  // obligar a subir de ciclo, pero no al revés). Ciclo 0 (indefinido) nunca se marca —
  // no tiene fecha de cierre. Solo aplica a asociados con joinMonth conocido.
  todasLasAyudas.forEach(({m,l})=>{
    if(m.type==="tercero"||m.ciclo===0||m.ciclo==null||!m.joinMonth)return;
    const pays=l.pays||[];
    if(!pays.length)return;
    const finCiclo=_idxMes(m.joinMonth,m.joinYear)+m.ciclo-1; // v45.8 (Maestro v18.5): último mes de permanencia
    const ultima=pays[pays.length-1];
    const idxUltima=_idxMes(ultima.m,ultima.y);
    if(idxUltima>finCiclo){
      errores.push(`Plazo excede permanencia: ${m.name} ${l.id} — la última cuota (${ultima.m} ${ultima.y}) pasa del último mes de su permanencia (${m.ciclo} meses desde ${m.joinMonth} ${m.joinYear}) en ${idxUltima-finCiclo} mes(es)`);
    }
  });

  // 14: nombres citados en aportesPuntuales[*].destino que no corresponden a ninguna
  // persona existente (por nombre normalizado) — detecta solos futuros renombrados
  // que aún no se hayan añadido a ALIAS_NOMBRES (migrateData).
  if(DATA.aportesPuntuales){
    const nombresValidos=new Set(DATA.members.map(m=>_normNombre(m.name)));
    const huerfanos=new Set();
    Object.values(DATA.aportesPuntuales).forEach(arr=>{
      if(!Array.isArray(arr))return;
      arr.forEach(ap=>{
        if(ap&&ap.destino&&!nombresValidos.has(_normNombre(ap.destino))){
          huerfanos.add(ap.destino);
        }
      });
    });
    huerfanos.forEach(nombre=>{
      advertencias.push(`Destino huérfano en aportesPuntuales: "${nombre}" no corresponde a ninguna persona actual — ¿renombrado sin actualizar?`);
    });
  }

  // v44.19: un mismo referido no puede dar bono en dos meses (bono duplicado)
  Object.keys(DATA.referidos||{}).forEach(rid=>{
    const r=DATA.referidos[rid], vistos={};
    Object.keys(r).forEach(k=>String(r[k].nombres||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(nm=>{
      const n=_normNombre(nm); (vistos[n]=vistos[n]||{nombre:nm,meses:[]}).meses.push(k);
    }));
    const quien=(DATA.members.find(m=>m.id===rid)||{}).name||rid;
    Object.values(vistos).filter(v=>v.meses.length>1).forEach(v=>
      advertencias.push(`Bono por referido duplicado: ${quien} tiene el bono de ${v.nombre} en ${v.meses.sort().map(k=>{const[yy,mm]=k.split("-").map(Number);return MONTHS_FULL[mm-1]+" "+yy;}).join(" y ")} — dejarlo solo en un mes (Ficha → 🎁 Referido)`));
  });
  return {errores,advertencias};
}

// auditarNH() recorre TODO DATA — barato hoy (27 asociados), pero crece con el nº de
// asociados × ayudas × meses. El chip de cabecera y la tarjeta de Gestión lo llaman en
// CADA render(), así que se cachea aquí e invalida solo cuando cambian los datos
// (save() lo invalida explícitamente; la clave por updatedAt+nº miembros es la 2ª red
// de seguridad). auditarNH() en sí sigue sin caché, para pruebas y el botón manual.
let _audCache=null,_audKey=null;
function invalidateAuditCache(){_audCache=null;_audKey=null;}
function auditarNHCached(){
  const key=(DATA.updatedAt||"")+"|"+(DATA.members||[]).length;
  if(_audKey===key&&_audCache)return _audCache;
  _audCache=auditarNH();_audKey=key;
  return _audCache;
}

// Lista de cuotas cuyo mes es rm/ry (para el bloque de cuotas cobradas del cierre)
// ── CIERRE GRUPAL (varios grupos, persistentes) ──
function gruposCierre(){ if(!DATA.gruposCierre)DATA.gruposCierre=[]; return DATA.gruposCierre; }

// Descuento por referido de un asociado en un mes concreto (misma regla en toda la app):
// 10€ por referido, máximo 3 (30€). Se usa TANTO en la ficha como en el Cierre para
// que las sumas coincidan siempre. Devuelve {nReferidos, descuento}.
function descuentoReferidoMes(mid,rm,ry){
  const refData=(DATA.referidos&&DATA.referidos[mid]&&DATA.referidos[mid][getMesKey(rm,ry)])||null;
  const nReferidos=refData?Math.min(refData.n,3):0;
  return {nReferidos, descuento:nReferidos*10};
}
// v44.17: nombres de las personas referidas que generan el descuento de ese mes.
function nombresReferidosMes(mid,rm,ry){
  const r=(DATA.referidos&&DATA.referidos[mid]&&DATA.referidos[mid][getMesKey(rm,ry)])||null;
  if(!r||!(r.n>0))return [];
  const lista=String(r.nombres||"").split(/\s*,\s*/).map(x=>x.trim()).filter(Boolean);
  return lista.length?lista:["(nombre no registrado)"];
}
// v44.17: desplegable con los referidos bajo la línea del descuento. oscuro=true en las
// tarjetas verdes (ficha y reporte grupal). Solo lectura: usa DESP (estado de pantalla).
function referidosDesplegableHTML(mid,rm,ry,clave){
  if(!DESP[clave])return "";
  return `<div style="margin:0 0 6px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);font-size:13px;line-height:1.7;color:rgba(255,255,255,.92)">
    ${nombresReferidosMes(mid,rm,ry).map(n=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>👤 ${escH(n)}</span><span style="opacity:.75;white-space:nowrap">bono 10 €</span></div>`).join("")}
  </div>`;
}
// Aporte NETO que corresponde pagar a un asociado ese mes (base − descuento, mínimo 0).
function aporteNetoMes(m,rm,ry){
  const {descuento}=descuentoReferidoMes(m.id,rm,ry);
  return Math.max(0, aporteMostradoMes(m,rm,ry).importe-descuento); // v45: incluye el aporte elegido ese mes
}
// v45.0 (decisión de Ángel 03/10/2026): en lo que ve el asociado (su enlace, el del grupo y la
// vista previa) un aporte AÚN NO PAGADO se muestra como «desde 50 €» (el mínimo, Maestro AP-1),
// nunca con lo que puso el mes pasado: no está obligado a repetirlo. Lo ya pagado se ve tal cual.
// El administrador sigue viendo el aporte habitual / elegido para cobrar.
let _VP=0;
function vistaPersonal(){ return _VP>0; }
function _enVistaPersonal(fn){ return function(){ _VP++; try{ return fn.apply(this,arguments); } finally{ _VP--; } }; }
const APORTE_MINIMO=50;
function _nBaseG(members,rm,ry){ return members.filter(m=>m.type==="asociado"&&activoEnReporte(m)&&aporteMostradoMes(m,rm,ry).base).length; }
function _nAbiertosG(members,rm,ry){ return members.filter(m=>m.type==="asociado"&&activoEnReporte(m)&&aporteMostradoMes(m,rm,ry).abierto).length; }
function aportePagadoMes(m,rm,ry){ const md=DATA.monthlyData&&DATA.monthlyData[getMesKey(rm,ry)]; return !!(md&&md.aportes&&md.aportes[m.id]===true); }
// En la vista personal, un aporte sin pagar queda «abierto»: no tiene importe (lo elige el asociado
// al pagar) y no suma en los totales; el total muestra lo que sí es fijo (cuotas) «+ tu aporte».
// v45.0 (decisión de Ángel 03/10/2026): en la vista del asociado un aporte sin pagar se muestra
// simplemente como «Aporte 50 €» (el aporte base, Maestro AP-1). Si paga más, Ángel lo cambia en
// el cierre y ya se ve lo pagado. La Guía para asociados explica que puede poner hasta 200 €.
function aporteMostradoMes(m,rm,ry){
  // v45.9 (decisión de Ángel 04/10/2026): quien tiene anotado un aporte habitual mayor de 50 € (AP-4,
  // hoy Christian Ramírez con 100 €) lo ve tal cual, para que su enlace y el del grupo cuadren con el cierre.

// v44.12: lo que quedó SIN PAGAR del mes anterior al del reporte (aporte + cuotas).
// Con el cambio automático de mes, evita que una deuda del mes pasado deje de verse.
// Solo lectura: no crea el registro del mes si no existe (regla crítica 7). Las cuotas
// aplazadas no cuentan (tienen su propio tratamiento) y la baja se respeta.
function pendienteMesAnterior(m,rm,ry){
  let pi=MONTHS.indexOf(rm)-1, py=ry; if(pi<0){pi=11;py--;}
  const pm=MONTHS[pi], pk=getMesKey(pm,py);
  let pend=0;
  [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
    (l.pays||[]).forEach((p,idx)=>{ if(p.m===pm&&p.y===py&&!p.paid&&!p.aplazada) pend+=cuotaDe(l,idx); });
  });
  const md=DATA.monthlyData&&DATA.monthlyData[pk];
  if(m.type!=="tercero"&&m.joinMonth&&md){
    const ji=MONTHS.indexOf(m.joinMonth), jy=m.joinYear;
    const yaEstaba=(jy<py)||(jy===py&&ji<=pi);
    if(yaEstaba&&cuentaComoActivo(m,pk)&&!(md.aportes&&md.aportes[m.id])){
      if(aporteMostradoMes(m,pm,py).abierto) var aporteAbierto=true; // vista personal: el aporte no tiene importe fijo
      else pend+=aporteNetoMes(m,pm,py);
    }
  }
  return {mes:pm,anio:py,pendiente:Math.round(pend*100)/100,aporteAbierto:!!aporteAbierto};
}
// ── v44.12: BONO POR REFERIDO (Documento Maestro §15.2) ─────────────────────────
// Registra un bono de 10 € para el asociado 'refId' por traer a 'nombre', en el mes
// 'mesKey' ("AAAA-MM"). Máximo 3 bonos por mes: si ese mes ya tiene 3, pasa al
// siguiente con hueco (el excedente no se pierde). Devuelve la clave del mes usado.
function registrarBonoReferido(refId,nombre,mesKey,d){
  d=d||DATA;
  if(!d.referidos)d.referidos={};
  if(!d.referidos[refId])d.referidos[refId]={};
  let [y,mo]=mesKey.split("-").map(Number);
  for(let i=0;i<36;i++){
    const k=y+"-"+String(mo).padStart(2,"0");
    const r=d.referidos[refId][k]||{n:0,nombres:""};
    if((r.n||0)<3){
      const nombres=(r.nombres||"").split(",").map(s=>s.trim()).filter(Boolean);
      nombres.push(nombre);
      d.referidos[refId][k]={n:(r.n||0)+1,nombres:nombres.join(", ")};
      return k;
    }
    mo++; if(mo>12){mo=1;y++;}
  }
  return null;
}
// Mes por defecto del bono: el mes del reporte; si el asociado que refirió ya pagó
// el aporte de ese mes, el siguiente (el descuento ya no se puede aplicar a un aporte cobrado).
function mesBonoPorDefecto(refId){
  const rm=DATA.reportMonth, ry=DATA.reportYear;
  const md=DATA.monthlyData&&DATA.monthlyData[getMesKey(rm,ry)];
  if(!(md&&md.aportes&&md.aportes[refId]))return getMesKey(rm,ry);
  let i=MONTHS.indexOf(rm)+1,y=ry; if(i>11){i=0;y++;}
  return getMesKey(MONTHS[i],y);
}
// Opciones del selector de mes del bono: 3 meses antes, el del reporte y 3 después.
function opcionesMesBono(selKey){
  const ri=MONTHS.indexOf(DATA.reportMonth),ry=DATA.reportYear;let h="";
  for(let i=-3;i<=3;i++){
    let mi=ri+i,yi=ry; while(mi<0){mi+=12;yi--;} while(mi>11){mi-=12;yi++;}
    const k=getMesKey(MONTHS[mi],yi);
    h+=`<option value="${k}" ${k===selKey?"selected":""}>${MONTHS_FULL[mi]} ${yi}</option>`;
  }
  return h;
}

function aplicarReferidoAlta(m,refId,mesKey){
  if(!m||!refId)return null;
  m.referidoPor=refId;

// v44.19: mes ("AAAA-MM") en el que 'refId' ya tiene registrado el bono por 'nombre', o null.
function mesBonoDe(refId,nombre,d){
  d=d||DATA; const r=(d.referidos&&d.referidos[refId])||{}; const n=_normNombre(nombre);
  return Object.keys(r).sort().find(k=>String(r[k].nombres||"").split(",").map(x=>_normNombre(x)).includes(n))||null;

// v44.19: quita el bono por 'nombre' de la ficha de 'refId' en los meses cuyo aporte aún no
// se ha cobrado (los meses ya cobrados no se tocan: ese descuento ya se aplicó en caja).
// Devuelve {quitados:[meses], cobrados:[meses que se dejan]}.
function quitarBonoReferido(refId,nombre){
  const out={quitados:[],cobrados:[]};
  const r=DATA.referidos&&DATA.referidos[refId]; if(!r)return out;
  const n=_normNombre(nombre);
  Object.keys(r).forEach(k=>{
    const lista=String(r[k].nombres||"").split(",").map(x=>x.trim()).filter(Boolean);
    if(!lista.some(x=>_normNombre(x)===n))return;
    const md=DATA.monthlyData&&DATA.monthlyData[k];
    if(md&&md.aportes&&md.aportes[refId]){ out.cobrados.push(k); return; }
    const resto=lista.filter(x=>_normNombre(x)!==n);
    const nNuevo=Math.max(0,(r[k].n||0)-(lista.length-resto.length));
    if(nNuevo>0)r[k]={n:nNuevo,nombres:resto.join(", ")}; else delete r[k];
    out.quitados.push(k);
  });
  if(Object.keys(r).length===0)delete DATA.referidos[refId];
  return out;
}

//   500 € a 3 meses → 167 capital + 25 retorno = 192 € cada mes (la app tenía 192/192/191)
//   400 € a 3 meses → 134 + 20 = 154 € cada mes (la app tenía 154/153/153)
//   250 € a 3 meses (asociados) → 84 + 12,50 = 96,50 € (la app tenía 96)
//   250 € a 3 meses (Javier Garcia, tercero) → 83 + 12,50 = 95,50 € (la app tenía 96)
// Solo se cambian las cuotas de meses hasta abril de 2026 (de las que hay acta original);
// el retorno (5 %) no cambia. El total del apoyo pasa a ser la suma de lo cobrado.
function parcheCuotasCobradas2026(data){
  if(!data||!data.members)return;
  if(!data.parches)data.parches={};
  if(data.parches.cuotasCobradas2026)return;
  if(!data.members.some(m=>m.id==="1"))return; // datos incompletos
  const MS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const idx=(mes,anio)=>anio*12+MS.indexOf(mes);
  const LIM=idx("Abr",2026), DESDE=idx("Sep",2025), HASTA=idx("Mar",2026);
  const real=(m,l)=>{
    if(l.n!==3)return null;
    if(l.capital===500)return 192;
    if(l.capital===400)return 154;
    if(l.capital===250)return m.type==="tercero"?95.5:96.5;
    return null;
  };

    const g=idx(l.gMonth,l.gYear); if(g<DESDE||g>HASTA)return;
    const v=real(m,l); if(v==null||!Array.isArray(l.cuotas)||l.cuotas.length!==(l.pays||[]).length)return;

function crearGrupo(principalId){
  if(!principalId)return;
  gruposCierre().push({id:"G"+Date.now(),principalId,miembros:[]});
  save();render();
}
function borrarGrupo(gid){
  DATA.gruposCierre=gruposCierre().filter(g=>g.id!==gid);

function añadirMiembroGrupo(gid,mid){
  if(!mid)return;
  const g=gruposCierre().find(x=>x.id===gid);
  if(g&&g.principalId!==mid&&!(g.miembros||[]).includes(mid)){
    if(!g.miembros)g.miembros=[];
    g.miembros.push(mid);
    save();render();

function marcarItemGrupo(tipo,mid,lid,pi){
  if(tipo==="aporte"){
    const md=getMesData(DATA.reportMonth,DATA.reportYear);
    if(!md.aportes)md.aportes={};
    md.aportes[mid]=!md.aportes[mid];
  } else {

    if(m)[...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{if(l.id===lid)l.pays[pi].paid=!l.pays[pi].paid;});
    recolocarAyudas();

function marcarTodoGrupo(gid){
  const g=gruposCierre().find(x=>x.id===gid);
  if(!g)return;
  itemsDeGrupo(g).forEach(it=>{
    if(it.yaPagado)return;
    if(it.tipo==="aporte"){
      const md=getMesData(DATA.reportMonth,DATA.reportYear);
      if(!md.aportes)md.aportes={};
      md.aportes[it.mid]=true;
    } else {

      if(m)[...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{if(l.id===it.lid)l.pays[it.pi].paid=true;});
    }
  });
  recolocarAyudas();recalcMesRecargo();save();render();

}
function recolocarAyudas(){
  DATA.members.forEach(m=>{
    const t=[...(m.loans||[]),...(m.closedLoans||[])];
    m.loans=t.filter(l=>l.pays.some(p=>!p.paid));
    m.closedLoans=t.filter(l=>l.pays.every(p=>p.paid));
  });
}

function cuotasDelMes(rm,ry){
  const out=[];
  DATA.members.forEach(m=>{
    [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
      l.pays.forEach((p,pi)=>{
        if(p.m===rm&&p.y===ry&&!p.compensada){ // v45.1: compensada al pagar una baja (SA-10)
          const rec=recargoPorCuota(l);
          const imp=cuotaDe(l,pi); // aplazada = solo retorno; normal = cuota exacta (l.cuotas)
          const cap=p.aplazada?0:Math.round((imp-rec)*100)/100;
          out.push({mid:m.id,nombre:m.name,tipo:m.type,lid:l.id,pi,inst:imp,
            recargo:rec,capital:cap,paid:p.paid,aplazada:!!p.aplazada,
            numCuota:pi+1,totalCuotas:l.pays.length,gMonth:l.gMonth,gYear:l.gYear});
        }
      });
    });
  });
  // asociados primero, terceros después
  return out.sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==="asociado"?-1:1));
}

function togglePay(mid,lid,pi){
  UNDO_SNAPSHOT=JSON.stringify(DATA);
  clearTimeout(UNDO_TIMER);

  let loanCompleted=false;
  DATA.members.forEach(m=>{
    if(m.id===mid){
      // Buscar en loans activos Y en closedLoans
      const allLoans=[...(m.loans||[]),...(m.closedLoans||[])];
      allLoans.forEach(l=>{if(l.id===lid)l.pays[pi].paid=!l.pays[pi].paid;});
      // Separar: loans con alguna cuota pendiente → activos; todos pagados → cerrados
      const activos=allLoans.filter(l=>l.pays.some(p=>!p.paid));
      const cerrados=allLoans.filter(l=>l.pays.every(p=>p.paid));
      if(cerrados.length>(m.closedLoans||[]).length)loanCompleted=true;
      m.loans=activos;
      m.closedLoans=cerrados;
    }
  });
  save();

  const msg=loanCompleted?"✅ Ayuda completada":"✓ Pago registrado — toca Deshacer si fue error";
  const t=document.getElementById("toast");
  t.innerHTML=`${msg} &nbsp;<span onclick="undoPay()" style="text-decoration:underline;cursor:pointer;font-weight:800">↩ Deshacer</span>`;
  t.classList.remove("hidden");
  clearTimeout(t._t);
  UNDO_TIMER=setTimeout(()=>{t.classList.add("hidden");UNDO_SNAPSHOT=null;},6000);

  render();
}

function undoPay(){
  if(!UNDO_SNAPSHOT)return;
  DATA=JSON.parse(UNDO_SNAPSHOT);
  UNDO_SNAPSHOT=null;
  clearTimeout(UNDO_TIMER);
  save();
  toast("↩ Pago deshecho ✓");
  render();
}

let _delLoanArmed=null;
// Recalcula los importes de un apoyo. ÚNICA función (junto con ayudaCuotas) que puede
// escribir total/inst/cuotas — ver REGLA PERMANENTE en las instrucciones del proyecto.
// - Sin cuotas aplazadas: usa ayudaCuotas tal cual (total y cuotas exactas, en euros
//   enteros, sum(cuotas)===total).
// - Con cuotas APLAZADAS: la aplazada paga en efectivo instAplazada = Math.ceil(capital*
//   tasa/100) — euro entero, v44.1 (NO es recargoPorCuota: esa función se queda en
//   céntimos exactos a propósito para recargoAutoMes/control 6/banner, que son magnitudes
//   contables, no importes que nadie paga en mano). El resto del total (también entero,
//   mismo criterio que ayudaTotal) se reparte de forma EQUILIBRADA entre las cuotas
//   normales (salto máximo de 1€, mismo criterio que ayudaCuotas — no se concentra la
//   diferencia en una sola cuota). l.cuotas queda en el mismo orden que l.pays;
//   l.total=suma(l.cuotas).
// l.inst queda solo como referencia visual (1ª cuota normal); el cálculo real usa l.cuotas.
function recalcularApoyo(l){
  const tasa=(l.rate!=null?l.rate:DATA.rate);
  l.n=l.pays.length;
  const nAplazadas=l.pays.filter(p=>p.aplazada).length;
  if(nAplazadas===0){
    const{total,cuotas}=ayudaCuotas(l.capital,l.n,tasa);
    l.total=total; l.cuotas=cuotas; l.inst=cuotas[0];
    return;
  }
  const instAplazada=Math.ceil(l.capital*(tasa/100)-1e-9); // importe en efectivo, euro entero
  const totalAyuda=ayudaTotal(l.capital,l.n,tasa); // también entero, mismo criterio que sin aplazadas
  const nNormales=l.n-nAplazadas;
  const restante=totalAyuda-nAplazadas*instAplazada; // lo que queda por repartir entre las normales
  // Reparto EQUILIBRADO (mismo criterio que ayudaCuotas): las primeras "restoN"
  // cuotas normales llevan 1€ más — salto máximo de 1€ entre cuotas normales.
  const baseN=nNormales>0?Math.floor(restante/nNormales):0;
  const restoN=nNormales>0?restante-baseN*nNormales:0;
  const cuotas=[];
  let iNormal=0;
  l.pays.forEach(p=>{
    if(p.aplazada){
      p.instAplazada=instAplazada;
      cuotas.push(instAplazada);
    }else{
      cuotas.push(iNormal<restoN?baseN+1:baseN);
      iNormal++;
    }
  });
  l.cuotas=cuotas;
  l.total=cuotas.reduce((s,c)=>s+c,0);
  const iPrimeraNormal=l.pays.findIndex(p=>!p.aplazada);
  l.inst=iPrimeraNormal>=0?cuotas[iPrimeraNormal]:instAplazada;
}

// FIX IPHONE: html2canvas y jsPDF se cargan LAZY aquí, solo cuando se necesitan
async function loadPDFLibs(){
  if(window.html2canvas&&window.jspdf)return true;
  return new Promise((resolve)=>{
    const s1=document.createElement("script");
    s1.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s1.onload=()=>{
      const s2=document.createElement("script");
      s2.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s2.onload=()=>resolve(true);
      s2.onerror=()=>resolve(false);
      document.head.appendChild(s2);
    };
    s1.onerror=()=>resolve(false);
    document.head.appendChild(s1);
  });
}

async function sharePDF(){
  if(BUSY)return;
  BUSY=true;render();
  toast("⏳ Cargando librerías PDF...",4000);

  const loaded=await loadPDFLibs();
  if(!loaded){toast("Error al cargar PDF. Comprueba tu conexión.");BUSY=false;render();return;}

  toast("📄 Generando PDF...",4000);
  try{
    const el=document.getElementById("capture");
    const canvas=await html2canvas(el,{backgroundColor:"#F5F0EB",scale:2,useCORS:true,logging:false});
    const{jsPDF}=window.jspdf;
    const imgData=canvas.toDataURL("image/jpeg",.92);
    const pW=100,pH=170,ratio=pW/canvas.width,totalH=canvas.height*ratio,pages=Math.ceil(totalH/pH);
    const pdf=new jsPDF({unit:"mm",format:[pW,pH]});
    for(let i=0;i<pages;i++){if(i>0)pdf.addPage([pW,pH]);pdf.addImage(imgData,"JPEG",0,-i*pH,pW,totalH);}
    const blob=pdf.output("blob");
    const file=new File([blob],`Reporte_${DATA.reportMonth}_${DATA.reportYear}.pdf`,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"Reporte NH"});toast("Compartido ✓");BUSY=false;render();return;}catch(e){if(e.name==="AbortError"){BUSY=false;render();return;}}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);toast("PDF descargado ✓");
  }catch(err){console.error(err);toast("Error al generar PDF");}
  BUSY=false;render();
}

// FIX IPHONE: shareImg también carga html2canvas lazy
async function shareImg(mid){
  const loaded=await loadPDFLibs();
  if(!loaded||typeof html2canvas==="undefined"){toast("⏳ Error al cargar. Inténtalo de nuevo.");return;}
  const el=document.getElementById("card-capture-"+mid);
  if(!el){toast("Error: ficha no encontrada");return;}
  const clone=el.cloneNode(true);
  clone.style.cssText="position:fixed;left:-9999px;top:0;width:380px;background:#F5F0EB;padding:12px;";
  clone.querySelectorAll("*").forEach(n=>{n.style.overflow="visible";n.style.maxHeight="none";});
  document.body.appendChild(clone);
  toast("📸 Generando imagen...",4000);
  try{
    const canvas=await html2canvas(clone,{backgroundColor:"#F5F0EB",scale:2.5,useCORS:true,logging:false,width:380,windowWidth:400});
    // FIX IPHONE: eliminar clone inmediatamente tras captura, antes de procesar blob
    if(document.body.contains(clone))document.body.removeChild(clone);
    canvas.toBlob(async(blob)=>{
      if(!blob){toast("Error al generar imagen");return;}
      const file=new File([blob],`Reporte_${DATA.reportMonth}_${DATA.reportYear}.png`,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:"Reporte Nuevos Horizontes"});toast("📸 Imagen enviada ✓");}
        catch(e){if(e.name!=="AbortError"){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);toast("📸 Imagen descargada ✓");}}
      }else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);toast("📸 Imagen descargada ✓");}
    },"image/png");
  }catch(e){
    if(document.body.contains(clone))document.body.removeChild(clone);
    console.error(e);toast("Error al generar imagen: "+e.message);
  }
}

// ¿Coincide el conjunto de ids seleccionado EXACTAMENTE con algún grupo de Cierre?
// (mismos miembros, sin importar el orden). Si coincide, se puede usar el enlace
// estable de ese grupo en vez del enlace con IDs congelados.
function grupoQueCoincide(ids){
  const set=new Set(ids);
  return (DATA.gruposCierre||[]).find(g=>{
    const gset=new Set([g.principalId,...(g.miembros||[])]);
    if(gset.size!==set.size)return false;
    for(const id of gset){ if(!set.has(id))return false; }
    return true;
  })||null;
}
function sendGroupLink(){
  const allVisible=DATA.members;

  MODAL={type:"grupo_link",ids,grupoMatch:grupoQueCoincide(ids)};
  render();
}

  let u=baseUrl()+"?grupo="+ids.map(id=>encodeURIComponent(id)).join(",");

  return u;
}

function addMemberSubmit(){
  const name=document.getElementById("m-name").value.trim();if(!name)return;
  const type=document.querySelector(".m-opt.active[data-type]")?.dataset.type||"asociado";
  // v45 (PE-1): un asociado no se da de alta sin permanencia
  const cicloEl=document.querySelector(".l-ci-opt.active"), apEl=document.querySelector(".l-ap-opt.active");
  if(type==="asociado"&&!cicloEl){toast("⛔ Elige su permanencia (12, 24, 36 meses o indefinida)",3500);return;}
  const cicloAlta=cicloEl?parseInt(cicloEl.dataset.ciclo):null, aporteAlta=apEl?parseInt(apEl.dataset.ap):50;
  const ref=type==="tercero"?(document.getElementById("m-ref")?.value||null):null; // ref = avalistaId (select), no texto libre
  // v44.12: referido (solo asociados) → bono de 10 € automático para quien lo trajo
  const refdoId=type==="asociado"?(document.getElementById("m-refdo")?.value||null):null;
  const bonoMes=refdoId?(document.getElementById("m-bono-mes")?.value||mesBonoPorDefecto(refdoId)):null;
  const msgBono=k=>{
    if(!k)return "";
    const r=DATA.members.find(x=>x.id===refdoId);const[yy,mm]=k.split("-").map(Number);
    if(aplicarReferidoAlta.yaExistia)return ` · ${r?r.name.split(" ")[0]:"El asociado"} ya tenía este bono en ${MONTHS_FULL[mm-1]} ${yy}: no se duplica (para cambiar el mes: Ficha → 🎁 Referido)`;
    return ` · bono de 10 € para ${r?r.name.split(" ")[0]:"el asociado"} en ${MONTHS_FULL[mm-1]} ${yy}`+(k!==bonoMes?" (ese mes ya tenía 3 bonos)":"");
  };
  // Si se añade un ASOCIADO y existe un TERCERO con el mismo nombre, fusionar
  if(type==="asociado"){
    const key=_normNombre(name); // mismo criterio que la auditoría (control 7): ignora tildes/mayúsculas/espacios
    const tercExist=DATA.members.find(x=>x.type==="tercero"&&_normNombre(x.name)===key);
    if(tercExist){
      if(confirm(`Ya existe un tercero con el nombre "${tercExist.name}".\n\n¿Convertirlo en asociado conservando todo su historial y ayudas activas?`)){
        const ok=mergeTerceroIntoAsociado(name,DATA.reportMonth,DATA.reportYear);
        if(ok){
          const conv=DATA.members.find(x=>x.type==="asociado"&&_normNombre(x.name)===key);
          if(conv){conv.ciclo=cicloAlta;conv.aporte=aporteAlta;}
          const k=refdoId?aplicarReferidoAlta(conv,refdoId,bonoMes):null;
          const solC=MODAL&&MODAL.sol;
          closeModal();save();toast("✓ Tercero convertido a asociado"+msgBono(k));
          if(solC&&conv)_solTrasAlta(solC,conv);
          return;
        }
      }else{
        return; // El admin canceló — no crear duplicado
      }
    }
  }
  const nuevo={id:"m"+Date.now(),name,type,ref,joinMonth:type==="asociado"?DATA.reportMonth:null,joinYear:type==="asociado"?DATA.reportYear:null,history:[],loans:[],phone:"",origen:"app"};
  if(type==="asociado"){nuevo.ciclo=cicloAlta;nuevo.aporte=aporteAlta;} // v45 (PE-1, AP-4)
  DATA.members.push(nuevo);
  const k=refdoId?aplicarReferidoAlta(nuevo,refdoId,bonoMes):null;
  const solN=MODAL&&MODAL.sol; // v45.14
  closeModal();save();toast("Miembro añadido ✓"+msgBono(k));
  if(solN)_solTrasAlta(solN,nuevo);
}

// v44.21: reglas del Maestro (§11.1) al conceder o editar un apoyo — las mismas que revisa la
// auditoría. Devuelve {bloqueo, aviso}: con bloqueo no se guarda; el aviso solo informa.
// v45 (Maestro v18.2 · AY-1, AY-5, AY-6): reglas al conceder o editar una ayuda. Devuelve
// {bloqueo, aviso}: con bloqueo no se guarda. Las ayudas concedidas antes de octubre 2026 se
// juzgan con las reglas del v17 (conservan sus condiciones · Maestro 16.1).
const AY_V18_DESDE=2026*12+MONTHS.indexOf("Oct");
function validarApoyo(m,cap,nn,tipo,ciclo,ini,concedida){
  const nom=escH(m?m.name.split(" ")[0]:"Esta persona");
  const v17=concedida&&_idxMes(concedida.m,concedida.y)<AY_V18_DESDE;
  const dondePerm="Gestión → ⚙️ Permanencia y aporte";
  if(cap<100)return {bloqueo:`El mínimo de una ayuda es 100 € (Maestro AY-1).`};
  if(tipo==="tercero"||tipo==="libre"){
    if(cap>500)return {bloqueo:`Un ${tipo==="libre"?"asociado libre":"tercero"} puede recibir como máximo 500 € (Maestro AY-1).`};
    if(nn>5)return {bloqueo:`Un ${tipo==="libre"?"asociado libre":"tercero"} devuelve la ayuda en 5 cuotas como máximo (Maestro AY-1).`};
    return {};
  }
  if(ciclo==null)return {bloqueo:`${nom} no tiene permanencia guardada. Guárdala primero en ${dondePerm} (Maestro PE-1).`};
  if(cap>3000)return {bloqueo:`El máximo de una ayuda es 3.000 € (Maestro AY-5).`};
  if(nn>12)return {bloqueo:`Una ayuda se devuelve en 12 cuotas como máximo (Maestro AY-1).`};
  if(ciclo===12&&(nn>5||(!v17&&cap>500))){
    return {bloqueo:v17
      ?`Con permanencia de 12 meses, la ayuda se devuelve en 5 cuotas como máximo (regla del v17).`
      :`Con permanencia de 12 meses, ${nom} puede recibir de 100 a 500 € y devolverlos en 5 cuotas como máximo (Maestro AY-1). Para más importe o más plazo, sube primero su permanencia a 24, 36 meses o indefinida en ${dondePerm}.`};
  }
  // No puede pasar del final de su permanencia (Maestro AY-1 y AY-6; misma regla que la auditoría, control 13)
  if(!v17&&ciclo!==0&&ini&&m&&m.joinMonth){
    const fin=_idxMes(m.joinMonth,m.joinYear)+ciclo-1, ult=_idxMes(ini.m,ini.y)+nn-1; // v45.8 (Maestro v18.5): fin = último mes de permanencia
    if(ult>fin){
      const t=x=>MONTHS_FULL[x%12].toLowerCase()+" "+Math.floor(x/12);
      return {bloqueo:`La última cuota sería en ${t(ult)}, pero la permanencia de ${nom} (${ciclo} meses) termina en ${t(fin)} y la última cuota tiene que pagarse como mucho ese mes (Maestro AY-1). Usa menos cuotas o sube primero su permanencia en ${dondePerm}.`};
    }
  }
  if(cap>1000)return {aviso:`Entre 1.000 € y 3.000 € necesita la aprobación previa del coordinador (Maestro AY-5).`};
  return {};
}
function _condicionActual(m){ return {tipo:m?m.type:"asociado", ciclo:m&&m.ciclo!=null?m.ciclo:null}; } // v45: sin permanencia guardada → se bloquea (PE-1)

  const cicloEnConcesion=mOr&&mOr.ciclo!=null?mOr.ciclo:null; // v45: sin inventar (antes 0 = indefinida)
  DATA.members.forEach(m=>{if(m.id===MODAL.mid){const lid="l"+Date.now();m.loans.push({id:lid,gMonth:gm,gYear:gy,capital:cap,total,n:nn,inst,cuotas,rate,pays,tipoEnConcesion,avalistaEnConcesion,cicloEnConcesion});if(!m.history)m.history=[];m.history.push({gMonth:gm,gYear:gy,capital:cap,lid});}});
  closeModal();toast("Ayuda añadida ✓");save();
}

let _delHistArmed=null;
function delHistEntry(mid,idx){
  const key=mid+"|"+idx;
  if(_delHistArmed!==key){
    _delHistArmed=key; render(); toast("Toca de nuevo ✕ para eliminar esta entrada");
    setTimeout(()=>{if(_delHistArmed===key){_delHistArmed=null;render();}},4000);
    return;
  }
  _delHistArmed=null;
  const m=DATA.members.find(x=>x.id===mid);
  if(m&&Array.isArray(m.history)){m.history.splice(idx,1);}
  save();toast("Entrada eliminada ✓");render();
}

function updateEditPreview(){
  const cap=parseInt(document.getElementById("el-cap")?.value)||0;
  const nn=parseInt(document.getElementById("el-n")?.value||"3");
  if(cap<=0){document.getElementById("el-preview").innerHTML="";return;}
  const{total,cuotas}=ayudaCuotas(cap,nn,DATA.rate);
  const base=cuotas[0],ultima=cuotas[cuotas.length-1];
  const cuotaTxt=(cuotas.length>1&&base!==ultima)?`${fmtEur(base)} € (última ${fmtEur(ultima)} €)`:`${fmtEur(base)} €`;
  document.getElementById("el-preview").innerHTML=`<div class="m-summary"><div style="font-size:13px;color:var(--muted);margin-bottom:4px">Resumen</div><div style="display:flex;justify-content:space-between;font-size:15px"><span>Total (${DATA.rate}% × ${nn})</span><span style="font-weight:700">${fmtEur(total)} €</span></div><div style="display:flex;justify-content:space-between;font-size:15px;margin-top:4px"><span>Cuota mensual</span><span style="font-weight:700;color:var(--warm)">${cuotaTxt}</span></div></div>`;
}
function quitarAplazamiento(idx){
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  const l=m&&m.loans.find(x=>x.id===MODAL.lid);
  if(!l||!l.pays[idx]||!l.pays[idx].aplazada){toast("Esa cuota no está aplazada");return;}
  UNDO_SNAPSHOT=JSON.stringify(DATA);
  clearTimeout(UNDO_TIMER);
  // 1) Devolver la cuota a normal
  delete l.pays[idx].aplazada;
  delete l.pays[idx].instAplazada;
  // 2) Quitar UNA cuota extra del final que esté sin pagar y sin aplazar
  //    (la que se había añadido al aplazar). Se busca desde el final.
  for(let i=l.pays.length-1;i>=0;i--){
    if(!l.pays[i].paid && !l.pays[i].aplazada && i!==idx){ l.pays.splice(i,1); break; }
  }
  // 3) Recalcular respetando las aplazadas que queden
  recalcularApoyo(l);
  save();
  toast("↩︎ Aplazamiento retirado · plazo "+l.n+" cuotas");
  render();
}
function aplazarDesdeEditor(){
  const sel=document.getElementById("el-aplazar-mes");
  const idx=sel?parseInt(sel.value):NaN;
  if(isNaN(idx)){toast("Elige primero el mes a aplazar");return;}
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  const l=m&&m.loans.find(x=>x.id===MODAL.lid);
  if(!l){closeModal();return;}
  const p=l.pays[idx];
  if(!p||p.paid||p.aplazada){toast("Esa cuota no se puede aplazar");return;}
  UNDO_SNAPSHOT=JSON.stringify(DATA);
  clearTimeout(UNDO_TIMER);
  // 1) Marcar como aplazada (solo retorno)
  p.aplazada=true;
  // 2) Añadir una cuota nueva al final (capital recuperado + su retorno)
  const ultima=l.pays[l.pays.length-1];
  let mi=MONTHS.indexOf(ultima.m), yr=ultima.y;
  mi++; if(mi>=12){mi=0;yr++;}
  l.pays.push({m:MONTHS[mi],y:yr,paid:false});
  // 3) Recalcular respetando aplazadas
  recalcularApoyo(l);
  save();
  toast("✓ "+p.m+" "+p.y+" aplazada · plazo "+l.n+" cuotas");
  render(); // reabre el modal con el estado actualizado
}
let _saveEditArmed=false;
function saveEditLoan(){
  const btn=document.getElementById("btnSaveEditLoan");
  if(!_saveEditArmed){
    _saveEditArmed=true;
    if(btn){btn.textContent="✓ Confirmar guardado";btn.style.background="#E07A3A";}
    toast("Toca de nuevo para confirmar los cambios");
    setTimeout(()=>{_saveEditArmed=false;if(btn){btn.textContent="Guardar cambios";btn.style.background="";}},4000);
    return;
  }
  _saveEditArmed=false;
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  const l=m&&m.loans.find(x=>x.id===MODAL.lid);
  if(!l){closeModal();return;}
  const cap=parseInt(document.getElementById("el-cap").value)||0;if(cap<=0){alert("Capital inválido");return;}
  const nn=parseInt(document.getElementById("el-n")?.value||"3");
  { // v44.21: se valida con la condición que tenía al concederse
    const tipo=l.tipoEnConcesion!=null?l.tipoEnConcesion:m.type, ciclo=l.cicloEnConcesion!=null?l.cicloEnConcesion:(m.ciclo!=null?m.ciclo:12);
    const nApl=(l.pays||[]).filter(p=>p.aplazada).length,
      v=validarApoyo(m,cap,nn-nApl,tipo,ciclo,{m:document.getElementById("el-sm").value,y:parseInt(document.getElementById("el-sy").value)},{m:l.gMonth,y:l.gYear});
    if(v.bloqueo){ toast("⛔ "+v.bloqueo.replace(/<[^>]+>/g,""),7000); return; } }
  const gm=document.getElementById("el-gm").value,gy=parseInt(document.getElementById("el-gy").value);
  const sm=document.getElementById("el-sm").value,sy=parseInt(document.getElementById("el-sy").value);
  // Preservar estado 'paid' Y 'aplazada' por mes-año al reconstruir
  const prev={};
  l.pays.forEach(p=>{prev[p.m+"-"+p.y]={paid:!!p.paid,aplazada:!!p.aplazada};});
  const pays=[];let mi=MONTHS.indexOf(sm),yr=sy;
  for(let i=0;i<nn;i++){
    const k=MONTHS[mi]+"-"+yr;
    const st=prev[k]||{};
    pays.push({m:MONTHS[mi],y:yr,paid:!!st.paid,...(st.aplazada?{aplazada:true}:{})});
    mi++;if(mi>=12){mi=0;yr++;}
  }
  l.capital=cap;l.gMonth=gm;l.gYear=gy;l.pays=pays;

}

function mesesToStr(n,ciclo){
  if(ciclo===0)return "Permanencia indefinida · mes "+n;
  if(n<=12)return "Año 1 de permanencia (mes "+n+" de 12)";
  if(n<=24)return "Año 2 de permanencia (mes "+(n-12)+" de 12)";
  return "Año 3 de permanencia (mes "+(n-24)+" de 12)";
}

// Devuelve el "mes objetivo" del asociado: el primer mes (desde el mes del
// reporte hacia adelante) en el que todavía queda algo pendiente — ya sea el
// aporte mensual sin marcar o alguna cuota de ayuda de ese mes sin pagar.
// Si junio está completo (aporte Y cuotas), avanza solo a julio, etc.
function mesObjetivo(m){
  const esTerc=m.type==="tercero";
  let mi=MONTHS.indexOf(DATA.reportMonth);
  let y=DATA.reportYear;
  // Tope normal: el mes de reporte (nadie "debe" un mes que aún no ha llegado).
  // A partir del día de aviso (por defecto 25), se permite avanzar UN mes más,
  // para que los que pagan por anticipado vean ya el próximo pago pendiente.
  const permiteSiguiente = avisoSiguienteActivo(); // v44.12: no adelanta si la app ya pasó de mes
  const topeMi=mi + (permiteSiguiente?1:0);
  const todosLoans=[...(m.loans||[]),...(m.closedLoans||[])];
  // Avanzar como máximo 24 meses para evitar bucles
  for(let step=0; step<24; step++){
    const mm=MONTHS[mi%12];
    const yy=y+Math.floor(mi/12);
    // ¿aporte de este mes pendiente? (terceros no pagan aporte)
    const md=getMesData(mm,yy);
    const aporteOk = esTerc ? true : !!(md.aportes&&md.aportes[m.id]);
    // ¿alguna cuota de ayuda corresponde a este mes y está sin pagar?
    let cuotaPendiente=false;
    todosLoans.forEach(l=>{
      l.pays.forEach(p=>{
        if(p.m===mm && p.y===yy && !p.paid)cuotaPendiente=true;
      });
    });
    // Este mes tiene algo pendiente si: el aporte falta, o hay una cuota sin pagar
    if((!esTerc && !aporteOk) || cuotaPendiente){
      return {mes:mm, anio:yy};
    }
    // Todo cubierto en este mes. No pasar del tope permitido: si ya llegamos,
    // el asociado está al día (aunque haya adelantado meses futuros).
    if(mi>=topeMi){
      const tm=MONTHS[topeMi%12], ty=DATA.reportYear+Math.floor(topeMi/12);
      return {mes:tm, anio:ty};
    }
    mi++;
  }
  // Fallback: mes del reporte
  return {mes:DATA.reportMonth, anio:DATA.reportYear};
}

// Total de lo que corresponde a una ficha en el MES DE REPORTE (Opción A):
// aporte (con descuento por referido) + TODAS las cuotas de ese mes (aplazadas
// cuentan su retorno). "Al día" SOLO si aporte Y todas las cuotas están pagados.
// Función única usada por la ficha personal y el reporte grupal para que nunca
// se descuadren entre sí.
function totalDelMes(m,rm,ry){
  const esTerc=m.type==="tercero";
  const md=getMesData(rm,ry);
  // Aporte (terceros no aportan)
  const aportePagado=esTerc?true:!!(md.aportes&&md.aportes[m.id]);
  // Aporte neto = base + extra puntual − descuento por referido (mínimo 0)
  const aporteImporte=esTerc?0:aporteNetoMes(m,rm,ry); // v45: aporte elegido ese mes − bono
  // Cuotas que vencen ESTE mes (todos los apoyos), con importe real (aplazada=retorno)
  const cuotas=[];
  [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
    l.pays.forEach((p,idx)=>{
      if(p.m===rm&&p.y===ry){
        const imp=cuotaDe(l,idx);
        cuotas.push({inst:imp,paid:!!p.paid,aplazada:!!p.aplazada,idx,loan:l});
      }
    });
  });
  const totalCuotas=Math.round(cuotas.reduce((s,c)=>s+c.inst,0)*100)/100;
  const total=Math.round(((esTerc?0:aporteImporte)+totalCuotas)*100)/100; // total del mes (todo lo que corresponde)
  // Pendiente = lo que aún NO está pagado
  const aportePend=(!esTerc&&!aportePagado)?aporteImporte:0;
  const cuotasPend=Math.round(cuotas.filter(c=>!c.paid).reduce((s,c)=>s+c.inst,0)*100)/100;
  const pendiente=Math.round((aportePend+cuotasPend)*100)/100;
  // Al día SOLO si aporte pagado (o tercero) Y todas las cuotas pagadas
  const alDia=(esTerc||aportePagado)&&cuotas.every(c=>c.paid);
  return {total,pendiente,alDia,aporteImporte,aportePagado,cuotas,totalCuotas,esTerc};
}

function desgloseDelMes(m){
  // El cuadro se basa en el MES OBJETIVO (próximo mes con algo pendiente),
  // no en el mes del sistema. Así, al pagar junio completo, salta a julio.
  const obj=mesObjetivo(m);
  const rm=obj.mes, ry=obj.anio;
  const md=getMesData(rm,ry);
  const fee=DATA.monthlyFee;

  // Aporte base
  const aportePagado=!!(md.aportes&&md.aportes[m.id]);
  const apExtra=0; // v45: el aporte elegido ese mes ya va en aporteBrutoMes

  // Descuento por referidos
  const refData=(DATA.referidos&&DATA.referidos[m.id]&&DATA.referidos[m.id][getMesKey(rm,ry)])||null;
  const nReferidos=refData?Math.min(refData.n,3):0;
  const descuento=nReferidos*10;

  // Cuotas que corresponden EXACTAMENTE al mes objetivo (no adelantar la
  // siguiente por cascada). Si la cuota de este mes ya está pagada, se muestra
  // marcada como pagada; la del mes siguiente no aparece hasta que el mes
  // objetivo avance (día de aviso). El desplegable de Ayudas sigue mostrando todas.
  const cuotasMes=[];
  const todosLoans=[...(m.loans||[]),...(m.closedLoans||[])];
  todosLoans.forEach(l=>{
    (l.pays||[]).forEach((p,idx)=>{
      if(p.m===rm && p.y===ry){
        const imp=cuotaDe(l,idx);
        cuotasMes.push({loan:l,idx,inst:imp,paid:p.paid,aplazada:!!p.aplazada});
      }
    });
  });
  // Solo suman al total las cuotas de este mes que estén SIN pagar
  const totalCuotas=Math.round(cuotasMes.reduce((s,c)=>s+(c.paid?0:c.inst),0)*100)/100;

  // Total neto — terceros solo pagan cuotas, no aporte mensual
  const esTerc=m.type==="tercero";
  const apNeto=esTerc?0:aporteNetoMes(m,rm,ry); // v45
  const totalNeto=Math.round((apNeto+totalCuotas)*100)/100;

  // Valores de PENDIENTE REAL (descontando lo ya pagado), para el cuadro individual:
  // si el aporte del mes objetivo ya está pagado, no cuenta como pendiente.
  const apNetoPend = (esTerc || aportePagado) ? 0 : apNeto;
  const totalPendiente = Math.round((apNetoPend+totalCuotas)*100)/100; // totalCuotas ya excluye las pagadas
  const alDia = totalPendiente===0;

  return{fee,apExtra,descuento,nReferidos,cuotasMes,totalCuotas,apNeto,totalNeto,apNetoPend,totalPendiente,alDia,aportePagado,esTerc,mesObj:rm,anioObj:ry};
}

function esUltimaCuota(loan,pi){ return !!loan&&Array.isArray(loan.pays)&&loan.pays.length>1&&pi===loan.pays.length-1; }

// v44.17 — ¿Ha subido de nivel el beneficio por permanencia este mes o el anterior (respecto
// al mes del sistema)? Devuelve {antes,ahora,nivel,meses,mesNombre,anio,doble} o null. El
// aviso se ve en la ficha durante el mes de la subida y el siguiente. Solo lectura: no escribe.
function subidaNivelReciente(m,rm,ry){
  if(!m||m.type!=="asociado"||!m.joinMonth||!m.joinYear)return null;
  const k=(y,i)=>y+"-"+String(i+1).padStart(2,"0");
  const i0=MONTHS.indexOf(rm);
  for(let atras=0;atras<=1;atras++){
    let i=i0-atras,y=ry; if(i<0){i+=12;y--;}
    let ip=i-1,yp=y; if(ip<0){ip+=12;yp--;}
    if(!cuentaComoActivo(m,k(y,i)))continue;
    const antes=tarifaNivelMes(m,k(yp,ip)), ahora=tarifaNivelMes(m,k(y,i));
    if(antes>0&&ahora>antes){
      const nivel=ahora>=15?3:2;
      return {antes,ahora,nivel,meses:nivel===3?24:12,
              mesNombre:MONTHS_FULL[i].toLowerCase(),anio:y,doble:false};
    }
  }
  return null;
}
// v45 (Maestro v18.2 · PE-5, PE-7): permanencias que terminan (aviso un mes antes) y aniversarios
// de la indefinida (cada 12 meses puede retirar el beneficio guardado). Solo lectura.
function avisosPermanencia(rm,ry){
  const idx=_idxMes(rm,ry), out=[];
  const t=x=>MONTHS_FULL[x%12].toLowerCase()+" "+Math.floor(x/12);
  DATA.members.forEach(m=>{
    if(m.type!=="asociado"||!m.joinMonth||m.ciclo==null||!activoEnReporte(m))return;
    const ini=_idxMes(m.joinMonth,m.joinYear);
    if(m.ciclo===0){
      for(const fin of [idx,idx+1]){ // aniversario este mes o el siguiente
        const n=fin-ini+1; // meses de permanencia cumplidos en 'fin' (el de entrada = 1)
        if(n>=12&&n%12===0){ out.push({m,tipo:"aniv",fin,txt:`Cumple ${n} meses de permanencia indefinida en ${t(fin)}: puede retirar su beneficio guardado (hoy ${fmtEur(beneficioGuardado(m))} €) y seguir.`}); break; }
      }
      return;
    }
    const fin=ini+m.ciclo-1; // último mes de su permanencia
    if(idx===fin-1||idx===fin){
      out.push({m,tipo:"fin",fin,txt:`Su permanencia de ${m.ciclo} meses termina en ${t(fin)}. Acordad si amplía (puede retirar su beneficio guardado, hoy ${fmtEur(beneficioGuardado(m))} €) o termina (cobra entre el 5 y el 10 de ${t(fin+1)}).`});
    }else if(idx>fin){
      out.push({m,tipo:"pasada",fin,txt:`Su permanencia de ${m.ciclo} meses terminó en ${t(fin)} y no consta que la haya ampliado. Anota la decisión: amplía en ⚙️ Permanencia y aporte, o da la salida.`});
    }
  });
  return out;
}
// v45.1 (Maestro v18.3 · FO-4): salidas de dinero de este mes y del siguiente. «Comprometido» =
// ya decidido (salidas, retiradas de beneficio, aportes temporales a devolver); «posible» =
// permanencias que terminan o aniversarios de la indefinida sin decisión anotada. Solo lectura.
function salidasPrevistas(rm,ry){
  const idx=_idxMes(rm,ry), hasta=idx+1, out=[];
  DATA.members.forEach(m=>{
    if(m.baja&&!m.baja.pagada){ const p=mesPagoBaja(m.baja), pi=_idxMes(p.mes,p.anio);
      if(pi<=hasta)out.push({m,clase:"comp",tipo:"baja",pagoIdx:pi,importe:datosBaja(m).total,txt:"Salida del fondo"}); }
    retiradasDe(m).forEach(r=>{ if(r.pagada)return; const pi=pagoRetiradaIdx(r);
      if(pi<=hasta)out.push({m,clase:"comp",tipo:"retirada",pagoIdx:pi,importe:importeRetirada(m,r),txt:"Retira su beneficio guardado"}); });

        cont+=`<div class="ft-row"><span class="ft-lbl">${r.mes} ${r.anio}${etqExtra}</span><span class="ft-val"><span style="color:#2D6A4F;font-weight:700">+ ${r.bn} €</span></span></div>`;

    {

        <b>Ejemplo:</b> si ingresaste en <b>${mesIng}</b>, tu permanencia empieza a contar ese mes y tu primer beneficio aparece en <b>${mesSig}</b>.<br><br>

  /* ── PESTAÑA AYUDAS ── */
  if(FICHA_TAB==="ayudas"){

      h+=`<div class="ft-card"><div class="ft-empty">Sin ayudas registradas.</div></div>`;

        const activeIdx=activePayIndex(loan,rm,ry);
        const pagadas=loan.pays.filter(p=>p.paid).length;

          const isActive=(pi===activeIdx)&&!esCerrada;

            c+=`<button class="cuota cuota-${st}${esUltimaCuota(loan,pi)?" cuota-ultima":""}" onclick="togglePay('${esc(m.id)}','${esc(loan.id)}',${pi});render()"><div class="cuota-month">${p.m}</div><div class="cuota-val" style="white-space:nowrap">${fmtEur(cuotaDe(loan,pi))} €</div><div class="cuota-status">${p.aplazada&&!p.paid?"⏸ APLAZ.":p.paid?"PAGADO":isActive?"POR PAGAR":"—"}</div></button>`;
          }
        });
        c+=`</div></div>`;
        return c;
      };

      // AYUDAS ACTIVAS
      h+=`<div class="ft-section-title">🟢 Ayudas activas (${activasL.length})</div>`;
      if(activasL.length>0){
        activasL.forEach(loan=>{ h+=tarjetaAyuda(loan,false); });
      } else {
        h+=`<div class="ft-card"><div class="ft-empty">No tiene ayudas activas.</div></div>`;
      }

      // AYUDAS PAGADAS (desplegable)
      if(pagadasL.length>0){
        let contP="";
        pagadasL.forEach(loan=>{ contP+=tarjetaAyuda(loan,true); });
        const totalPag=pagadasL.reduce((s,l)=>s+l.capital,0);
        h+=dropFicha(mid,"ayudaspag","✅ Ayudas pagadas ("+pagadasL.length+")",totalPag+" €",contP,isOpen("ayudaspag"));

      // Total
      h+=`<div class="ft-card ft-card-soft">
        <div class="ft-row ft-total"><span class="ft-lbl">Total de ayudas recibidas</span><span class="ft-val" style="color:#C75B0E">${totalAyudasRec} €</span></div>
      </div>`;
    }
  }

  /* ── PESTAÑA APORTES ── */
  if(FICHA_TAB==="aportes" && !isTerc){
    // Resumen de aportes (regulares + extra)
    const permTxt=m.ciclo===0?"Indefinida":m.ciclo!=null?`${m.ciclo} meses`:"⛔ sin guardar";
    h+=`<div class="ft-card">
      <div class="ft-card-title">💰 Resumen de aportes</div>
      <div class="ft-row"><span class="ft-lbl">Mes de ingreso</span><span class="ft-val">${MF[MS.indexOf(m.joinMonth)]} ${m.joinYear}</span></div>
      <div class="ft-row"><span class="ft-lbl">Permanencia</span><span class="ft-val">${permTxt}</span></div>
      <div class="ft-row"><span class="ft-lbl">${vistaPersonal()?"Aporte mínimo":"Aporte habitual"}</span><span class="ft-val">${vistaPersonal()?APORTE_MINIMO:aporteBase} € al mes</span></div>
      <div class="ft-row"><span class="ft-lbl">Meses pagados</span><span class="ft-val">${cuotasPagadas}</span></div>`;
    h+=`<div class="ft-row ft-total"><span class="ft-lbl">Total aportado al fondo</span><span class="ft-val" style="color:#2D6A4F">${totalAportado} €</span></div>
    </div>`;

    // Detalle de aportes extra (con su mes)
    const exMap=(DATA.extras&&DATA.extras[m.id])||{};
    const refMap=(DATA.referidos&&DATA.referidos[m.id])||{};
    const claves=Object.keys(refMap).filter(k=>refMap[k]&&refMap[k].n>0).sort(); // v45: los meses con otro aporte se ven en el historial
    if(claves.length>0){
      h+=`<div class="ft-card">
        <div class="ft-card-title">🎁 Bonos por referido</div>`;
      claves.forEach(k=>{
        const [yy,mm]=k.split("-"); const mesNom=MF[parseInt(mm)-1]+" "+yy;
        if(refMap[k]&&refMap[k].n>0)
          h+=`<div class="ft-row"><span class="ft-lbl">🎁 Bono referido · ${mesNom} (${refMap[k].n})${refMap[k].nombres?" — "+escH(refMap[k].nombres):""}</span><span class="ft-val" style="color:#C0492C">− ${refMap[k].n*10} €</span></div>`;
      });
      h+=`</div>`;
    }

    // Aportaciones puntuales al fondo
    if(puntuales.length>0){
      h+=`<div class="ft-card">
        <div class="ft-card-title">🏦 Aportaciones puntuales al fondo</div>`;
      puntuales.forEach((ap,api)=>{
        h+=`<div class="ft-row" style="align-items:flex-start">
          <span class="ft-lbl">${ap.capital} € · ${escH(ap.mes)} ${ap.anio} · plazo ${ap.plazo}m<br><span style="font-size:11px;color:var(--muted)">Recupera ${ap.total} € (capital +5%) en ${escH(ap.mesDev)} ${ap.anioDev}</span></span>
          <span style="text-align:right;white-space:nowrap">
            <span class="ft-val" style="color:${ap.devuelto?'#2D6A4F':'#B08D3E'};display:block">${ap.devuelto?"Devuelto ✅":"Activo ⏳"}</span>
            ${readonly?"":`<button class="ap-toggle-btn" onclick="togglePuntualDevuelto('${esc(m.id)}',${api});render()">${ap.devuelto?"Marcar activo":"Marcar devuelto"}</button>`}
          </span>
        </div>`;
      });
      h+=`</div>`;
    }

    // Historial de aportes mensuales (qué meses ha aportado, desde su ingreso)
    if(m.joinMonth){
      const filas=[];
      const exMap2=(DATA.extras&&DATA.extras[m.id])||{};
      const ji=MS.indexOf(m.joinMonth), jy=m.joinYear;
      const ri=MS.indexOf(rm), ry3=ry;
      let cm=ji, cy=jy;
      while(cy<ry3||(cy===ry3&&cm<=ri)){
        const k=cy+"-"+String(cm+1).padStart(2,"0");
        const md2=(DATA.monthlyData&&DATA.monthlyData[k])||{};
        const pagado=!!(md2.aportes&&md2.aportes[m.id]);
        filas.push({mes:MS[cm],anio:cy,pagado,importe:aporteBrutoKey(m,k),key:k});
        cm++; if(cm>=12){cm=0;cy++;}
      }
      if(filas.length>0){
        let contH="";
        const nPag=filas.filter(f=>f.pagado).length;
        filas.slice().reverse().forEach(f=>{
          contH+=`<div class="ft-row"><span class="ft-lbl">${escH(f.mes)} ${f.anio}</span><span class="ft-val" style="color:${f.pagado?'#1B4332':'#C0492C'}">${f.pagado?f.importe+" € ✅":vistaPersonal()?"Pendiente ⏳":"Pendiente ⏳ ("+f.importe+" €)"}</span></div>`;
        });
        h+=dropFicha(mid,"apthist","📅 Historial de aportes mensuales",nPag+" de "+filas.length+" pagados",contH,isOpen("apthist"));
      }
    }
  }


  /* ────────────────────────────────────────────────
     7. GESTIÓN RÁPIDA (solo admin)
  ──────────────────────────────────────────────── */
  if(!readonly){
    h+=`<div class="ficha-section" style="margin-top:4px">
      <div class="ficha-sec-title">⚙️ Gestión</div>
      <div class="mgmt-grid">
        <button class="mgmt-btn primary" onclick="solDesdeGestion('${esc(m.id)}')">＋ Nueva solicitud</button>
        ${isTerc?"":`<button class="mgmt-btn warn" onclick="openModal('extra',{mid:'${esc(m.id)}'})">💶 Aporte de un mes</button>`}
        <button class="mgmt-btn purple" onclick="openModal('referido',{mid:'${esc(m.id)}'})">🎁 Referido</button>
        ${isTerc?"":`<button class="mgmt-btn secondary" onclick="openModal('ciclo',{mid:'${esc(m.id)}'})">⚙️ Permanencia y aporte</button>`}
        ${isTerc?"":`<button class="mgmt-btn" style="background:#2D6A4F;color:#fff" onclick="abrirSimulador('${esc(m.id)}','ayuda')">🧮 Simuladores</button>`}
        <button class="mgmt-btn" style="background:#1B4332;color:#fff" onclick="openModal('puntual',{mid:'${esc(m.id)}'})">🏦 Aporte temporal</button>
        ${isTerc?`<button class="mgmt-btn" style="background:var(--terc);color:#fff" onclick="openModal('avalista',{mid:'${esc(m.id)}'})">🤝 Cambiar avalista</button>`:""}
      </div>
    </div>`;
  } else {
    h+=`<div style="text-align:center;padding:16px 0 28px;font-size:12px;color:var(--muted)">
      Vista personal · Solo lectura<br>Para cualquier consulta contacta con el administrador
    </div>`;
  }

  return h;
}

function selectorMesAnio(idMes,idAnio,mesSel,anioSel){
  mesSel=mesSel||DATA.reportMonth; anioSel=anioSel||DATA.reportYear;
  let opM='';
  MONTHS.forEach((m,i)=>{opM+=`<option value="${m}" ${m===mesSel?"selected":""}>${MONTHS_FULL[i]}</option>`;});
  let opY='';
  YEARS.forEach(y=>{opY+=`<option value="${y}" ${y===anioSel?"selected":""}>${y}</option>`;});

    <select id="${idAnio}" class="m-input" style="flex:1">${opY}</select>

}
