// FIX IPHONE: shareImg también carga html2canvas lazy
async function shareImg(mid){
  const loaded=await loadPDFLibs();
  if(!loaded||typeof html2canvas==="undefined"){toast("⏳ Error al cargar. Inténtalo de nuevo.");return;}
  const el=document.getElementById("card-capture-"+mid);
  if(!el){toast("Error: ficha no encontrada");return;}
  const clone=el.cloneNode(true);
  clone.style.cssText="position:fixed;left:-9999px;top:0;width:380px;background:#F5F0EB;padding:12px;";
  clone.querySelectorAll("*").forEach(n=>{n.style.overflow="visible";n.style.maxHeight="none";});
  document.body.appendChild(clone);
  toast("📸 Generando imagen...",4000);
  try{
    const canvas=await html2canvas(clone,{backgroundColor:"#F5F0EB",scale:2.5,useCORS:true,logging:false,width:380,windowWidth:400});
    // FIX IPHONE: eliminar clone inmediatamente tras captura, antes de procesar blob
    if(document.body.contains(clone))document.body.removeChild(clone);
    canvas.toBlob(async(blob)=>{
      if(!blob){toast("Error al generar imagen");return;}
      const file=new File([blob],`Reporte_${DATA.reportMonth}_${DATA.reportYear}.png`,{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{await navigator.share({files:[file],title:"Reporte Nuevos Horizontes"});toast("📸 Imagen enviada ✓");}
        catch(e){if(e.name!=="AbortError"){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);toast("📸 Imagen descargada ✓");}}
      }else{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);toast("📸 Imagen descargada ✓");}
    },"image/png");
  }catch(e){
    if(document.body.contains(clone))document.body.removeChild(clone);
    console.error(e);toast("Error al generar imagen: "+e.message);
  }
}

// ¿Coincide el conjunto de ids seleccionado EXACTAMENTE con algún grupo de Cierre?
// (mismos miembros, sin importar el orden). Si coincide, se puede usar el enlace
// estable de ese grupo en vez del enlace con IDs congelados.
function grupoQueCoincide(ids){
  const set=new Set(ids);
  return (DATA.gruposCierre||[]).find(g=>{
    const gset=new Set([g.principalId,...(g.miembros||[])]);
    if(gset.size!==set.size)return false;
    for(const id of gset){ if(!set.has(id))return false; }
    return true;
  })||null;
}
function sendGroupLink(){
  const allVisible=DATA.members;
  const ids=[...SEND_SELECTED].filter(id=>allVisible.some(m=>m.id===id));
  if(ids.length<2){toast("Selecciona al menos 2 fichas");return;}
  MODAL={type:"grupo_link",ids,grupoMatch:grupoQueCoincide(ids)};
  render();
}
function buildGrupoUrl(ids,yo){
  let u=baseUrl()+"?grupo="+ids.map(id=>encodeURIComponent(id)).join(",");
  if(yo)u+="&yo="+encodeURIComponent(yo);
  return u;
}
// Enlace ESTABLE de un grupo de cierre: apunta al asociado principal.
// No congela la lista; el asociado siempre verá los miembros actuales del grupo.
function buildGrupoUrlEstable(principalId,yo){
  let u=baseUrl()+"?grupoppal="+encodeURIComponent(principalId);
  if(yo)u+="&yo="+encodeURIComponent(yo);
  return u;
}
// URL a usar para el modal de Envíos: estable si coincide con un grupo de Cierre,
// si no, la de siempre (IDs congelados).
function urlDelModalGrupo(){
  if(!MODAL||!MODAL.ids)return "";
  if(MODAL.grupoMatch)return buildGrupoUrlEstable(MODAL.grupoMatch.principalId,MODAL.yo);
  return buildGrupoUrl(MODAL.ids,MODAL.yo||MODAL.ids[0]);
}
// Compartir por WhatsApp el enlace estable de un grupo de cierre (desde la pestaña Cierre)
function compartirGrupoCierre(gid){
  const g=(DATA.gruposCierre||[]).find(x=>x.id===gid);
  if(!g){toast("Grupo no encontrado");return;}
  const ppal=DATA.members.find(m=>m.id===g.principalId);
  if(!ppal){toast("El principal del grupo no existe");return;}
  const url=buildGrupoUrlEstable(g.principalId);
  const msg="Hola 👋 aquí podéis ver vuestro reporte de "+DATA.reportMonth+" "+DATA.reportYear+" en Nuevos Horizontes:\n"+url;
  if(navigator.share){
    navigator.share({text:msg}).then(()=>toast("Compartido ✓")).catch(e=>{if(e.name!=="AbortError")window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");});
  }else{
    window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
  }
}
function sendGrupoWA(){
  if(!MODAL||!MODAL.ids)return;
  const url=urlDelModalGrupo();
  const msg="Hola 👋 aquí podéis ver vuestro reporte de "+DATA.reportMonth+" "+DATA.reportYear+" en Nuevos Horizontes:\n"+url;
  window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}

function baseUrl(){
  const href=window.location.href.split("?")[0].split("#")[0];
  // Si se abre desde archivo local, usar siempre la URL publicada
  if(href.startsWith("file://")||href.startsWith("about:")||location.protocol==="data:")
    return "https://xavysarmi-sketch.github.io/asociacion/";
  return href;
}
function buildMemberUrl(mid){
  return baseUrl()+"?socio="+encodeURIComponent(mid);
}

function copyLink(mid){

}
function _copyFallback(text){

}

function addMemberSubmit(){
  const name=document.getElementById("m-name").value.trim();if(!name)return;
  const type=document.querySelector(".m-opt.active")?.dataset.type||"asociado";
  const ref=type==="tercero"?(document.getElementById("m-ref")?.value.trim()||null):null;
  // Si se añade un ASOCIADO y existe un TERCERO con el mismo nombre, fusionar
  if(type==="asociado"){
    const key=name.toLowerCase().trim();
    const tercExist=DATA.members.find(x=>x.type==="tercero"&&x.name.toLowerCase().trim()===key);

function quitarAplazamiento(idx){
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  const l=m&&m.loans.find(x=>x.id===MODAL.lid);
  if(!l||!l.pays[idx]||!l.pays[idx].aplazada){toast("Esa cuota no está aplazada");return;}
  UNDO_SNAPSHOT=JSON.stringify(DATA);
  clearTimeout(UNDO_TIMER);
  // 1) Devolver la cuota a normal
  delete l.pays[idx].aplazada;
  delete l.pays[idx].instAplazada;
  // 2) Quitar UNA cuota extra del final que esté sin pagar y sin aplazar
  //    (la que se había añadido al aplazar). Se busca desde el final.
  for(let i=l.pays.length-1;i>=0;i--){
    if(!l.pays[i].paid && !l.pays[i].aplazada && i!==idx){ l.pays.splice(i,1); break; }
  }
  // 3) Recalcular respetando las aplazadas que queden
  recalcularApoyo(l);
  save();
  toast("↩︎ Aplazamiento retirado · plazo "+l.n+" cuotas");
  render();
}

function mesesToStr(n,ciclo){
  if(ciclo===0)return "Permanencia indefinida · mes "+n;
  if(n<=12)return "Nivel 1 (mes "+n+" de 12)";
  if(n<=24)return "Nivel 2 (mes "+(n-12)+" de 12)";
  return "Nivel 3 (mes "+(n-24)+" de 12)";
}

// Devuelve el "mes objetivo" del asociado: el primer mes (desde el mes del
// reporte hacia adelante) en el que todavía queda algo pendiente — ya sea el
// aporte mensual sin marcar o alguna cuota de ayuda de ese mes sin pagar.
// Si junio está completo (aporte Y cuotas), avanza solo a julio, etc.
function mesObjetivo(m){
  const esTerc=m.type==="tercero";
  let mi=MONTHS.indexOf(DATA.reportMonth);
  let y=DATA.reportYear;
  // Tope normal: el mes de reporte (nadie "debe" un mes que aún no ha llegado).
  // A partir del día de aviso (por defecto 25), se permite avanzar UN mes más,
  // para que los que pagan por anticipado vean ya el próximo pago pendiente.
  const diaAviso=(DATA.diaAvisoProximo!=null?DATA.diaAvisoProximo:25);
  const hoyDia=new Date().getDate();
  const permiteSiguiente = hoyDia>=diaAviso;
  const topeMi=mi + (permiteSiguiente?1:0);
  const todosLoans=[...(m.loans||[]),...(m.closedLoans||[])];
  // Avanzar como máximo 24 meses para evitar bucles
  for(let step=0; step<24; step++){
    const mm=MONTHS[mi%12];
    const yy=y+Math.floor(mi/12);
    // ¿aporte de este mes pendiente? (terceros no pagan aporte)
    const md=getMesData(mm,yy);
    const aporteOk = esTerc ? true : !!(md.aportes&&md.aportes[m.id]);
    // ¿alguna cuota de ayuda corresponde a este mes y está sin pagar?
    let cuotaPendiente=false;
    todosLoans.forEach(l=>{
      l.pays.forEach(p=>{
        if(p.m===mm && p.y===yy && !p.paid)cuotaPendiente=true;
      });
    });
    // Este mes tiene algo pendiente si: el aporte falta, o hay una cuota sin pagar
    if((!esTerc && !aporteOk) || cuotaPendiente){
      return {mes:mm, anio:yy};
    }
    // Todo cubierto en este mes. No pasar del tope permitido: si ya llegamos,
    // el asociado está al día (aunque haya adelantado meses futuros).
    if(mi>=topeMi){
      const tm=MONTHS[topeMi%12], ty=DATA.reportYear+Math.floor(topeMi/12);
      return {mes:tm, anio:ty};
    }
    mi++;
  }
  // Fallback: mes del reporte
  return {mes:DATA.reportMonth, anio:DATA.reportYear};
}

// Total de lo que corresponde a una ficha en el MES DE REPORTE (Opción A):
// aporte (con descuento por referido) + TODAS las cuotas de ese mes (aplazadas
// cuentan su retorno). "Al día" SOLO si aporte Y todas las cuotas están pagados.
// Función única usada por la ficha personal y el reporte grupal para que nunca
// se descuadren entre sí.
function totalDelMes(m,rm,ry){
  const esTerc=m.type==="tercero";
  const md=getMesData(rm,ry);
  // Aporte (terceros no aportan)
  const aportePagado=esTerc?true:!!(md.aportes&&md.aportes[m.id]);
  // Aporte neto = base + extra puntual − descuento por referido (mínimo 0)
  const _extraData=(DATA.extras&&DATA.extras[m.id]&&DATA.extras[m.id][getMesKey(rm,ry)])||null;
  const apExtra=_extraData?_extraData.monto:0;
  const _base=(m.aporte||DATA.monthlyFee);
  const _desc=descuentoReferidoMes(m.id,rm,ry).descuento;
  const aporteImporte=esTerc?0:Math.max(0,_base+apExtra-_desc);
  // Cuotas que vencen ESTE mes (todos los apoyos), con importe real (aplazada=retorno)
  const cuotas=[];
  [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
    l.pays.forEach((p,idx)=>{
      if(p.m===rm&&p.y===ry){
        const imp=p.aplazada?(p.instAplazada||recargoPorCuota(l)):l.inst;
        cuotas.push({inst:imp,paid:!!p.paid,aplazada:!!p.aplazada,idx,loan:l});
      }
    });
  });
  const totalCuotas=cuotas.reduce((s,c)=>s+c.inst,0);
  const total=(esTerc?0:aporteImporte)+totalCuotas; // total del mes (todo lo que corresponde)
  // Pendiente = lo que aún NO está pagado
  const aportePend=(!esTerc&&!aportePagado)?aporteImporte:0;
  const cuotasPend=cuotas.filter(c=>!c.paid).reduce((s,c)=>s+c.inst,0);
  const pendiente=aportePend+cuotasPend;
  // Al día SOLO si aporte pagado (o tercero) Y todas las cuotas pagadas
  const alDia=(esTerc||aportePagado)&&cuotas.every(c=>c.paid);
  return {total,pendiente,alDia,aporteImporte,aportePagado,cuotas,totalCuotas,esTerc};
}

function desgloseDelMes(m){
  // El cuadro se basa en el MES OBJETIVO (próximo mes con algo pendiente),
  // no en el mes del sistema. Así, al pagar junio completo, salta a julio.
  const obj=mesObjetivo(m);
  const rm=obj.mes, ry=obj.anio;
  const md=getMesData(rm,ry);
  const fee=DATA.monthlyFee;

  // Aporte base
  const aportePagado=!!(md.aportes&&md.aportes[m.id]);
  const extraData=(DATA.extras&&DATA.extras[m.id]&&DATA.extras[m.id][getMesKey(rm,ry)])||null;
  const apExtra=extraData?extraData.monto:0;

  // Descuento por referidos
  const refData=(DATA.referidos&&DATA.referidos[m.id]&&DATA.referidos[m.id][getMesKey(rm,ry)])||null;
  const nReferidos=refData?Math.min(refData.n,3):0;
  const descuento=nReferidos*10;

  // Cuotas que corresponden EXACTAMENTE al mes objetivo (no adelantar la
  // siguiente por cascada). Si la cuota de este mes ya está pagada, se muestra
  // marcada como pagada; la del mes siguiente no aparece hasta que el mes
  // objetivo avance (día de aviso). El desplegable de Ayudas sigue mostrando todas.
  const cuotasMes=[];
  const todosLoans=[...(m.loans||[]),...(m.closedLoans||[])];
  todosLoans.forEach(l=>{
    (l.pays||[]).forEach((p,idx)=>{
      if(p.m===rm && p.y===ry){
        const imp=p.aplazada?(p.instAplazada||0):l.inst;
        cuotasMes.push({loan:l,idx,inst:imp,paid:p.paid,aplazada:!!p.aplazada});
      }
    });
  });
  // Solo suman al total las cuotas de este mes que estén SIN pagar
  const totalCuotas=cuotasMes.reduce((s,c)=>s+(c.paid?0:c.inst),0);

  // Total neto — terceros solo pagan cuotas, no aporte mensual
  const esTerc=m.type==="tercero";
  const apNeto=esTerc?0:Math.max(0,fee+apExtra-descuento);
  const totalNeto=apNeto+totalCuotas;

  // Valores de PENDIENTE REAL (descontando lo ya pagado), para el cuadro individual:
  // si el aporte del mes objetivo ya está pagado, no cuenta como pendiente.
  const apNetoPend = (esTerc || aportePagado) ? 0 : apNeto;
  const totalPendiente = apNetoPend + totalCuotas; // totalCuotas ya excluye las pagadas
  const alDia = totalPendiente===0;

  return{fee,apExtra,descuento,nReferidos,cuotasMes,totalCuotas,apNeto,totalNeto,apNetoPend,totalPendiente,alDia,aportePagado,esTerc,mesObj:rm,anioObj:ry};
}

// Suma de todos los aportes extra registrados de un miembro (todos los meses)
function totalExtrasMiembro(m){
  const ex=(DATA.extras&&DATA.extras[m.id])||{};
  return Object.values(ex).reduce((s,e)=>s+((e&&e.monto)||0),0);
}

// Genera un desplegable claro. mid+key identifican el estado en DESP.
// titulo: texto principal; resumen: lo que se ve cerrado (ej. "3 ayudas · 3000€");
// contenido: HTML interno; abierto: bool
function dropFicha(mid,key,titulo,resumen,contenido,abierto){
  const tg=`DESP['${mid}-${key}']=!DESP['${mid}-${key}'];render()`;
  let h=`<button class="ft-drop ${abierto?"abierto":""}" onclick="${tg}">
    <span class="ft-drop-info">
      <span class="ft-drop-titulo">${titulo}</span>
    </span>
    <span class="ft-drop-chevron">›</span>
  </button>`;
  if(abierto) h+=`<div class="ft-drop-body">${contenido}</div>`;
  return h;
}

function puntualCalc(){
  const cap=parseInt(document.getElementById("pu-monto")?.value)||0;
  const ret=Math.round(cap*0.05);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  set("pu-cap",cap+" €"); set("pu-ret",ret+" €"); set("pu-tot",(cap+ret)+" €");
}
function savePuntual(mid){
  const cap=parseInt(document.getElementById("pu-monto")?.value)||0;
  const mes=document.getElementById("pu-mes")?.value||DATA.reportMonth;
  const anio=parseInt(document.getElementById("pu-anio")?.value)||DATA.reportYear;
  const plazo=parseInt(document.querySelector(".pu-pl-opt.active")?.dataset.pl||"1");
  if(cap<500||cap>3000){alert("El capital debe estar entre 500 y 3000 €");return;}
  const ret=Math.round(cap*0.05);
  // Mes de devolución = mes siguiente al de entrega
  let di=MONTHS.indexOf(mes)+1, dy=anio;
  if(di>11){di-=12;dy++;}
  if(!DATA.aportesPuntuales)DATA.aportesPuntuales={};
  if(!DATA.aportesPuntuales[mid])DATA.aportesPuntuales[mid]=[];
  DATA.aportesPuntuales[mid].push({
    id:"ap"+Date.now(), capital:cap, retorno:ret, total:cap+ret, plazo:plazo,
    mes:mes, anio:anio, mesDev:MONTHS[di], anioDev:dy, devuelto:false
  });
  closeModal();save();toast("Aporte puntual registrado ✓");render();
}
function togglePuntualDevuelto(mid,idx){
  const arr=DATA.aportesPuntuales&&DATA.aportesPuntuales[mid];
  if(!arr||!arr[idx])return;
  arr[idx].devuelto=!arr[idx].devuelto;
  save();toast(arr[idx].devuelto?"Marcado como devuelto ✓":"Marcado como activo ✓");render();
}
function memberLevel(m){
  const months=memberMonths(m);
  if(months<=12)return 1;
  if(months<=24)return 2;
  return 3;
}
function levelBenefit(m){
  const lv=memberLevel(m);
  const fee=m.aporte||DATA.monthlyFee;
  const base=lv===1?10:lv===2?12:15;
  return fee>=100?base*2:base;
}

// Tope por nivel vigente para meses futuros (sin recargo registrado aún)
function topeMesFuturo(mesKey){
  // Sep 2026 en adelante → Nivel 2 = 12€
  return mesKey >= "2026-09" ? 12 : 10;
}
function beneficioRealMes(mesKey){
  if(BENEFICIO_MES[mesKey] !== undefined) return BENEFICIO_MES[mesKey];
  return topeMesFuturo(mesKey);
}

// Beneficio de UN asociado en UN mes concreto.
// Si ese mes aportó 100 o más (modo aporte 100, o 50 + extra), el beneficio es DOBLE.
// Clave del mes anterior a una clave "AAAA-MM"
function mesKeyAnterior(mesKey){
  const [y,mm]=mesKey.split("-").map(Number);
  let pm=mm-1, py=y;
  if(pm<1){pm=12;py--;}
  return py+"-"+String(pm).padStart(2,"0");
}
// Desglose del beneficio de un miembro para el mes 'mesKey' (mes en que se COBRA, a mes vencido).
// El aporte que genera el beneficio es el del MES ANTERIOR (el extra de junio se refleja en julio).
function beneficioMiembroDesglose(m, mesKey){
  const base = beneficioRealMes(mesKey);
  const aporteBase = m.aporte || DATA.monthlyFee;
  const keyAporte = mesKeyAnterior(mesKey);
  const extra = (DATA.extras && DATA.extras[m.id] && DATA.extras[m.id][keyAporte] && DATA.extras[m.id][keyAporte].monto) || 0;
  const aportadoEseMes = aporteBase + extra;
  const tieneExtra = extra > 0 && aportadoEseMes >= 100;
  const benBase = Math.round(base * 100) / 100;                 // parte regular
  const benExtra = tieneExtra ? Math.round(base * 100) / 100 : 0; // parte por aporte extra (duplica)
  return { base: benBase, extra: benExtra, total: Math.round((benBase+benExtra)*100)/100, tieneExtra, keyAporte };
}
function beneficioMiembroMes(m, mesKey){
  return beneficioMiembroDesglose(m, mesKey).total;
}

function memberBenefitAccum(m){
  // Beneficio real acumulado desde el mes SIGUIENTE al ingreso hasta el mes de reporte
  // (mes vencido: el beneficio de agosto se cobra en septiembre)
  if(!m.joinMonth||!m.joinYear)return 0;
  const MS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  let total=0;
  const ji=MS.indexOf(m.joinMonth),jy=m.joinYear;
  const ri=MS.indexOf(DATA.reportMonth),ry=DATA.reportYear;
  // Primer mes con derecho = mes siguiente al ingreso
  // Iterar desde ese mes hasta reportMonth (inclusive)
  let cm=(ji+1)%12, cy=jy+(ji+1>=12?1:0);
  const rmIdx=ri, ryIdx=ry;
  while(cy<ryIdx||(cy===ryIdx&&cm<=rmIdx)){
    const key=cy+"-"+String(cm+1).padStart(2,"0");
    total+=beneficioMiembroMes(m,key);
    cm++; if(cm>=12){cm=0;cy++;}
  }
  return Math.round(total*100)/100;
}

// ── FUNCIONES CIERRE MENSUAL ─────────────────────────────────────────────────
function getMesKey(m,y){return y+"-"+String(MONTHS.indexOf(m)+1).padStart(2,"0");}
function getMesData(m,y){
  if(!DATA.monthlyData)DATA.monthlyData={};
  const k=getMesKey(m,y);
  if(!DATA.monthlyData[k])DATA.monthlyData[k]={aportes:{},recargo:0,reservaPct:15,beneficioPagado:10};
  return DATA.monthlyData[k];
}
function toggleAporte(memberId,mes,anio){
  const mm=mes||DATA.reportMonth, yy=anio||DATA.reportYear;
  const md=getMesData(mm,yy);
  md.aportes[memberId]=!md.aportes[memberId];
  // Recalcular recargo desde cuotas cobradas marcadas
  recalcMesRecargo();
  save();render();
}
function marcarTodosAportes(){
  const md=getMesData(DATA.reportMonth,DATA.reportYear);
  DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth).forEach(m=>{md.aportes[m.id]=true;});
  save();render();toast("Todos marcados como pagados ✓");
}
function desmarcarTodosAportes(){
  const md=getMesData(DATA.reportMonth,DATA.reportYear);
  DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth).forEach(m=>{md.aportes[m.id]=false;});
  save();render();toast("Todos desmarcados");
}
function toggleCuotaCierre(mid,lid,pi){
  DATA.members.forEach(m=>{
    if(m.id===mid){
      [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
        if(l.id===lid)l.pays[pi].paid=!l.pays[pi].paid;
      });
      // Reordenar: si todas pagadas → closedLoans; si alguna pendiente → loans
      const todas=[...(m.loans||[]),...(m.closedLoans||[])];
      m.loans=todas.filter(l=>l.pays.some(p=>!p.paid));
      m.closedLoans=todas.filter(l=>l.pays.every(p=>p.paid));
    }
  });
  recalcMesRecargo(); // actualiza el recargo automático
  save();render();
}
function recalcMesRecargo(){
  // Recargo automático = suma del recargo de cada cuota cobrada del mes.
  // Solo se aplica si el usuario NO lo ha fijado manualmente.
  const md=getMesData(DATA.reportMonth,DATA.reportYear);
  if(!md.recargoManual){
    md.recargo=recargoAutoMes(DATA.reportMonth,DATA.reportYear);
  }
}
function recalcRecargoForzar(){
  // Botón "Recalcular": vuelve al automático aunque estuviera manual
  const md=getMesData(DATA.reportMonth,DATA.reportYear);
  md.recargoManual=false;
  md.recargo=recargoAutoMes(DATA.reportMonth,DATA.reportYear);
  save();render();toast("Recargo recalculado automáticamente ✓");
}
function setMesRecargo(val){
  const md=getMesData(DATA.reportMonth,DATA.reportYear);
  md.recargo=parseFloat(val)||0;
  md.recargoManual=true;
  save();
  // Actualizar solo los KPIs sin re-render completo
  const el=document.getElementById("mes-kpi-beneficio");
  const el2=document.getElementById("mes-kpi-reserva");
  const el3=document.getElementById("mes-kpi-excedente");
  if(el||el2||el3)renderMesKpis(md);
}
function setMesReservaPct(val){
  const md=getMesData(DATA.reportMonth,DATA.reportYear);
  md.reservaPct=parseFloat(val)||15;
  save();
  const el=document.getElementById("mes-kpi-beneficio");
  if(el)renderMesKpis(md);
}
function renderMesKpis(md){
  const asocActivos=DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth);
  // Asociados con derecho: llevan al menos 1 mes cumplido
  const ri=MONTHS.indexOf(DATA.reportMonth),ry=DATA.reportYear;
  const conDerecho=asocActivos.filter(m=>{
    const ji=MONTHS.indexOf(m.joinMonth),jy=m.joinYear;
    return (jy<ry)||(jy===ry&&ji<ri);
  });
  const tope=ri>=8?12:10; // sep 2026 en adelante → 12€
  const repartoPorAsoc=conDerecho.length>0?md.recargo/conDerecho.length:0;
  const beneficio=Math.min(repartoPorAsoc,tope);
  const totalPagado=beneficio*conDerecho.length;
  const excedente=md.recargo-totalPagado;
  const reserva=excedente>0?excedente:0;
  const el=document.getElementById("mes-kpi-beneficio");
  const el2=document.getElementById("mes-kpi-reserva");
  const el3=document.getElementById("mes-kpi-excedente");
  const el4=document.getElementById("mes-kpi-conDerecho");
  if(el)el.textContent=beneficio.toFixed(2)+" €";
  if(el2)el2.textContent=reserva.toFixed(2)+" €";
  if(el3)el3.textContent=excedente.toFixed(2)+" €";
  if(el4)el4.textContent=conDerecho.length;
}

function filtrarEnVivo(texto, scopeSelector){
  const q=(texto||"").toLowerCase().trim();
  const scope=document.querySelector(scopeSelector)||document;
  scope.querySelectorAll("[data-nombre]").forEach(el=>{
    const n=(el.getAttribute("data-nombre")||"").toLowerCase();
    el.style.display=(!q||n.includes(q))?"":"none";
  });
}

          h+=`<div style="margin-top:10px">`;

            const lista=porPersona[pid];

              <option value="">— Añadir persona —</option>

            </select>`;
          h+=`<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--dark);border-top:1.5px solid var(--border);margin-top:4px;padding-top:10px">
            <span>Pendiente de cobrar</span><span>${totalPend} €</span>
          </div>
          ${totalPagado>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:#2D6A4F;margin-top:2px"><span>Ya cobrado</span><span>${totalPagado} €</span></div>`:""}`;
          if(totalPend>0){
            h+=`<button class="mgmt-btn primary" style="width:100%;margin-top:10px" onclick="marcarTodoGrupo('${g.id}')">✅ Marcar todo pagado</button>`;
          }
          // Enlace estable del grupo (se auto-actualiza; no hay que reenviarlo al editar el grupo)
          h+=`<button style="width:100%;margin-top:8px;padding:11px;border:none;border-radius:10px;background:#25D366;color:#fff;font-size:14px;font-weight:700;cursor:pointer" onclick="compartirGrupoCierre('${g.id}')">💬 Compartir enlace del grupo</button>`;
          // ── Resumen del grupo: aportes, cuotas y total (completo) ──
          const _aportes=items.filter(it=>it.tipo==="aporte");

  // ── PESTAÑA ASOCIADOS ──

      const intSplit=asocC.reduce((a,m)=>{const s=dueSplit(m,rm,ry);a.cob+=s.cobrado;a.pen+=s.pendiente;return a;},{cob:0,pen:0});
      const extSplit=tercC.reduce((a,m)=>{const s=dueSplit(m,rm,ry);a.cob+=s.cobrado;a.pen+=s.pendiente;return a;},{cob:0,pen:0});
      const aptSplit=aportesSplit(rm,ry);
      // Aportes extra del mes (p.ej. aporte adicional al fondo). Se registran ya entregados,

      const _mkExt=getMesKey(rm,ry);
      let aptExtra=0;
      if(DATA.extras){Object.values(DATA.extras).forEach(o=>{ if(o[_mkExt]&&o[_mkExt].monto) aptExtra+=o[_mkExt].monto; });}
      const aptCob=aptSplit.cobrado+aptExtra;
      const totCob=intSplit.cob+extSplit.cob+aptCob;
      const totPen=intSplit.pen+extSplit.pen+aptSplit.pendiente;
      // Fila con chip en línea propia: importe cobrado arriba, estado (faltan/al día) debajo
      const rowRec=(icon,lbl,cob,pen,extraCls,sub)=>`<div class="rec-fila ${extraCls||""}">
        <div class="rec-l1"><span class="rec-lbl">${icon} ${lbl}${sub?` <span style="opacity:.6;font-size:12px">${sub}</span>`:""}</span><span class="rec-imp">${cob} €</span></div>
        <div class="rec-l2">${pen>0?`<span class="chip-falta">⏳ faltan ${pen} €</span>`:`<span class="chip-ok">✓ al día</span>`}</div>
      </div>`;
      // Contador de aportes cobrados X/Y para mostrar junto a "Aportes del mes"
      const _mdRec=getMesData(rm,ry),_riRec=MONTHS.indexOf(rm);
      const _asocAct=DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth&&((m.joinYear<ry)||(m.joinYear===ry&&MONTHS.indexOf(m.joinMonth)<=_riRec)));
      const _aptPag=_asocAct.filter(m=>_mdRec.aportes&&_mdRec.aportes[m.id]).length;

          ${rowRec("💰","Aportes del mes",aptCob,aptSplit.pendiente,"",`(${_aptPag}/${_asocAct.length})${aptExtra>0?` +${aptExtra} extra`:""}`)}
          <div class="gb-row gb-total" style="margin-top:6px"><span>COBRADO</span><b>${totCob} €</b></div>
          ${totPen>0?`<div class="gb-row" style="border-top:1px dashed rgba(255,255,255,.3);padding-top:6px;margin-top:2px"><span style="opacity:.9">⏳ Pendiente por cobrar</span><b style="color:#FFD9A3">${totPen} €</b></div>`:`<div class="gb-row" style="padding-top:4px"><span style="opacity:.9">✅ Todo cobrado este mes</span><b></b></div>`}

      h+=`<button class="toggle-asoc" onclick="LISTA_ABIERTA=!LISTA_ABIERTA;render()">

          :`<div class="rf-row"><span>🔒 Devolución pendiente (${escH(it.nombre)})</span><span class="rf-val v-neg">−${it.total} €</span></div>`

        <div class="rf-row"><span>🏦 Excedente → Reserva</span><span class="rf-val v-res">${excedenteMes>0?excedenteMes.toFixed(2):"0"} €</span></div>

        <div class="rf-sec">Cartera pendiente</div>

        <div class="rf-total"><span>CARTERA TOTAL</span><span>${totIntPend+totTercPend} €</span></div>
      </div></div>`;
    }
  }

  // ── PESTAÑA ENVÍOS ──
  if(TAB==="send"){
    const todosAsoc=DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth);
    const tercPend=DATA.members.filter(m=>m.type==="tercero"&&m.loans.some(l=>l.pays.some(p=>!p.paid)));
    const allSend=[...todosAsoc,...tercPend];
    const filteredBase=SEND_FILTER==="asociado"?todosAsoc:SEND_FILTER==="tercero"?tercPend:allSend;

    h+=`<div class="send-header">

// Abre la pestaña Gestión y lanza el auto-chequeo de código la primera vez.
function irGestion(){
  TAB="manage";
  if(!CODE_CHECKS.ran && !CODE_CHECKS.running) runCodeChecks();
  render();
}
// Comprueba que el archivo PUBLICADO sigue teniendo los arreglos críticos intactos.
// Se descarga a sí mismo (igual que el aviso de "nueva versión") y examina el texto;
// la comprobación del tope/beneficio extra no necesita descarga: ejecuta el cálculo
// real con datos de prueba que no tocan la información de ningún asociado.
function runCodeChecks(force){
  if(CODE_CHECKS.running) return;
  if(CODE_CHECKS.ran && !force) return;
  CODE_CHECKS.running=true;
  if(TAB==="manage")render();
  const url=location.href.split("?")[0]+"?_selfcheck="+Date.now();
  fetch(url,{cache:"no-store"}).then(r=>r.text()).then(src=>{
    // Solo se examina el texto ANTERIOR a este propio auto-chequeo: así el código
    // de esta comprobación (que menciona estos mismos textos) no se confunde consigo
    // mismo y da un falso "todo bien" si algo real hubiera sido borrado.
    const limite=src.indexOf('function runCodeChecks');
    const zona=limite>-1?src.slice(0,limite):src;
    const iSD=zona.indexOf('function sanitizeData(');
    let ok1=false,ok2=false,ok5=false;
    if(iSD>-1){
      // Busca la llave '}' que cierra de verdad sanitizeData (contando llaves,
      // no basta con mirar si el texto siguiente "termina en }").
      let i=zona.indexOf('{',iSD),depth=0,iClose=-1;
      for(;i<zona.length;i++){
        if(zona[i]==='{')depth++;
        else if(zona[i]==='}'){depth--;if(depth===0){iClose=i;break;}}
      }
      if(iClose>-1){
        const resto=zona.slice(iClose+1,iClose+1+200);
        ok1=/^\s*const URL_PARAMS=new URLSearchParams\(window\.location\.search\);/.test(resto);
        const entre=zona.slice(iSD,iClose);
        ok2=/origen\s*===\s*"app"/.test(entre) && /id\.charAt\(0\)\s*===\s*"m"/.test(entre);
        // Protección añadida en v43.23: un asociado del archivo (INITIAL) al que le
        // cambian el nombre en caliente debe seguir reconociéndose por su id, si no
        // sanitizeData lo trata como fantasma y lo borra (bug real: caso Ariel Olivo).
        ok5=/validIds\.has\(m\.id\)/.test(entre);
      }
    }
    const ok3 = zona.includes('Cache-Control" content="no-cache, no-store, must-revalidate"')
      && zona.includes('http-equiv="Pragma" content="no-cache"')
      && zona.includes('http-equiv="Expires" content="0"');
    CODE_CHECKS.online=true; CODE_CHECKS.ok1=ok1; CODE_CHECKS.ok2=ok2; CODE_CHECKS.ok3=ok3; CODE_CHECKS.ok5=ok5;
  }).catch(()=>{ CODE_CHECKS.online=false; }).then(()=>{
    try{
      const t1=topeMesFuturo("2026-08")===10, t2=topeMesFuturo("2026-09")===12;
      const b1=levelBenefit({joinMonth:DATA.reportMonth,joinYear:DATA.reportYear,aporte:100});
      const b2=levelBenefit({joinMonth:DATA.reportMonth,joinYear:DATA.reportYear,aporte:50});
      CODE_CHECKS.ok4 = t1 && t2 && b1===20 && b2===10;
    }catch(e){ CODE_CHECKS.ok4=false; }
    CODE_CHECKS.ran=true; CODE_CHECKS.running=false; CODE_CHECKS.ts=Date.now();
    if(TAB==="manage")render();
  });
}
function chequeoHTML(){

  const upd=DATA.updatedAt?new Date(DATA.updatedAt).toLocaleString("es-ES"):"(sin fecha)";

  // Igual que linea(), pero admite un tercer estado "aún comprobando" (⏳) y uno

  const lineaEstado=(estado,txtOk,txtMal,txtEspera,txtSinConexion)=>{
    const icono = estado===true?"✅":estado===false?"⚠️":"⏳";

    "Código de arranque intacto (no se queda en pantalla en blanco)",

  chk.push(lineaEstado(s2,
    "Protección de asociados creados en la app activa",

    "Comprobando protección de asociados…",
    "Sin conexión: no se pudo comprobar la protección de asociados"));
  const s3 = !CODE_CHECKS.ran ? null : (!CODE_CHECKS.online ? "offline" : CODE_CHECKS.ok3);
  chk.push(lineaEstado(s3,
    "Etiquetas anti-caché presentes (el iPhone no usa versiones viejas)",
    "Aviso: faltan etiquetas anti-caché — avisar al soporte",
    "Comprobando etiquetas anti-caché…",
    "Sin conexión: no se pudo comprobar la caché"));
  const s5 = !CODE_CHECKS.ran ? null : (!CODE_CHECKS.online ? "offline" : CODE_CHECKS.ok5);
  chk.push(lineaEstado(s5,
    "Miembros del archivo (INITIAL) se conservan por id al renombrarlos",

    "Sin conexión: no se pudo comprobar la protección de renombrados"));
  const s4 = !CODE_CHECKS.ran ? null : CODE_CHECKS.ok4;
  chk.push(lineaEstado(s4,
    "Cálculo de tope de mes y beneficio extra correcto",
    "Aviso: el cálculo de tope de mes o beneficio extra no da el resultado esperado — avisar al soporte",
    "Comprobando cálculo de tope y beneficio extra…",
    "Comprobando cálculo de tope y beneficio extra…"));

  return `<div style="background:#F0F7F2;border:2px solid #2D6A4F;border-radius:14px;padding:14px;margin-top:20px;margin-bottom:16px;font-size:13px;line-height:1.5;color:#1B4332">

}

function renderGrupo(){
  // Resolver la lista de miembros según el tipo de enlace:
  // - Nuevo (?grupoppal=ID): buscar el grupo guardado cuyo principal sea ese asociado
  //   y usar SU lista actual (principal + miembros). Así el enlace se auto-actualiza.
  // - Antiguo (?grupo=id1,id2,...): usar la lista fija de la URL (compatibilidad).
  let ids=[];
  let titularId=GRUPO_YO;
  if(GRUPO_PPAL){
    const grupos=(DATA.gruposCierre||[]);
    const g=grupos.find(x=>x.principalId===GRUPO_PPAL);
    if(g){
      ids=[g.principalId,...(g.miembros||[])];
      if(!titularId)titularId=g.principalId; // el principal es el titular por defecto
    }
  } else if(GRUPO_IDS){
    ids=GRUPO_IDS;
  }
  const members=ids.map(id=>DATA.members.find(x=>x.id===id)).filter(Boolean);
  if(!members||!members.length){
    document.getElementById("app").innerHTML=`<div style="text-align:center;padding:60px 20px"><div style="font-size:48px">🔍</div><div style="font-size:18px;font-weight:700;color:var(--dark);margin-top:16px">Grupo no encontrado</div></div>`;

  // Titular: el principal del grupo (nuevo) o el indicado en ?yo= o la primera ficha

  const tabOn="background:#fff;color:#1B4332;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.08)";
  const tabOff="background:transparent;color:var(--muted);font-weight:700";
  h+=`<div class="content"><div style="display:flex;gap:6px;background:#EDE7DF;border-radius:14px;padding:4px;margin-bottom:14px">
      <button onclick="setGrupoVista('mi')" style="flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;${GRUPO_VISTA==='mi'?tabOn:tabOff}">👤 Mi reporte</button>
      <button onclick="setGrupoVista('grupo')" style="flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;${GRUPO_VISTA==='grupo'?tabOn:tabOff}">👥 Reporte grupal</button>
    </div>`;

  if(GRUPO_VISTA==="mi"){
    // ── Vista individual del titular (igual que el enlace personal) ──
    h+=fichaHTML(titular,true);
    h+=`<div style="text-align:center;padding:6px 0 28px;font-size:12px;color:var(--muted)">Vista de solo lectura · Contacta con el administrador</div>`;
    h+=`</div>`;
    document.getElementById("app").innerHTML=h;
    if(MODAL){
      const extra=`<div class="modal-bg" onclick="closeModal()"><div class="modal-sheet" onclick="event.stopPropagation()"><div class="modal-handle"></div>${MODAL.type==="history"?historyModalHTML():""}</div></div>`;
      document.getElementById("app").insertAdjacentHTML("beforeend",extra);
    }
    return;
  }

  // ── Vista grupal (resumen entre todos) ──
  members.forEach(m=>{ h+=fichaResumenHTML(m); });

  const totalAportes=members.filter(m=>m.type!=="tercero").reduce((s,m)=>s+totalDelMes(m,rm,ry).aporteImporte,0);
  const totalCuotas2=members.reduce((s,m)=>s+totalDelMes(m,rm,ry).totalCuotas,0);

  h+=`<div style="background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:16px;padding:16px;margin-bottom:24px">
    <div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">Resumen total — ${MF2[MS2.indexOf(gMes)]} ${gAnio}</div>
    ${totalAportes>0?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)"><span style="font-size:13px;color:rgba(255,255,255,.8)">Total aportes mensuales</span><span style="font-size:14px;font-weight:700;color:#fff">${totalAportes} €</span></div>`:""}
    ${totalCuotas2>0?`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)"><span style="font-size:13px;color:rgba(255,255,255,.8)">Total cuotas de ayudas</span><span style="font-size:14px;font-weight:700;color:#fff">${totalCuotas2} €</span></div>`:""}
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:2px">
      <span style="font-size:14px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.5px">Total entre todos</span>
      <span style="font-size:36px;font-weight:900;color:#fff">${totalGrupo} €</span>
    </div>
    <div style="font-size:12px;color:rgba(255,255,255,.5);margin-top:4px">${members.length} fichas incluidas</div>
  </div>`;

  h+=`<div style="text-align:center;padding:0 0 28px;font-size:12px;color:var(--muted)">Vista de solo lectura · Contacta con el administrador</div>`;
  h+=`</div>`;
  document.getElementById("app").innerHTML=h;
}



load();
</script>

<!-- ============================================================ -->
<!-- DETECTOR DE ACTUALIZACIONES AUTOMÁTICAS                      -->
<!-- ============================================================ -->
<!-- Comprueba cada 2 minutos si hay una versión nueva en GitHub   -->
<!-- Si la detecta, muestra un banner para que Xavy pueda actualizar -->
<!-- Funciona en iPhone como PWA sin necesidad de service worker   -->
<!-- ============================================================ -->
<script>
window.APP_UPDATE = (function(){
  var CHECK_INTERVAL_MS = 10 * 60 * 1000; // Comprueba cada 10 minutos (menos ruido)
  var currentFingerprint = null;
  var pendingFp = null;      // huella distinta a la espera de confirmarse
  var pendingCount = 0;      // veces seguidas que se ha visto esa huella distinta
  var dismissed = false;
  var banner = document.getElementById('updateBanner');
  var versionTag = document.getElementById('appVersionTag');
  if(versionTag && typeof APP_VERSION!=="undefined"){ versionTag.textContent = APP_VERSION; }

  // Memoria persistente: qué huella ya aceptó/cerró el usuario, para NO volver a
  // avisar de la misma versión aunque recargue o reabra la app desde el icono.
  function getSeen(){ try{ return localStorage.getItem('nh_update_seen')||''; }catch(e){ return ''; } }
  function setSeen(fp){ try{ localStorage.setItem('nh_update_seen', fp||''); }catch(e){} }

  // Obtiene una "huella" del archivo remoto sin descargarlo entero
  // Usa un HEAD request que es muy rápido y no consume datos
  function fetchFingerprint(){
    // Añade un parámetro aleatorio para evitar caché del navegador
    var url = location.href.split('?')[0] + '?_check=' + Date.now();
    return fetch(url, { method: 'HEAD', cache: 'no-store' })
      .then(function(r){
        // La huella es la combinación de ETag + Last-Modified
        // (GitHub Pages cambia estos valores en cada commit nuevo)
        var etag = r.headers.get('ETag') || '';
        var lastMod = r.headers.get('Last-Modified') || '';
        return etag + '|' + lastMod;
      })
      .catch(function(){ return null; });
  }

  // Marca visualmente (sello ✓) que se confirmó que esta pantalla es la versión publicada.
  // Se llama cuando la huella del servidor coincide con lo que ya se está viendo.
  function marcarVersionConfirmada(){
    UPDATE_CONFIRMED = true;
    var b1 = document.getElementById('versionOkBadge');
    if(b1) b1.style.display = 'inline';
    var b2 = document.getElementById('versionOkBadgeRO');
    if(b2) b2.style.display = 'block';
  }

  function check(){
    if(dismissed) return; // Si el usuario cerró el banner, no insistir esta sesión
    fetchFingerprint().then(function(fp){
      if(!fp) return; // Sin conexión o error, intentar más tarde
      if(currentFingerprint === null){
        // Primera comprobación de esta sesión: guardamos la huella actual
        currentFingerprint = fp;
        marcarVersionConfirmada();
        return;
      }
      if(fp === currentFingerprint){
        // Sin cambios: se limpia cualquier candidato pendiente (era ruido puntual)
        pendingFp = null; pendingCount = 0;
        marcarVersionConfirmada();
        return;
      }
      // La huella es distinta. Puede ser versión nueva real o ruido de las
      // cabeceras de GitHub Pages. Exigimos verla DOS veces seguidas igual.
      if(fp === pendingFp){ pendingCount++; }
      else{ pendingFp = fp; pendingCount = 1; }
      if(pendingCount < 2) return; // aún no confirmada; esperar próxima comprobación

      // Confirmada como versión nueva real
      currentFingerprint = fp;
      pendingFp = null; pendingCount = 0;

      // Si el usuario YA aceptó/cerró exactamente esta huella, no volver a avisar
      if(getSeen() === fp) return;

      // En enlaces de asociados (solo lectura) se recarga solo; al admin se le avisa
      var esEnlaceAsociado = (typeof READONLY_ID!=="undefined" && READONLY_ID) ||
                             (typeof GRUPO_IDS!=="undefined" && GRUPO_IDS) ||
                             (typeof GRUPO_PPAL!=="undefined" && GRUPO_PPAL);
      if(esEnlaceAsociado){
        setSeen(fp);
        apply();
      }else{
        showBanner();
      }
    });
  }

  function showBanner(){
    if(banner) banner.classList.add('show');
  }

  function apply(){
    // Marca la huella actual como \"ya vista\" para que la página recargada no
    // vuelva a mostrar el banner de esta misma versión.
    if(currentFingerprint) setSeen(currentFingerprint);
    try{
      var base=location.href.split('#')[0];
      var sep=base.indexOf('?')>=0?'&':'?';
      // Quitar un _v anterior para no acumularlos
      base=base.replace(/([?&])_v=\d+/,'').replace(/[?&]$/,'');
      sep=base.indexOf('?')>=0?'&':'?';
      location.replace(base+sep+'_v='+Date.now());
    }catch(e){
      location.reload();
    }
  }

  function dismiss(){
    dismissed = true;
    // Recordar que esta versión ya se cerró: no reaparece hasta que haya otra real
    if(currentFingerprint) setSeen(currentFingerprint);
    if(banner) banner.classList.remove('show');
  }

  // Inicializar: primera comprobación al cargar
  check();
  // Comprobar cada 2 minutos mientras la app esté abierta
  setInterval(check, CHECK_INTERVAL_MS);
  // Comprobar también cuando el usuario vuelve a la app (importante en iPhone)
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden) check();
  });

  return { apply: apply, dismiss: dismiss };
})();
</script>
