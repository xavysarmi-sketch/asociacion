function referidoFormHTML(){
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  if(!m)return "";
  // Selector de mes: 3 meses anteriores, el mes actual y 3 meses futuros.
  const MS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const ri=MS.indexOf(DATA.reportMonth),ry=DATA.reportYear;
  const meses=[];
  for(let i=-3;i<=3;i++){
    let mi=ri+i, yi=ry;
    while(mi<0){mi+=12;yi--;}
    while(mi>11){mi-=12;yi++;}
    meses.push({m:MS[mi],y:yi,key:yi+"-"+String(mi+1).padStart(2,"0")});
  }
  // Por defecto se selecciona el mes actual (el del medio del rango).
  const mesActualKey=ry+"-"+String(ri+1).padStart(2,"0");
  const selMesKey=MODAL.refMesKey||mesActualKey;
  const actual=(DATA.referidos&&DATA.referidos[m.id]&&DATA.referidos[m.id][selMesKey])||{n:0,nombres:""};
  const mesOpts=meses.map(x=>`<option value="${x.key}" ${x.key===selMesKey?"selected":""}>${x.m} ${x.y}</option>`).join("");
  return`<div class="modal-title">🎁 Bonus referidos — ${escH(m.name)}</div>
<p style="font-size:13px;color:var(--muted);margin-bottom:12px">10€ de descuento en aporte por cada referido nuevo que entre. Máximo 3 por mes (−30€).</p>
<label class="m-label">Mes en que aplica el bonus</label>
<select class="m-input" id="ref-mes-sel" onchange="MODAL.refMesKey=this.value;render()" style="margin-bottom:14px;font-size:14px;font-weight:600">
  ${mesOpts}
</select>
<label class="m-label">Nº de referidos (1-3)</label>
<div style="display:flex;gap:8px;margin-bottom:12px">
  <button class="m-opt l-n-opt ${actual.n===1?"active":""}" data-n="1" onclick="document.querySelectorAll('.l-n-opt').forEach(b=>b.classList.remove('active'));this.classList.add('active')">1 · −10€</button>
  <button class="m-opt l-n-opt ${actual.n===2?"active":""}" data-n="2" onclick="document.querySelectorAll('.l-n-opt').forEach(b=>b.classList.remove('active'));this.classList.add('active')">2 · −20€</button>
  <button class="m-opt l-n-opt ${actual.n===3?"active":""}" data-n="3" onclick="document.querySelectorAll('.l-n-opt').forEach(b=>b.classList.remove('active'));this.classList.add('active')">3 · −30€</button>
</div>
<label class="m-label">Nombres de los nuevos miembros</label>
<input id="ref-nombres" class="m-input" placeholder="Ej: Ana García, Luis Pérez" value="${escH(actual.nombres||"")}">
<button class="m-primary" onclick="saveReferido()">Guardar</button>
${actual.n>0?`<button style="width:100%;margin-top:10px;padding:12px;border:2px solid #C0492C;border-radius:12px;background:#FDECE8;color:#C0492C;font-size:14px;font-weight:700;cursor:pointer" onclick="borrarReferido()">🗑 Eliminar este bono (${actual.n} · ${selMesKey})</button>`:""}`;
}
function saveReferido(){
  const n=parseInt(document.querySelector(".l-n-opt.active")?.dataset.n||"0");
  const nombres=document.getElementById("ref-nombres")?.value.trim()||"";
  const mesKey=MODAL.refMesKey||(DATA.reportYear+"-"+String(MONTHS.indexOf(DATA.reportMonth)+1).padStart(2,"0"));
  if(!DATA.referidos)DATA.referidos={};
  if(!DATA.referidos[MODAL.mid])DATA.referidos[MODAL.mid]={};
  DATA.referidos[MODAL.mid][mesKey]={n,nombres};
  closeModal();save();toast("Referidos guardados para "+mesKey+" ✓");
}
// Eliminar un bono de referido registrado por error, para el mes seleccionado.
function borrarReferido(){
  const mesKey=MODAL.refMesKey||(DATA.reportYear+"-"+String(MONTHS.indexOf(DATA.reportMonth)+1).padStart(2,"0"));
  if(DATA.referidos&&DATA.referidos[MODAL.mid]&&DATA.referidos[MODAL.mid][mesKey]){
    delete DATA.referidos[MODAL.mid][mesKey];
    if(Object.keys(DATA.referidos[MODAL.mid]).length===0)delete DATA.referidos[MODAL.mid];
    save();toast("Bono eliminado de "+mesKey+" ✓");
  }else{
    toast("No había bono registrado en "+mesKey);
  }
  closeModal();render();
}

function fijarAportesPagados(m,nuevoBase){
  const viejo=aporteBaseDe(m); if(viejo===nuevoBase||!DATA.monthlyData)return;
  Object.keys(DATA.monthlyData).forEach(k=>{
    const md=DATA.monthlyData[k]; if(!(md&&md.aportes&&md.aportes[m.id]===true))return;
    const pagado=aporteBrutoKey(m,k);
    if(!DATA.extras)DATA.extras={}; if(!DATA.extras[m.id])DATA.extras[m.id]={};
    DATA.extras[m.id][k]={monto:pagado-nuevoBase};
  });

// Beneficio real pagado por mes (fuente: Reparto_Mensual del Excel).
// Meses históricos con recargo real medido (hasta jun 2026): valor de la tabla.
const BENEFICIO_MES = {
  "2025-09": 2.50,
  "2025-10": 5.00,
  "2025-11": 105/13, // v44.17: exacto (105 € entre 13); antes 8.08 → 105,04 € (4 céntimos de más)
  "2025-12": 10.00,
  "2026-01": 10.00,
  "2026-02": 10.00,
  "2026-03": 10.00,
  "2026-04": 10.00,
  "2026-05": 10.00,
  "2026-06": 10.00,
};
// Beneficio por NIVEL de permanencia (réplica de Reparto_Mensual del Excel).
// "Meses vencidos" = idx(mes) - idx(ingreso): el mes de ingreso cuenta 0 y el primer
// beneficio es el mes siguiente (a mes vencido, §5.1 del Maestro). Nivel 1 = 10 € (1-12) ·
// Nivel 2 = 12 € (13-24, ciclo != 12) · Nivel 3 = 15 € (>=25, ciclo 36 o indefinido).
// Un ciclo 12 que pasa del mes 12 se queda en Nivel 1.
function tarifaNivelMes(m, mesKey){
  if(!m.joinMonth || !m.joinYear) return 0;
  const [y,mm]=mesKey.split("-").map(Number);
  const idxK = y*12 + mm;                                // mm es 1-based, igual que el Excel
  const idxJoin = m.joinYear*12 + (MONTHS.indexOf(m.joinMonth)+1);
  const elapsed = idxK - idxJoin;                        // meses vencidos (mes de ingreso = 0)
  if(elapsed < 1) return 0;                              // aún no genera beneficio
  const ciclo = (m.ciclo != null ? m.ciclo : 12);       // 0 = indefinido
  if(elapsed <= 12) return 10;                           // Nivel 1
  if(elapsed <= 24 && ciclo !== 12) return 12;           // Nivel 2 (ciclo != 12)
  if(elapsed >= 25 && (ciclo === 36 || ciclo === 0)) return 15; // Nivel 3 (ciclo 36 o indefinido)
  return 10;                                             // ciclo 12 tras el mes 12, etc. → Nivel 1
}
function beneficioRealMes(mesKey){
  // Solo meses históricos (tabla). Para meses futuros devuelve undefined y el importe
  // lo resuelve por NIVEL beneficioMiembroDesglose (tarifaNivelMes).
  return BENEFICIO_MES[mesKey];
}

// Beneficio de UN asociado en UN mes concreto.
// Si ese mes aportó 100 o más (modo aporte 100, o 50 + extra), el beneficio es DOBLE.
// Clave del mes anterior a una clave "AAAA-MM"
function mesKeyAnterior(mesKey){
  const [y,mm]=mesKey.split("-").map(Number);
  let pm=mm-1, py=y;
  if(pm<1){pm=12;py--;}
  return py+"-"+String(pm).padStart(2,"0");
}
// Desglose del beneficio de un miembro para el mes 'mesKey' (mes en que se COBRA, a mes vencido).
// El aporte que genera el beneficio es el del MES ANTERIOR (el extra de junio se refleja en julio).
function beneficioMiembroDesglose(m, mesKey){
  const historico = BENEFICIO_MES[mesKey];
  const base = (historico !== undefined) ? historico : tarifaNivelMes(m, mesKey);
  const keyAporte = mesKeyAnterior(mesKey);
  const aportadoEseMes = aporteBrutoKey(m,keyAporte);
  const bloques = bloquesBeneficio(m,keyAporte,aportadoEseMes);
  // v44.17: los meses históricos (BENEFICIO_MES) no se redondean mes a mes: 105 € entre 13 da
  // 8,0769… a cada uno y la suma cuadra al céntimo; el total acumulado se redondea al final.
  const r2=x=>historico!==undefined?x:Math.round(x*100)/100;
  const total = r2(base*bloques);
  const benBase = r2(base*Math.min(bloques,1));               // primer bloque de 50 €
  const benExtra = r2(total-benBase);                         // bloques 2.º a 4.º
  return { base: benBase, extra: benExtra, total, tieneExtra: bloques>1, bloques, keyAporte };
}
// v45 (Maestro v18.2 · BE-1, BE-4, BE-7): desde los aportes de noviembre 2026, el beneficio es
// por cada bloque de 50 € aportado ese mes (máx. 4) y un mes sin aporte pagado no gana.
// Hasta octubre 2026 sigue la regla v17: doble si el aporte del mes fue de 100 € o más.
const V18_APORTES_DESDE="2026-11";
function bloquesBeneficio(m,keyAporte,aportado){
  if(keyAporte>=V18_APORTES_DESDE){
    const md=DATA.monthlyData&&DATA.monthlyData[keyAporte];
    const pagado=!!(md&&md.aportes&&md.aportes[m.id]===true);
    return pagado?Math.max(0,Math.min(4,Math.floor(aportado/50))):0;
  }
  return aportado>=100?2:1;
}
function beneficioMiembroMes(m, mesKey){
  return beneficioMiembroDesglose(m, mesKey).total;
}

function memberBenefitAccum(m){
  // Beneficio real acumulado desde el mes SIGUIENTE al ingreso hasta el mes de reporte
  // (mes vencido: el beneficio de agosto se cobra en septiembre)
  if(!m.joinMonth||!m.joinYear)return 0;
  const MS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  let total=0;
  const ji=MS.indexOf(m.joinMonth),jy=m.joinYear;
  const ri=MS.indexOf(DATA.reportMonth),ry=DATA.reportYear;
  // Primer mes con derecho = mes siguiente al ingreso
  // Iterar desde ese mes hasta reportMonth (inclusive)
  let cm=(ji+1)%12, cy=jy+(ji+1>=12?1:0);
  const rmIdx=ri, ryIdx=ry;
  while(cy<ryIdx||(cy===ryIdx&&cm<=rmIdx)){
    const key=cy+"-"+String(cm+1).padStart(2,"0");
    total+=beneficioMiembroMes(m,key);
    cm++; if(cm>=12){cm=0;cy++;}
  }
  return Math.round(total*100)/100;
}

// ── BAJA DE ASOCIADO (salida anticipada, §7 del Documento Maestro) ────────────
// La baja es un CAMBIO DE ESTADO: el miembro se conserva con su historial (nunca se
// borra; regla crítica 3). Devolución = capital efectivamente PAGADO + bonificaciones
// de los niveles COMPLETADOS. Nivel completado = 12/24/36 meses PAGADOS (decisión de
// Ángel), topado por el ciclo declarado. El beneficio del nivel en curso se pierde y
// se queda en el fondo. Bonificación por nivel: §6.1 (aporte 50); aporte 100 = el doble.
const BONO_NIVEL = {1:120, 2:144, 3:180};
// Niveles COMPLETADOS según meses realmente pagados, topados por el ciclo declarado.
function nivelesCompletadosPagados(mesesPagados, ciclo){
  let n = 0;
  if(mesesPagados >= 12) n = 1;
  if(mesesPagados >= 24) n = 2;
  if(mesesPagados >= 36) n = 3;
  const tope = (ciclo===12) ? 1 : (ciclo===24) ? 2 : 3; // ciclo 36 o 0(indef) → hasta N3
  return Math.min(n, tope);
}
// Fecha de pago de la devolución: día 5 del mes SIGUIENTE a la baja (decisión de Ángel).
function fechaPagoBaja(mesBaja, anioBaja){
  const i = MONTHS.indexOf(mesBaja);
  const im = (i+1)%12, iy = anioBaja + (i+1>=12 ? 1 : 0);
  return "5 " + MONTHS_FULL[im] + " " + iy;
}
// Beneficio acumulado contando SOLO los meses realmente PAGADOS (decisión de Ángel),
// excluyendo el mes de ingreso (que no genera beneficio, §5.1). Se usa solo para el
// informativo "beneficio perdido"; no altera el total de la devolución.
function beneficioAcumuladoPagados(m){
  if(!DATA.monthlyData || !m.joinMonth || !m.joinYear) return 0;
  const ingKey = m.joinYear + "-" + String(MONTHS.indexOf(m.joinMonth)+1).padStart(2,"0");
  let total = 0;
  Object.keys(DATA.monthlyData).forEach(k=>{
    const md = DATA.monthlyData[k];
    if(md && md.aportes && md.aportes[m.id] === true && k !== ingKey){
      total += beneficioMiembroMes(m, k);
    }
  });
  return Math.round(total*100)/100;
}
// Cálculo de la devolución de una baja. NO marca nada: solo calcula y devuelve el desglose.
function devolucionBaja(m, mesBaja, anioBaja){
  const aporte = m.aporte || DATA.monthlyFee;
  const mesesPagados = aportesPagadosCount(m);
  // v44.19: + aportes extra de meses pagados (Maestro §9.1: se devuelven con el resto del capital)
  const extrasPag = Object.entries((DATA.extras&&DATA.extras[m.id])||{}).reduce((s,[k,e])=>{
    const md=DATA.monthlyData&&DATA.monthlyData[k]; return s+((md&&md.aportes&&md.aportes[m.id]===true&&e&&e.monto)||0);},0);
  const capital = mesesPagados * aporte + extrasPag;           // solo lo efectivamente pagado
  const ciclo = (m.ciclo != null ? m.ciclo : 12);
  const niveles = nivelesCompletadosPagados(mesesPagados, ciclo);
  const mult = (aporte >= 100) ? 2 : 1;                        // §6.2: aporte 100 = el doble
  let beneficioConservado = 0;
  for(let l = 1; l <= niveles; l++) beneficioConservado += BONO_NIVEL[l] * mult;
  const total = capital + beneficioConservado;                // lo que recibe el asociado
  const acumulado = beneficioAcumuladoPagados(m); // solo meses pagados (decisión de Ángel)
  const beneficioPerdido = Math.max(0, Math.round((acumulado - beneficioConservado)*100)/100); // queda en el fondo (informativo)
  return {
    mesesPagados, capital, niveles, beneficioConservado, beneficioPerdido,
    total, fechaPago: fechaPagoBaja(mesBaja, anioBaja)
  };
}
// ¿Es 'm' avalista de alguna ayuda ACTIVA de otro miembro? Devuelve el mensaje de
// bloqueo, o null si puede darse de baja. Control de seguridad simple (Regla 2):
// verificar y bloquear en la misma operación; ante la duda, no permitir.
// PENDIENTE (fase futura): baja de un asociado CON DEUDA PROPIA — compensar la deuda
// contra sus aportes, calcular el faltante, o trasladar la deuda a su avalista. Aquí
// solo se contempla el caso simple: sin deuda propia y sin avalar nada activo.
function motivoBloqueoBaja(m){
  const activa = l => Array.isArray(l.pays) && l.pays.some(p => !p.paid);
  for(const o of DATA.members){
    if(o.id === m.id) continue;
    // (a) tercero avalado por m (o.ref === m.id) con alguna ayuda activa
    if(o.type === "tercero" && o.ref === m.id && (o.loans||[]).some(activa)){
      return `No se puede dar de baja a ${m.name}: es avalista de una ayuda activa de ${o.name} (tercero).`;
    }
    // (b) cualquier ayuda activa que registró a m como avalista en su concesión
    if((o.loans||[]).some(l => l.avalistaEnConcesion === m.id && activa(l))){
      return `No se puede dar de baja a ${m.name}: es avalista de una ayuda activa de ${o.name}.`;
    }
    // (c) v45.1 (Maestro v18.3 · GE-1, SA-6): es aval del asociado que recomendó y este tiene una ayuda activa
    if(o.type === "asociado" && !o.baja && (o.loans||[]).some(activa)){
      const a=avalDe(o);
      if(a && a.m && a.m.id === m.id) return `No puede salir ${m.name} mientras sea aval: ${o.name} (lo recomendó) tiene una ayuda activa (Maestro SA-6).`;
    }
  }
  return null;
}
// Marca la baja (CAMBIO DE ESTADO explícito; nunca desde render(), regla crítica 7).
// Conserva el miembro con su historial; solo añade el objeto 'baja'. Si el asociado
// avala una ayuda activa, NO procede: devuelve {ok:false, motivo} sin tocar nada.
function darDeBaja(m, mesBaja, anioBaja){
  const motivo = motivoBloqueoBaja(m);
  if(motivo) return {ok:false, motivo};
  const d = devolucionBaja(m, mesBaja, anioBaja);
  m.baja = {
    month: mesBaja, year: anioBaja,
    capitalDevuelto: d.capital,
    beneficioConservado: d.beneficioConservado,
    beneficioPerdido: d.beneficioPerdido,
    total: d.total,
    fechaPago: d.fechaPago
  };
  return {ok:true, baja:m.baja};
}
// ══ v45.1 (Maestro v18.2 · PE-5, PE-7, SA-1 a SA-5, SA-10) ═══════════════════════════════
// Retirada del beneficio guardado sin salir y salidas con las reglas v18. Estas funciones SOLO
// calculan; los cambios de estado se hacen en acciones explícitas del administrador.
function _keyDeIdx(i){ return Math.floor(i/12)+"-"+String(((i%12)+12)%12+1).padStart(2,"0"); }
function _mesDeIdx(i){ return {mes:MONTHS[((i%12)+12)%12],anio:Math.floor(i/12)}; }
function _txtIdx(i){ return MONTHS_FULL[((i%12)+12)%12].toLowerCase()+" "+Math.floor(i/12); }
function _r2(x){ return Math.round((x||0)*100)/100; }
function _aportePagadoKey(m,k){ const md=DATA.monthlyData&&DATA.monthlyData[k]; return !!(md&&md.aportes&&md.aportes[m.id]===true); }
function finPermanenciaIdx(m,ciclo){ const c=(ciclo!==undefined?ciclo:(m&&m.ciclo)); return (m&&m.joinMonth&&c>0)?_idxMes(m.joinMonth,m.joinYear)+c-1:null; }
// Aportes PAGADOS desde la entrada hasta 'hastaIdx' (incluido), en orden, con el beneficio que
// genera cada uno (BE-3: se anota el mes siguiente; incluye el histórico BE-6 y los bloques BE-7).
function aportesConBeneficio(m,hastaIdx){
  const out=[]; if(!m||!m.joinMonth)return out;
  for(let i=_idxMes(m.joinMonth,m.joinYear);i<=hastaIdx;i++){
    const k=_keyDeIdx(i); if(!_aportePagadoKey(m,k))continue;
    out.push({idx:i,key:k,aporte:aporteBrutoKey(m,k),ben:beneficioMiembroDesglose(m,_keyDeIdx(i+1)).total});
  }
  return out;
}
// ── Retiradas de beneficio (PE-5 al ampliar · PE-7 cada 12 meses de la indefinida) ──
// m.retiradas = [{id, finIdx (último mes del periodo), motivo:"fin"|"aniv", pagada, importe (se fija
// al pagarla), fechaPagada, anulada}]. Se paga el día 5 del mes siguiente a finIdx.
function retiradasDe(m){ return (m&&Array.isArray(m.retiradas)?m.retiradas:[]).filter(r=>!r.anulada); }
function importeRetirada(m,r){
  if(r.pagada&&typeof r.importe==="number")return r.importe;
  const prev=retiradasDe(m).filter(x=>x!==r&&x.finIdx<r.finIdx).reduce((s,x)=>s+importeRetirada(m,x),0);
  const gen=aportesConBeneficio(m,r.finIdx).reduce((s,a)=>s+a.ben,0);
  return Math.max(0,_r2(gen-prev));
}
function pagoRetiradaIdx(r){ return r.finIdx+1; }
function beneficioRetirado(m){ return _r2(retiradasDe(m).reduce((s,r)=>s+importeRetirada(m,r),0)); }
function beneficioGuardado(m){ return Math.max(0,_r2(memberBenefitAccum(m)-beneficioRetirado(m))); }
// ¿Puede retirar ahora el beneficio de un periodo? Fin de permanencia (al ampliarla) desde el mes
// antes del final; aniversario de la indefinida (meses 12, 24, 36…) del mes antes al siguiente.
function retiradaPosible(m,cicloAnterior){
  if(!m||m.type!=="asociado"||!m.joinMonth||m.baja)return null;
  const idx=_idxMes(DATA.reportMonth,DATA.reportYear), ini=_idxMes(m.joinMonth,m.joinYear);
  const c=(cicloAnterior!==undefined?cicloAnterior:m.ciclo);
  const ya=f=>retiradasDe(m).some(r=>r.finIdx===f);
  if(c>0){ const fin=ini+c-1; if(idx>=fin-1&&!ya(fin))return {finIdx:fin,motivo:"fin"}; return null; }
  if(c===0){ for(const fin of [idx-1,idx,idx+1]){ const n=fin-ini+1; if(n>=12&&n%12===0&&!ya(fin))return {finIdx:fin,motivo:"aniv"}; } }
  return null;
}
function nuevaRetirada(m,finIdx,motivo){
  if(!Array.isArray(m.retiradas))m.retiradas=[];
  const p=_mesDeIdx(finIdx+1);
  m.retiradas.push({id:"r"+Date.now(),finIdx,motivo,pagoMes:p.mes,pagoAnio:p.anio,pagada:false,creada:new Date().toLocaleDateString("es-ES")});
}
// ── Salida (SA) ──
// SA-10: lo que le quede por devolver de sus ayudas se descuenta de lo que recibe.
const SA10_SOLO_CAPITAL=false; // false = las cuotas que le quedan (capital + retorno) · true = solo el capital pendiente
function ayudaPendienteDe(m){
  let t=0,cap=0,n=0;
  (m.loans||[]).forEach(l=>(l.pays||[]).forEach((p,pi)=>{ if(p.paid)return; n++;
    const c=cuotaDe(l,pi), r=recargoPorCuota(l); t+=c; cap+=p.aplazada?0:Math.max(0,c-r); }));
  return {cuotas:_r2(t),capital:_r2(cap),n,importe:_r2(SA10_SOLO_CAPITAL?cap:t)};
}
// v45.1 (Maestro v18.3 · GE-1): el aval de un asociado es quien lo recomendó. Los 10 fundadores
// (agosto 2025) no tienen aval. Devuelve {fundador} | {m} | {nombre} (solo por el bono) | null.
function esFundador(m){ return !!(m&&m.type==="asociado"&&m.joinMonth==="Ago"&&m.joinYear===2025); }
function avalDe(m){
  if(!m)return null; if(esFundador(m))return {fundador:true};
  const r=m.referidoPor&&DATA.members.find(x=>x.id===m.referidoPor); if(r)return {m:r};
  const n=quienRefirio(m); return n?{nombre:n}:null;
}
function avalTexto(m){ const a=avalDe(m); return !a?"sin aval anotado":a.fundador?"fundador (sin aval)":escH(a.m?a.m.name:a.nombre); }
// SA-10 paso 4: lo que no cubren su beneficio y sus aportes lo paga su aval; si es fundador, el fondo.
function destinoFaltaTexto(m){ const a=avalDe(m);
  return !a?"pasa a su aval (⚠️ sin anotar: anótalo en ⚙️ Permanencia y aporte)":a.fundador?"lo asume el fondo (fundador, sin aval)":`pasa a su aval: <b>${escH(a.m?a.m.name:a.nombre)}</b>`; }
function avisoMesesPorSaldo(saldo){ return saldo>6000?3:saldo>3000?2:1; } // SA-1
// Salida con las reglas v18. 'ultimoIdx' = último mes en que aporta. Se paga el día 5 del mes
// siguiente (PE-5, SA-5). Al terminar la permanencia conserva todo el beneficio; antes de tiempo
// (o saliendo de la indefinida) solo el de los años completos = 12 aportes pagados (SA-2/3/4).
function salidaV18(m,ultimoIdx){
  const aps=aportesConBeneficio(m,ultimoIdx);
  const capital=_r2(aps.reduce((s,a)=>s+a.aporte,0));
  const generado=_r2(aps.reduce((s,a)=>s+a.ben,0));
  const fin=finPermanenciaIdx(m);
  const tipo=m.ciclo===0?"indefinida":(fin!=null&&ultimoIdx>=fin)?"fin":"anticipada";
  let anios=null, conservado=generado;
  if(tipo!=="fin"){
    const tope=m.ciclo===12?1:m.ciclo===24?2:m.ciclo===36?3:Infinity;
    anios=Math.min(Math.floor(aps.length/12),tope);
    conservado=_r2(aps.slice(0,anios*12).reduce((s,a)=>s+a.ben,0));
  }
  const retirado=beneficioRetirado(m);
  const aPagar=Math.max(0,_r2(conservado-retirado));
  const perdido=Math.max(0,_r2(generado-conservado));
  const ay=ayudaPendienteDe(m);
  const total=_r2(capital+aPagar-ay.importe);
  const saldo=_r2(capital+Math.max(0,generado-retirado));
  const avisoMeses=tipo==="fin"?1:avisoMesesPorSaldo(saldo);
  const p=_mesDeIdx(ultimoIdx+1);
  return {tipo,ultimoIdx,nPagados:aps.length,anios,capital,generado,conservado,retirado,aPagar,perdido,ayuda:ay,total,saldo,avisoMeses,
    pagoMes:p.mes,pagoAnio:p.anio,fechaPago:"del 5 al 10 de "+MONTHS_FULL[MONTHS.indexOf(p.mes)].toLowerCase()+" "+p.anio};
}
// Baja v18: mes de baja = el siguiente al último aporte (desde él ya no cuenta como activo).
// Las cifras se guardan provisionales y se fijan al marcarla como pagada.
function darDeBajaV18(m,ultimoIdx,avisoIdx){
  const motivo=motivoBloqueoBaja(m); if(motivo)return {ok:false,motivo};
  const d=salidaV18(m,ultimoIdx), b=_mesDeIdx(ultimoIdx+1), u=_mesDeIdx(ultimoIdx), a=_mesDeIdx(avisoIdx);
  m.baja={v18:true,month:b.mes,year:b.anio,ultimoMes:u.mes,ultimoAnio:u.anio,avisoMes:a.mes,avisoAnio:a.anio,
    pagoMonth:d.pagoMes,pagoYear:d.pagoAnio,fechaPago:d.fechaPago,pagada:false,estado:"Pendiente"};
  _fijarCifrasBaja(m,d);
  return {ok:true,baja:m.baja};
}
function _fijarCifrasBaja(m,d){
  Object.assign(m.baja,{tipo:d.tipo,capitalDevuelto:d.capital,beneficioGenerado:d.generado,beneficioAnios:d.anios,
    beneficioRetiradoAntes:d.retirado,beneficioConservado:d.aPagar,beneficioPerdido:d.perdido,
    ayudaDescontada:d.ayuda.importe,ayudaCuotas:d.ayuda.n,total:d.total,saldoAviso:d.saldo,avisoMeses:d.avisoMeses});
}
// Cifras de una baja: las guardadas (bajas antiguas o ya pagadas) o, si es v18 y aún no se ha
// pagado, recalculadas con los datos de hoy (p. ej. el último aporte se cobra después de anotarla).
function datosBaja(m){
  const b=m&&m.baja; if(!b)return null;
  if(!b.v18||b.pagada)return b;
  const d=salidaV18(m,_idxMes(b.ultimoMes,b.ultimoAnio));
  return Object.assign({},b,{tipo:d.tipo,capitalDevuelto:d.capital,beneficioGenerado:d.generado,beneficioAnios:d.anios,
    beneficioRetiradoAntes:d.retirado,beneficioConservado:d.aPagar,beneficioPerdido:d.perdido,
    ayudaDescontada:d.ayuda.importe,ayudaCuotas:d.ayuda.n,total:d.total,saldoAviso:d.saldo,avisoMeses:d.avisoMeses});
}
// SA-10: al pagar la baja, sus cuotas pendientes quedan saldadas con lo que se le descuenta
// (compensadas): no se cobran en efectivo ni aparecen en la hoja de cobro.
function _compensarAyudas(m,pagoIdx,deshacer){
  const todas=[...(m.loans||[]),...(m.closedLoans||[])];
  todas.forEach(l=>(l.pays||[]).forEach(p=>{
    if(!deshacer&&!p.paid){p.paid=true;p.compensada=true;p.compIdx=pagoIdx;}
    if(deshacer&&p.compensada){p.paid=false;delete p.compensada;delete p.compIdx;}
  }));
  m.loans=todas.filter(l=>l.pays.some(p=>!p.paid));
  m.closedLoans=todas.filter(l=>l.pays.every(p=>p.paid));
}
// ¿Cuenta como activo en el mes 'mesKey' ("AAAA-MM")? Activo si no tiene baja, o si la
// baja es POSTERIOR a ese mes. Desde el mes de baja (inclusive) deja de contar.
function cuentaComoActivo(m, mesKey){
  if(!m.baja) return true;
  const bajaKey = m.baja.year + "-" + String(MONTHS.indexOf(m.baja.month)+1).padStart(2,"0");
  return mesKey < bajaKey;
}
// Conveniencia: ¿activo en el MES DE REPORTE actual? (para conteos/reparto/envíos).
function activoEnReporte(m){
  return cuentaComoActivo(m, DATA.reportYear + "-" + String(MONTHS.indexOf(DATA.reportMonth)+1).padStart(2,"0"));
}
// TAREA FUTURA (pendiente de revisar): salida de TERCEROS del grupo al saldar su última
// cuota — mecanismo distinto al de baja de asociado. Un tercero no tiene permanencia ni

// ── FUNCIONES CIERRE MENSUAL ─────────────────────────────────────────────────
function getMesKey(m,y){return y+"-"+String(MONTHS.indexOf(m)+1).padStart(2,"0");}
function getMesData(m,y){
  if(!DATA.monthlyData)DATA.monthlyData={};

}
function toggleAporte(memberId,mes,anio){

}
function marcarTodosAportes(){
  const md=getMesData(DATA.reportMonth,DATA.reportYear);

function desmarcarTodosAportes(){

function toggleCuotaCierre(mid,lid,pi){
  DATA.members.forEach(m=>{
    if(m.id===mid){
      [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
        if(l.id===lid)l.pays[pi].paid=!l.pays[pi].paid;
      });
      // Reordenar: si todas pagadas → closedLoans; si alguna pendiente → loans
      const todas=[...(m.loans||[]),...(m.closedLoans||[])];
      m.loans=todas.filter(l=>l.pays.some(p=>!p.paid));
      m.closedLoans=todas.filter(l=>l.pays.every(p=>p.paid));
    }

}
function recalcMesRecargo(){

  // Solo se aplica si el usuario NO lo ha fijado manualmente.
  const md=getMesData(DATA.reportMonth,DATA.reportYear);

    md.recargo=recargoAutoMes(DATA.reportMonth,DATA.reportYear);
  }
}
// mes/anio opcionales: por defecto el mes activo (botón "↻ Recalcular"); el banner de
// reconciliación de meses cerrados (Bloque 7) los pasa explícitamente.
function recalcRecargoForzar(mes,anio){

// v44.13: reparto del mes según el Documento Maestro (§4.1 y §14.1). La obligación del
// mes es la SUMA del beneficio de CADA asociado con derecho según su nivel (aporte 100 =
// doble), la misma función que acumula el beneficio de cada ficha. Retorno (recargo) −
// obligación = excedente, que en esta fase de crecimiento se reinvierte en ayudas. Si el
// retorno no alcanza, los asociados siguen ganando su nivel y la diferencia la pone el fondo.
// v44.19: bonos por referido del mes (descuentos en el aporte; los asume el fondo, Maestro §15.2)
function bonosReferidoMes(rm,ry,soloCobrados){
  let t=0; DATA.members.forEach(m=>{ if(m.type!=="asociado")return;
    const it=itemsMiembroMes(m,rm,ry).find(i=>i.tipo==="aporte");
    if(!it||it.noCobrable||(soloCobrados&&!it.pagado))return; t+=it.descuento||0; });
  return t;
}
function repartoBeneficioMes(recargo,rm,ry){
  const ri=MONTHS.indexOf(rm), key=getMesKey(rm,ry);
  // v45.1 (BE-3): quien sale con las reglas v18 cobra el beneficio de su último aporte el mes
  // siguiente (el de su baja), así que ese mes aún cuenta en el reparto.
  const conDerecho=DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth&&(cuentaComoActivo(m,key)||!!(m.baja&&m.baja.v18&&getMesKey(m.baja.month,m.baja.year)===key))
    &&((m.joinYear<ry)||(m.joinYear===ry&&MONTHS.indexOf(m.joinMonth)<ri)));
  const obligacion=Math.round(conDerecho.reduce((s,m)=>s+beneficioMiembroMes(m,key),0)*100)/100;
  const excedente=Math.round(((recargo||0)-obligacion)*100)/100;
  const media=conDerecho.length?Math.round(obligacion/conDerecho.length*100)/100:0;
  return {conDerecho,obligacion,excedente,media};
}
function renderMesKpis(md){
  const r=repartoBeneficioMes(md.recargo,DATA.reportMonth,DATA.reportYear);
  const el=document.getElementById("mes-kpi-beneficio");
  const el2=document.getElementById("mes-kpi-reserva");
  const el3=document.getElementById("mes-kpi-excedente");
  const el3l=document.getElementById("mes-kpi-excedente-lbl");
  const el4=document.getElementById("mes-kpi-conDerecho");
  const el5=document.getElementById("mes-kpi-media");
  if(el)el.textContent=r.obligacion.toFixed(2)+" €";
  const bon=bonosReferidoMes(DATA.reportMonth,DATA.reportYear), ex=Math.round((r.excedente-bon)*100)/100;

// Lo que corresponde a una persona en rm/ry: aportación (neta) + cuotas de ese mes.
function itemsMiembroMes(m,rm,ry){

      const bruto=aporteBrutoKey(m,key), ex=bruto-aporteBaseDe(m);
      out.push({tipo:"aporte",txt:"Aportación"+(descuento>0?` (−${descuento} € por ${nReferidos} referido${nReferidos>1?"s":""})`:""),
        importe:neto,pagado,recargo:0,
        // v44.19: el bono lo asume el fondo (Maestro BO-3): al asociado se le acredita el aporte íntegro
        bruto,descuento,nReferidos,extra:ex,

        noCobrable:!pagado&&!!m.baja});
    }
  }

    const ult=c.totalCuotas>1&&c.numCuota>=c.totalCuotas;

      importe:c.inst,pagado:!!c.paid,recargo:c.recargo,ultima:ult,aplazada:!!c.aplazada,
      num:c.numCuota,de:c.totalCuotas,gMonth:c.gMonth,gYear:c.gYear});
  });
  return out;

function bloquesCobroMes(rm,ry){
  const porId=new Map(DATA.members.map(m=>[m.id,m])); const usados=new Set(); const bloques=[];
  const fila=m=>{const it=itemsMiembroMes(m,rm,ry); return it.length?{m,items:it}:null;};
  (DATA.gruposCierre||[]).forEach(g=>{
    const filas=[g.principalId,...(g.miembros||[])].map(id=>porId.get(id)).filter(Boolean)
      .map(m=>{usados.add(m.id);return fila(m);}).filter(Boolean);
    const p=porId.get(g.principalId);
    if(filas.length)bloques.push({titulo:"Grupo de "+(p?p.name:"—"),filas});
  });
  const resto=DATA.members.filter(m=>!usados.has(m.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(fila).filter(Boolean);
  if(resto.length)bloques.push({titulo:"Sin grupo de cierre",filas:resto});

  const pendAnt=DATA.members.map(m=>({m,p:pendienteMesAnterior(m,rm,ry)})).filter(x=>x.p.pendiente>0);
  const recargoMes=(typeof md.recargo==="number")?md.recargo:recargoAutoMes(rm,ry); // el guardado del mes manda
  return {bloques,apPrev:r2(apPrev),apCob:r2(apCob),nAp,nApPag,cuPrev:r2(cuPrev),cuCob:r2(cuCob),nCu,nCuPag,
    recPrev:r2(recPrev),recCob:r2(recCob),totPrev:r2(apPrev+cuPrev),totCob:r2(apCob+cuCob),
    noCob:r2(noCob),noCobLista,pendiente:r2(apPrev+cuPrev-apCob-cuCob-noCob),
    bonosPrev:r2(bonosPrev),bonosCob:r2(bonosCob),apBrutoCob:r2(apBrutoCob),

// ── v44.17: LIBRO DE CAJA ────────────────────────────────────────────────────────
// Entradas y salidas reales de dinero mes a mes desde agosto de 2025 (saldo inicial 0 €,
// como en el acta original de agosto). Entradas: aportaciones y cuotas cobradas, aportes
// puntuales recibidos. Salidas: apoyos entregados, aportes puntuales devueltos (con su
// retorno) y devoluciones por baja pagadas. Capital prestado = lo que falta por devolver de
// los apoyos al cerrar el mes. Solo lectura.
let _CAJA_CACHE=null;
function cajaMensual(){
  if(_CAJA_CACHE)return _CAJA_CACHE;
  const fin=DATA.reportYear*12+MONTHS.indexOf(DATA.reportMonth);
  const out={}; let saldo=0, y=2025, i=7, acAp=0, acBen=0, puntPend=0;
  const loans=[]; DATA.members.forEach(m=>[...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>loans.push({m,l})));
  while(y*12+i<=fin){
    const rm=MONTHS[i], key=getMesKey(rm,y), idx=y*12+i;
    const R=resumenMesDoc(rm,y);
    let puntIn=0,puntOut=0,nPuntIn=0,nPuntOut=0;
    Object.values(DATA.aportesPuntuales||{}).forEach(arr=>(arr||[]).forEach(a=>{
      if(a.mes===rm&&a.anio===y){puntIn+=a.capital||0;nPuntIn++;}
      if(a.devuelto&&a.mesDev===rm&&a.anioDev===y){puntOut+=a.total||0;nPuntOut++;}
    }));
    const apoyos=R.concedidos.reduce((s,x)=>s+(x.l.capital||0),0);
    const bajas=DATA.members.filter(m=>m.baja&&m.baja.pagada&&(()=>{const p=mesPagoBaja(m.baja);return p.mes===rm&&p.anio===y;})())
      .reduce((s,m)=>s+(m.baja.total||0),0);
    // v45.1: beneficio retirado sin salir (PE-5, PE-7) que ya se pagó este mes
    let retir=0,nRetir=0; DATA.members.forEach(m=>retiradasDe(m).forEach(r=>{ if(r.pagada&&pagoRetiradaIdx(r)===idx){retir+=importeRetirada(m,r);nRetir++;} }));
    let cartera=0;
    loans.forEach(({l})=>{
      if(l.gYear*12+MONTHS.indexOf(l.gMonth)>idx)return;
      let dev=0; (l.pays||[]).forEach((p,pi)=>{ if(p.paid&&!p.aplazada&&(p.compensada?p.compIdx:p.y*12+MONTHS.indexOf(p.m))<=idx) dev+=cuotaDe(l,pi)-recargoPorCuota(l); }); // v45.1: compensada → cuenta el mes en que se pagó la baja
      cartera+=Math.max(0,l.capital-dev);
    });
    const r2=x=>Math.round(x*100)/100;
    const ent=r2(R.apCob+R.cuCob+puntIn), sal=r2(apoyos+puntOut+bajas+retir);
    const ini=r2(saldo); saldo=r2(saldo+ent-sal);
    // ¿De quién es el dinero? aportaciones acumuladas (se devuelven al terminar el ciclo),
    // beneficios devengados (idem) y aportes puntuales aún no devueltos; el resto es el
    // excedente acumulado del fondo (retornos − beneficios − bonos por referido − retornos
    // pagados a puntuales). v44.19: a cada asociado se le acredita su aporte ÍNTEGRO aunque
    // pagara menos por un bono por referido (lo asume el fondo, Maestro §15.2) + sus extras.
    acAp+=R.apBrutoCob; acBen+=repartoBeneficioMes(R.recargoMes,rm,y).obligacion;
    Object.values(DATA.aportesPuntuales||{}).forEach(arr=>(arr||[]).forEach(a=>{
      if(a.mes===rm&&a.anio===y)puntPend+=a.capital||0;
      if(a.devuelto&&a.mesDev===rm&&a.anioDev===y)puntPend-=a.capital||0;
    }));
    DATA.members.forEach(m=>{ if(!m.baja)return; const b=m.baja;
      if(b.month===rm&&b.year===y)acBen-=(datosBaja(m).beneficioPerdido||0); // lo que pierde pasa al fondo
      if(b.pagada){const p=mesPagoBaja(b); if(p.mes===rm&&p.anio===y){acAp-=(b.capitalDevuelto||0);acBen-=(b.beneficioConservado||0);}}
    });
    acBen-=retir; // v45.1: el beneficio retirado ya no se le debe
    out[key]={ini,retir:r2(retir),nRetir,aportes:R.apCob,bonos:R.bonosCob,aportesBrutos:R.apBrutoCob,cuotas:R.cuCob,retornos:R.recCob,capDev:r2(R.cuCob-R.recCob),puntIn,nPuntIn,entradas:ent,
      apoyos,nApoyos:R.concedidos.length,puntOut,nPuntOut,bajas,salidas:sal,fin:saldo,cartera:r2(cartera),
      acAp:r2(acAp),acBen:r2(acBen),puntPend:r2(puntPend),reserva:r2(saldo+cartera-acAp-acBen-puntPend)};
    i++; if(i>11){i=0;y++;}
  }
  _CAJA_CACHE=out;
  return out;
}

// v44.17: coloca los grupos para que ninguno quede partido entre dos páginas A4 y se
// aproveche el papel. Mide cada grupo con el ancho y la letra de impresión y los reparte
// por páginas (primero los más grandes; cada uno en la primera página donde quepa).
// Además cada grupo lleva break-inside:avoid: aunque la medida fallase, nunca se parte.
// v44.18: imprime y, si el iPhone no abre el cuadro de impresión (pasa en algunas apps
// instaladas en la pantalla de inicio), lo avisa con la alternativa en vez de no hacer nada.
function imprimirDoc(){
  let abierto=false; const f=()=>{abierto=true;};
  window.addEventListener("beforeprint",f);
  try{ window.print(); }catch(e){}
  setTimeout(()=>{
    window.removeEventListener("beforeprint",f);
    if(abierto)return;
    const el=document.getElementById("doc-aviso-imp"); if(!el)return;
    el.innerHTML="El móvil no abrió la impresión desde la app instalada. Abre la app en <b>Safari</b> (xavysarmi-sketch.github.io/asociacion), entra en Cierre → este documento → <b>Imprimir / guardar PDF</b>.";
    el.style.display="block";
  },1500);
}
function paginarGruposSinCortes(){
  document.querySelectorAll(".doc-unidad").forEach(u=>paginarUnidad(u));
}
function paginarUnidad(u){
  // v44.17: si un documento se pasa poco de una hoja (hasta un 35 %), se compacta un poco la
  // letra para que quepa en una sola hoja y no quede una página casi vacía.
  {
    const m0=document.createElement("div"); m0.className="doc-a4 doc-medir";
    m0.style.cssText="position:absolute;left:-9999px;top:0;width:186mm;padding:0;font-size:10px;line-height:1.32;visibility:hidden";
    document.body.appendChild(m0); const c0=u.cloneNode(true); m0.appendChild(c0);
    const h0=c0.getBoundingClientRect().height; document.body.removeChild(m0);
    const P=273*96/25.4;
    if(h0>P*0.96&&h0<P*1.35)u.classList.add("doc-compacta");
  }
  const cont=u.querySelector(".doc-grupos"); if(!cont)return;
  const grupos=[...cont.querySelectorAll(":scope > .doc-grupo")]; if(grupos.length<2)return;
  const cab=cont.querySelector(":scope > .doc-cabgrupos");
  const fin=u.querySelector(".doc-final");
  const med=document.createElement("div");
  const compacta=u.classList.contains("doc-compacta");
  med.className="doc-a4 doc-medir"+(compacta?" doc-compacta":""); med.style.cssText="position:absolute;left:-9999px;top:0;width:186mm;padding:0;font-size:"+(compacta?"9px":"10px")+";line-height:1.32;visibility:hidden";
  document.body.appendChild(med);
  const alto=el=>{const c=el.cloneNode(true); med.appendChild(c); const hh=c.getBoundingClientRect().height; med.removeChild(c); return hh+10;};
  const PAG=(273*96/25.4)*0.94; // alto útil de un A4 con márgenes de 12 mm, con holgura
  const hCab=cab?alto(cab):0, hFin=fin?alto(fin):0;
  // Lo que ya ocupa la unidad antes de los grupos (resumen): se aprovecha el hueco de esa página.
  // Se mide la unidad completa tal cual (con márgenes reales) para saber dónde empiezan los grupos.
  const cu=u.cloneNode(true); med.appendChild(cu);
  const cc=cu.querySelector(".doc-grupos");
  const antes=cc?cc.getBoundingClientRect().top-cu.getBoundingClientRect().top:0;
  med.removeChild(cu);
  const PAG1=(273*96/25.4)*0.9; // la primera página se calcula con más holgura
  const usadoPrimera=antes>0?(antes%PAG1)+(PAG-PAG1):0;
  const items=grupos.map((g,i)=>({g,i,h:alto(g)})).sort((a,b)=>b.h-a.h);
  const pags=[{libre:PAG-usadoPrimera-hCab,items:[]}]; // página 0 = la del resumen (hueco restante)
  items.forEach(it=>{
    let p=pags.find(p=>p.libre>=it.h);
    if(!p){p={libre:PAG,items:[]};pags.push(p);}
    p.items.push(it); p.libre-=it.h;
  });
  if(!pags[0].items.length){ pags.shift(); if(pags.length)pags[0].libre-=hCab; }
  document.body.removeChild(med);
  pags.forEach(p=>p.items.sort((a,b)=>a.i-b.i)); // dentro de cada página, el orden de siempre
  const frag=document.createDocumentFragment();
  if(cab)frag.appendChild(cab);
  // Sin saltos forzados: el orden calculado llena cada hoja y, como ningún grupo ni el bloque
  // final se pueden partir, el navegador pasa a la hoja siguiente solo lo que no cabe.
  pags.forEach(p=>p.items.forEach(it=>frag.appendChild(it.g)));
  cont.innerHTML=""; cont.appendChild(frag);
}

  // ── PESTAÑA ASOCIADOS ──
  if(TAB==="asociados"){

      // Vista fusionada: filtros + fichas estilo reporte (tocables) + Recaudación + Resumen General

      // 1) Recaudación — cobrado vs pendiente del MES EN CURSO (cálculos; el bloque se

      const asocC=DATA.members.filter(m=>m.type==="asociado");
      const tercC=DATA.members.filter(m=>m.type==="tercero");
      const intSplit=asocC.reduce((a,m)=>{const s=dueSplit(m,rm,ry);a.cob+=s.cobrado;a.pen+=s.pendiente;return a;},{cob:0,pen:0});
      const extSplit=tercC.reduce((a,m)=>{const s=dueSplit(m,rm,ry);a.cob+=s.cobrado;a.pen+=s.pendiente;return a;},{cob:0,pen:0});
      const aptSplit=aportesSplit(rm,ry);
      // Aportes extra del mes (p.ej. aporte adicional al fondo). Se registran ya entregados,
      // por eso cuentan como cobrado dentro de "Aportes del mes".
      const aptCob=aptSplit.cobrado; // v45: el aporte elegido ese mes ya va en aportesSplit
      const totCob=intSplit.cob+extSplit.cob+aptCob;
      const totPen=intSplit.pen+extSplit.pen+aptSplit.pendiente;
      // Contador de aportes cobrados X/Y para mostrar junto a "Aportes del mes"
      const _mdRec=getMesData(rm,ry),_riRec=MONTHS.indexOf(rm);
      const _asocAct=DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth&&((m.joinYear<ry)||(m.joinYear===ry&&MONTHS.indexOf(m.joinMonth)<=_riRec))&&activoEnReporte(m));
      const _aptPag=_asocAct.filter(m=>_mdRec.aportes&&_mdRec.aportes[m.id]).length;
      // Subtotal de devoluciones (internas + externas) antes de aportes
      const devCob=intSplit.cob+extSplit.cob;
      // Desglose de aportes puntuales a devolver este mes (pendiente vs ya devuelto) —
      // se calcula aquí porque Recaudación (punto 3, abajo) también lo necesita.
      const spl=salidasPuntualesSplit(rm,ry);
      const bj=resumenBajasMes(rm,ry); // v44.13: devoluciones por baja que se pagan este mes
      const rt=retiradasMes(rm,ry);    // v45.1: beneficio retirado sin salir que se paga este mes
      const salidasYaDevueltas=spl.items.filter(it=>it.devuelto).reduce((s,it)=>s+it.total,0);
      // 2) Botón para desplegar/plegar la lista de asociados (arranca plegada)
      const nAsociados=DATA.members.filter(m=>m.type==="asociado"&&activoEnReporte(m)).length;
      const nAyudasActivas=DATA.members.reduce((s,m)=>s+(m.loans||[]).filter(l=>(l.pays||[]).some(p=>!p.paid)).length,0);
      h+=`<button class="toggle-asoc" onclick="LISTA_ABIERTA=!LISTA_ABIERTA;render()">

          <div class="gb-row gb-total" style="margin-top:6px"><span>SUMA</span><b>${totCob} €</b></div>

          ${(spl.total>0||bj.total>0||rt.total>0)?`<div class="gb-salida">

            ${spl.total>0?`<div class="gb-salida-row"><span class="gb-salida-txt">Devolución de aporte puntual</span><span class="gb-salida-imp">−${spl.total} €</span></div>`:""}
            ${bj.total>0?`<div class="gb-salida-row"><span class="gb-salida-txt">Devolución por baja (${bj.lista.length})</span><span class="gb-salida-imp">−${bj.total} €</span></div>`:""}
            ${rt.total>0?`<div class="gb-salida-row"><span class="gb-salida-txt">Beneficio retirado sin salir (${rt.lista.length})</span><span class="gb-salida-imp">−${fmtEur(rt.total)} €</span></div>`:""}

      const _apt=aportesSplit(rm,ry);
      const entradas=_apt.cobrado+_apt.pendiente+tA+tT; // v45: el aporte elegido ya va en aportesSplit
      // Disponible neto real: PREVISTO del mes (incluye lo aún pendiente de cobrar).

      const dispNeto=_r2(entradas-spl.total-totalAyudasNuevas-bj.total-rt.total);

      const cajaReal=_r2(totCob-totalAyudasNuevas-salidasYaDevueltas-bj.pagadas-rt.pagadas);
      h+=`<div class="resumen-final">
        <div class="rf-title">📊 Resumen General — ${MONTHS_FULL[MONTHS.indexOf(rm)]} ${ry}</div>

        <div class="rf-divider"></div>

        ${rt.lista.map(x=>`<div class="rf-row"><span>Beneficio retirado (${escH(x.m.name)})${x.r.pagada?"":` <small style="opacity:.7">· pendiente de pagar</small>`}</span><span class="rf-val v-neg">−${fmtEur(x.imp)} €</span></div>`).join("")}
        ${ayudasNuevasMes.length>0?`<div class="rf-row ayn-row" onclick="AYUDAS_NUEVAS_ABIERTA=!AYUDAS_NUEVAS_ABIERTA;render()"><span>Ayudas nuevas otorgadas (${ayudasNuevasMes.length}) <span class="arrow">${AYUDAS_NUEVAS_ABIERTA?"▲":"▼"}</span></span><span class="rf-val v-neg">−${totalAyudasNuevas} €</span></div>
        ${AYUDAS_NUEVAS_ABIERTA?ayudasNuevasMes.map(a=>`<div class="rf-row ayn-sub"><span>${escH(a.nombre)}</span><span class="rf-val">${a.capital} €</span></div>`).join(""):""}`:""}
        <div class="rf-neto"><span>Disponible neto real<small>(previsto, incluye pendiente de cobrar)</small></span><b>${dispNeto} €</b></div>
        <div class="rf-neto"><span>Caja real<small>(solo cobrado)</small></span><b>${cajaReal} €</b></div>
        ${dispNeto<0?`<div style="margin:6px 0 4px;padding:9px 12px;border-radius:10px;background:rgba(255,179,71,.16);border:1px solid rgba(255,179,71,.55);color:#FFD9A3;font-size:12.5px;font-weight:700;line-height:1.4">⚠️ Déficit del mes: ${Math.round(-dispNeto*100)/100} € → reduce lo disponible para nuevas ayudas (fase de crecimiento, sin reserva).</div>`:""}
        ${totPen>0?`<div class="rf-falta">faltan ${totPen} € por cobrar</div>`:""}

        <div class="rf-sec">Devoluciones y aportes</div>
        <div class="rf-row"><span>Internas</span><span class="rf-val">${intSplit.cob} €</span></div>
        ${intSplit.pen>0?`<div class="rf-row"><span>Internas pendientes</span><span class="rf-val rf-pend">${intSplit.pen} €</span></div>`:""}
        <div class="rf-row"><span>Externas</span><span class="rf-val">${extSplit.cob} €</span></div>
        ${extSplit.pen>0?`<div class="rf-row"><span>Externas pendientes</span><span class="rf-val rf-pend">${extSplit.pen} €</span></div>`:""}
        <div class="rf-row"><span>Aportes</span><span class="rf-val">${aptCob} €</span></div>
        ${aptSplit.pendiente>0?`<div class="rf-row"><span>Aportes pendientes</span><span class="rf-val rf-pend">${aptSplit.pendiente} €</span></div>`:""}
        <div class="rf-divider"></div>
        <div class="rf-sec">Cartera pendiente</div>
        <div class="rf-row"><span>Pendiente total internas</span><span class="rf-val rf-pend">${totIntPend} €</span></div>
        <div class="rf-row"><span>Pendiente total terceros</span><span class="rf-val rf-pend">${totTercPend} €</span></div>
        <div class="rf-total"><span>CARTERA TOTAL</span><span>${totIntPend+totTercPend} €</span></div>
        ${quedaAsociacionHTML(rm,ry)}
      </div></div>`;
    }
  }

  // ── PESTAÑA HISTÓRICO (solo admin; nunca se renderiza en enlaces de asociado/grupo,
  //    porque render() hace return antes en READONLY_ID / ES_MODO_GRUPO / PREVIEW_ID) ──
  if(TAB==="historico"){
    const bajas=DATA.members.filter(m=>m.baja).sort((a,b)=>{
      const ka=a.baja.year*12+MONTHS.indexOf(a.baja.month), kb=b.baja.year*12+MONTHS.indexOf(b.baja.month);
      return kb-ka || a.name.localeCompare(b.name);
    });
    h+=`<div class="mes-card"><div class="mes-title" style="margin-bottom:10px">📜 Histórico — Bajas de asociados</div>`;
    if(bajas.length===0){
      h+=`<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">Aún no hay bajas registradas.</div>`;
    }else{
      // v44.13: tarjetas (legibles en el iPhone) con la gestión del pago de cada baja
      bajas.forEach(m=>{
        const b=datosBaja(m), pAct=mesPagoBaja(b);
        let optsPago="";{let i=MONTHS.indexOf(b.month)+(b.v18?0:1),y=b.year; /* v45.1: la salida v18 se paga el mes de baja (día 5) */ for(let k=0;k<6;k++){if(i>11){i=0;y++;}const sel=(MONTHS[i]===pAct.mes&&y===pAct.anio)?"selected":"";optsPago+=`<option value="${MONTHS[i]}|${y}" ${sel}>${MONTHS_FULL[i]} ${y}</option>`;i++;}}
        h+=`<div style="border:1px solid #ece5da;border-radius:14px;padding:12px 14px;margin-bottom:12px;background:#fff">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div><div style="font-size:16px;font-weight:800;color:var(--dark)">${escH(m.name)}</div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:2px">Baja: ${escH(MONTHS_FULL[MONTHS.indexOf(b.month)]||b.month)} ${b.year}</div></div>
            <span style="flex-shrink:0;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:${b.pagada?"#E3F1E7":"#FDECE8"};color:${b.pagada?"#1B7A3D":"#C0492C"}">${b.pagada?"✓ Pagado":"Pendiente"}</span>
          </div>
          ${b.v18?`<div style="font-size:12.5px;color:var(--muted);margin-top:2px">${b.tipo==="fin"?"Termina su permanencia":b.tipo==="indefinida"?"Sale de la indefinida":"Sale antes de terminar"} · último aporte: ${escH(MONTHS_FULL[MONTHS.indexOf(b.ultimoMes)]||"")} ${b.ultimoAnio}</div>`:""}
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-top:10px"><span>Capital a devolver</span><b>${fmtEur(b.capitalDevuelto)} €</b></div>
          ${b.v18?`<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-top:4px"><span>Beneficio que se le paga</span><b>${fmtEur(b.beneficioConservado)} €</b></div>
          ${b.ayudaDescontada?`<div style="display:flex;justify-content:space-between;font-size:13.5px;margin-top:4px;color:#C0492C"><span>Ayuda pendiente descontada</span><b>−${fmtEur(b.ayudaDescontada)} €</b></div>`:""}
          <div style="display:flex;justify-content:space-between;font-size:14.5px;margin-top:6px;padding-top:6px;border-top:1px solid #ece5da"><span>${b.total>=0?"Recibe":"Falta por cubrir (pasa a su avalista)"}</span><b>${fmtEur(Math.abs(b.total))} €</b></div>`:""}
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px"><span>Beneficio perdido (queda en el fondo)</span><span>${fmtEur(b.beneficioPerdido)} €</span></div>
          ${b.v18&&!b.pagada?`<div style="font-size:11.5px;color:var(--muted);margin-top:3px">Cifras provisionales: se fijan al marcarla como pagada.</div>`:""}
          ${b.pagada&&b.fechaPagada?`<div style="font-size:12px;color:#1B7A3D;margin-top:4px">Pagado el ${escH(b.fechaPagada)}</div>`:""}
          <div style="margin-top:12px;background:#FAF6F0;border:1px solid #ece5da;border-radius:10px;padding:10px">
            <label class="m-label" style="margin-bottom:6px">${b.v18?"Se paga en (entre el día 5 y el 10)":"Se paga en (día 5)"}</label>
            <select class="m-select" style="font-size:14px;margin-bottom:10px" onchange="setPagoBaja('${esc(m.id)}','mes',this.value)">${optsPago}</select>
            ${b.conReserva?`<div style="font-size:12px;color:#7A5A12;margin-bottom:8px">🏦 Se anotó «con la reserva». Hoy la reserva es solo un dato informativo: el dinero sale de la caja.</div>`:""}
            <button onclick="setPagoBaja('${esc(m.id)}','pagada',${b.pagada?"false":"true"})" style="width:100%;padding:11px;border-radius:10px;border:1.5px solid ${b.pagada?"#D9C9B0":"#2D6A4F"};background:${b.pagada?"#fff":"#2D6A4F"};color:${b.pagada?"#8A7A60":"#fff"};font-size:14px;font-weight:800;cursor:pointer">${b.pagada?"↩ Marcar como pendiente":"✓ Marcar como pagada"}</button>
          </div>
        </div>`;
      });
      const totalDev=_r2(bajas.reduce((s,m)=>s+(datosBaja(m).total||0),0));
      const totalPag=_r2(bajas.filter(m=>m.baja.pagada).reduce((s,m)=>s+(m.baja.total||0),0));
      h+=`<div style="text-align:right;margin-top:4px;font-weight:800;color:#7A2418;line-height:1.5">Total a devolver: ${totalDev} €<br><span style="font-size:13px">Pagado: ${totalPag} € · Pendiente: ${totalDev-totalPag} €</span></div>`;
    }
    h+=`</div>`+historicoRetiradasHTML()+`<div class="mes-card" style="padding-top:10px;padding-bottom:10px"><div style="font-size:11px;color:var(--muted)">Sección de administración. Preparada para crecer (futuros: reingresos, cesiones de plaza).</div></div>`;
  }

  // ── PESTAÑA ENVÍOS ──
  if(TAB==="send"){
    const todosAsoc=DATA.members.filter(m=>m.type==="asociado"&&m.joinMonth&&activoEnReporte(m));
    const tercPend=DATA.members.filter(m=>m.type==="tercero"&&m.loans.some(l=>l.pays.some(p=>!p.paid)));
    const allSend=[...todosAsoc,...tercPend];
    const filteredBase=SEND_FILTER==="asociado"?todosAsoc:SEND_FILTER==="tercero"?tercPend:allSend;
    const filtered=filteredBase;
    const selCount=[...SEND_SELECTED].filter(id=>filtered.some(m=>m.id===id)).length;

    h+=`<div class="send-header">
      <div class="send-header-left">
        <div class="send-title">📤 Envíos por WhatsApp</div>
        <div class="send-sub">${todosAsoc.length} asociados · ${tercPend.length} terceros con deuda</div>
      </div>
      <div class="send-counter">${selCount} sel.</div>
    </div>`;
    h+=`<div class="send-filter">
      <button class="send-filter-btn ${SEND_FILTER==="all"?"on":""}" onclick="SEND_FILTER='all';render()">Todos (${allSend.length})</button>
      <button class="send-filter-btn ${SEND_FILTER==="asociado"?"on":""}" onclick="SEND_FILTER='asociado';render()">🏠 Asoc. (${todosAsoc.length})</button>
      <button class="send-filter-btn ${SEND_FILTER==="tercero"?"terc-on":""}" onclick="SEND_FILTER='tercero';render()">🤝 Terc. (${tercPend.length})</button>
    </div>`;
    h+=`<input class="send-search" type="search" placeholder="🔍 Buscar..." value="${escH(SEND_SEARCH)}" oninput="setSearch(this.value)">`;
    if(SEND_SEARCH)setTimeout(()=>setSearch(SEND_SEARCH),0);
    h+=`<div class="send-controls">
      <button class="send-ctrl-btn select-all-btn" onclick="selectAll()">✅ Todos</button>
      <button class="send-ctrl-btn select-none-btn" onclick="selectNone()">☐ Ninguno</button>
    </div>`;

    if(!filtered.length){
      h+=`<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">Sin resultados</div></div>`;
    }else{
      const asocFilt=filtered.filter(m=>m.type==="asociado");
      const tercCuota=filtered.filter(m=>m.type==="tercero"&&due(m,rm,ry)>0);
      const tercFutura=filtered.filter(m=>m.type==="tercero"&&due(m,rm,ry)===0);

      if(asocFilt.length){
        h+=`<div class="send-section-label">🏠 Asociados — ${rm} ${ry}</div>`;
        asocFilt.forEach(m=>{
          const md2=getMesData(rm,ry);
          const aportePagado=!!(md2.aportes&&md2.aportes[m.id]);
          const dMes=desgloseDelMes(m);
          const isSelected=SEND_SELECTED.has(m.id);
          h+=`<div class="send-card ${isSelected?"selected":""}" data-envio-nombre="${escH(m.name.toLowerCase())}" onclick="toggleSel('${esc(m.id)}')">
            <div class="send-card-left">
              <div class="send-card-check">${isSelected?"✅":"⬜"}</div>
              <div>
                <div class="send-card-name">${escH(m.name)}</div>
                <div class="send-card-meta">
                  Aporte <b style="color:${aportePagado?"#2D6A4F":"var(--warm)"}">50€ ${aportePagado?"✅":"⏳"}</b>${dMes.cuotasMes.length>0?" · "+dMes.cuotasMes.length+" cuota"+(dMes.cuotasMes.length>1?"s":""):""}${dMes.descuento>0?" · −"+dMes.descuento+"€ ref.":""}
                </div>
              </div>
            </div>
            <div style="text-align:right">
              <div style="font-size:16px;font-weight:800;color:var(--dark)">${dMes.totalNeto} €</div>
              <div style="display:flex;gap:6px;margin-top:4px;justify-content:flex-end">
                <button style="padding:7px 12px;border:2px solid var(--accent);border-radius:10px;background:#fff;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer" onclick="event.stopPropagation();previewMiembro('${esc(m.id)}')">👁️ Ver</button>
                <button class="link-btn" onclick="event.stopPropagation();openLinkModal('${esc(m.id)}')">🔗</button>
              </div>
            </div>
          </div>`;
        });
      }
      if(tercCuota.length){
        h+=`<div class="send-section-label">🤝 Terceros — cuota ${rm}</div>`;
        tercCuota.forEach(m=>{h+=sendCardHTML(m,rm,ry);});
      }
      if(tercFutura.length){
        h+=`<div class="send-section-label">⏳ Terceros — deuda futura</div>`;
        tercFutura.forEach(m=>{h+=sendCardHTML(m,rm,ry,true);});
      }
    }

    const batch=[...SEND_SELECTED].filter(id=>DATA.members.some(m=>m.id===id));
    h+=`<div class="send-batch-bar">
      <button class="send-batch-btn" onclick="startWAQueue()" ${!batch.length?"disabled":""}>
        📲 Enviar por WhatsApp${batch.length>0?" ("+batch.length+" asociado"+(batch.length>1?"s":"")+")":" — Selecciona asociados"}
      </button>
      <button style="width:100%;margin-top:8px;padding:13px;border:2px solid var(--dark);border-radius:14px;background:#fff;color:var(--dark);font-size:14px;font-weight:700;cursor:pointer" onclick="copyBatch()" ${!batch.length?"disabled":""}>
        📋 Copiar todos al portapapeles
      </button>
      ${batch.length>=2?`<button class="send-group-btn" onclick="sendGroupLink()">🔗 Enlace grupal (${batch.length} fichas)</button>`:""}
      ${batch.length>0?`<div class="send-batch-info">Seleccionados: ${batch.map(id=>{const m=DATA.members.find(x=>x.id===id);return m?escH(m.name.split(" ")[0]):"";}).join(", ")}</div>`:""}
    </div>`;
  }

  // ── PESTAÑA GESTIÓN ──
  if(TAB==="manage"){
    const asocAll=DATA.members.filter(m=>m.type==="asociado"&&activoEnReporte(m)); // baja: fuera de Gestión (solo en Histórico)
    const tercAll=DATA.members.filter(m=>m.type==="tercero");

    h+=`<div style="margin:8px 0 4px"><input id="mgSearch" type="text" placeholder="🔍 Buscar asociado o tercero por nombre…" value="${escH(MG_SEARCH||"")}" oninput="filtrarGestion(this.value)" style="width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:15px;box-sizing:border-box"></div>`;
    if(MG_SEARCH)setTimeout(()=>filtrarGestion(MG_SEARCH),0);

    // 📝 v45.14: Solicitudes de ayuda y dinero disponible (desplegable, arranca cerrado) — v45.16: arriba del todo
    { const nP=(DATA.solicitudes||[]).filter(x=>x.estado==="pendiente").length, ab=!!DESP["mg-sol"];
      h+=`<div class="mg-acc-head" id="mg-sol-head" onclick="DESP['mg-sol']=!DESP['mg-sol'];render()">
      <span>📝 Solicitudes <span class="mg-acc-num">${nP}</span></span>
      <span class="mg-acc-fl">${ab?"▲ ocultar":"▼ mostrar"}</span></div>`;
      if(ab)h+=`<div style="margin:8px 0 14px">${ayudasTabHTML()}</div>`; }
    // 👥 v45.16: Personas y ayudas — antes «Ayudas Internas» y «Ayudas Externas» (decisión de Ángel 09/10/2026)
    { const ab=!!DESP["mg-per"], fil=MG_PER_FIL;
      h+=`<div class="mg-acc-head" onclick="DESP['mg-per']=!DESP['mg-per'];render()">
      <span>👥 Personas y ayudas <span class="mg-acc-num">${asocAll.length+tercAll.length}</span></span>
      <span class="mg-acc-fl">${ab?"▲ ocultar":"▼ mostrar"}</span></div>`;
      if(ab){
        const chip=(k,t)=>`<button onclick="MG_PER_FIL='${k}';render()" style="flex:1;padding:9px 4px;border-radius:10px;border:1.5px solid ${fil===k?"#1B4332":"#E3DDD2"};background:${fil===k?"#1B4332":"#fff"};color:${fil===k?"#fff":"#3B3B3B"};font-size:13.5px;font-weight:700;cursor:pointer">${t}</button>`;
        h+=`<div style="display:flex;gap:6px;margin:8px 0 12px">${chip("todos","Todos ("+(asocAll.length+tercAll.length)+")")}${chip("asoc","🏠 Asociados ("+asocAll.length+")")}${chip("terc","🤝 Terceros ("+tercAll.length+")")}</div>`;
        if(fil!=="terc"){
          h+=`<button class="add-btn" onclick="openModal('member',{preset:'asociado'})">+ Añadir asociado</button>`;
          asocAll.forEach(m=>{h+=manageHTML(m);});
        }
        if(fil!=="asoc"){
          if(fil==="todos"&&tercAll.length)h+=`<div class="send-section-label" style="margin-top:14px">🤝 Terceros</div>`;
          h+=`<button class="add-btn terc" onclick="openModal('member',{preset:'tercero'})">+ Añadir tercero (con aval)</button>`;
          tercAll.forEach(m=>{h+=manageHTML(m,true);});
        }
      }
    }

    // 🔍 Auditoría interna (dinero/reglas) — antes del auto-chequeo técnico
    h+=auditoriaInternaHTML();
    // 🛡️ Auto-chequeo del sistema (al final)
    h+=chequeoHTML();
    // ⚙️ Configuración (al final)
    h+=configHTML();

    h+=`<div style="background:#fff;border-radius:16px;padding:16px;margin-top:20px;border:1px solid var(--border)">
      <div style="font-size:15px;font-weight:700;color:var(--dark);margin-bottom:4px">💾 Copia de seguridad</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px">Exporta tus datos para no perderlos si borras el caché</div>
      <button class="backup-btn backup-export" onclick="exportData()">📤 Exportar datos (JSON)</button>
      <button class="backup-btn" style="background:#2D6A4F;color:#fff" onclick="subirAhoraNube()">☁️ Subir ahora a la nube</button>
      <button class="backup-btn backup-import" onclick="importData()">📂 Importar backup</button>
      <button style="width:100%;padding:8px;border:none;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer" onclick="openModal('restaurar_backups',{})">Restaurar copia de seguridad local</button>
    </div>`;

    h+=`<button class="reset-btn" onclick="if(confirm('¿Resetear todos los datos? Se perderán todos los cambios.')){DATA=sanitizeData(migrateData(JSON.parse(JSON.stringify(INITIAL))));save();toast('Datos reseteados');render();}">🔄 Resetear a datos originales</button>`;
  }

  h+=`</div>`;

  if(MODAL){
    const dismissable=MODAL.type!=="wa_queue"&&MODAL.type!=="sync_conflict";
    h+=`<div class="modal-bg" ${dismissable?`onclick="closeModal()"`:""} ><div class="modal-sheet" onclick="event.stopPropagation()"><div class="modal-handle"></div>`;
    if(MODAL.type==="member")h+=memberFormHTML();
    if(MODAL.type==="loan")h+=loanFormHTML();
    if(MODAL.type==="cierreloan")h+=cierreLoanFormHTML();
    if(MODAL.type==="editloan")h+=editLoanFormHTML();
    if(MODAL.type==="histloan")h+=histLoanFormHTML();
    if(MODAL.type==="preview")h+=previewFormHTML();
    if(MODAL.type==="link")h+=linkModalHTML();
    if(MODAL.type==="wa_queue")h+=waQueueModalHTML();
    if(MODAL.type==="history")h+=historyModalHTML();
    if(MODAL.type==="extra")h+=extraFormHTML();
    if(MODAL.type==="referido")h+=referidoFormHTML();
    if(MODAL.type==="ciclo")h+=cicloFormHTML();
    if(MODAL.type==="puntual")h+=puntualFormHTML();
    if(MODAL.type==="avalista")h+=avalistaFormHTML();
    if(MODAL.type==="grupo_link")h+=grupoLinkModalHTML();
    if(MODAL.type==="sync_conflict")h+=syncConflictModalHTML();
    if(MODAL.type==="restaurar_backups")h+=restaurarBackupsModalHTML();
    if(MODAL.type==="baja")h+=bajaFormHTML();
    if(MODAL.type==="retirada")h+=retiradaFormHTML();
    if(MODAL.type==="sim")h+=simuladorHTML();
    h+=`</div></div>`;
  }
  document.getElementById("app").innerHTML=h;
}

function sendCardHTML(m,rm,ry,dimmed){
  const dMes=due(m,rm,ry);
  const dTot=pendAll(m);
  const isTerc=m.type==="tercero";
  const isSel=SEND_SELECTED.has(m.id);
  const selClass=isSel?(isTerc?"terc-selected":"selected"):"";
  const btnId=`copy-${m.id}`;
  return`<div class="send-card ${selClass}${dimmed?" no-cuota-this-month":""}" data-envio-nombre="${escH(m.name.toLowerCase())}" onclick="toggleSendSelect('${esc(m.id)}')">
    <div class="send-card-head">

// Abre la pestaña Gestión y lanza el auto-chequeo de código la primera vez.
function irGestion(){
  TAB="manage";
  if(!CODE_CHECKS.ran && !CODE_CHECKS.running) runCodeChecks();
  render();
}
// Comprueba que el archivo PUBLICADO sigue teniendo los arreglos críticos intactos.
// Se descarga a sí mismo (igual que el aviso de "nueva versión") y examina el texto;
// la comprobación del tope/beneficio extra no necesita descarga: ejecuta el cálculo
// real con datos de prueba que no tocan la información de ningún asociado.
function runCodeChecks(force){
  if(CODE_CHECKS.running) return;
  if(CODE_CHECKS.ran && !force) return;
  CODE_CHECKS.running=true;
  if(TAB==="manage")render();
  const url=location.href.split("?")[0]+"?_selfcheck="+Date.now();
  fetch(url,{cache:"no-store"}).then(r=>r.text()).then(src=>{
    // Solo se examina el texto ANTERIOR a este propio auto-chequeo: así el código
    // de esta comprobación (que menciona estos mismos textos) no se confunde consigo
    // mismo y da un falso "todo bien" si algo real hubiera sido borrado.
    const limite=src.indexOf('function runCodeChecks');
    const zona=limite>-1?src.slice(0,limite):src;
    const iSD=zona.indexOf('function sanitizeData(');
    let ok1=false,ok2=false,ok5=false;
    if(iSD>-1){
      // Busca la llave '}' que cierra de verdad sanitizeData (contando llaves,
      // no basta con mirar si el texto siguiente "termina en }").
      let i=zona.indexOf('{',iSD),depth=0,iClose=-1;
      for(;i<zona.length;i++){
        if(zona[i]==='{')depth++;
        else if(zona[i]==='}'){depth--;if(depth===0){iClose=i;break;}}
      }
      if(iClose>-1){
        const resto=zona.slice(iClose+1,iClose+1+200);
        ok1=/^\s*const URL_PARAMS=new URLSearchParams\(window\.location\.search\);/.test(resto);
        const entre=zona.slice(iSD,iClose);
        ok2=/origen\s*===\s*"app"/.test(entre) && /id\.charAt\(0\)\s*===\s*"m"/.test(entre);
        // Protección añadida en v43.23: un asociado del archivo (INITIAL) al que le
        // cambian el nombre en caliente debe seguir reconociéndose por su id, si no
        // sanitizeData lo trata como fantasma y lo borra (bug real: caso Ariel Olivo).
        ok5=/validIds\.has\(m\.id\)/.test(entre);
      }
    }
    const ok3 = zona.includes('Cache-Control" content="no-cache, no-store, must-revalidate"')
      && zona.includes('http-equiv="Pragma" content="no-cache"')
      && zona.includes('http-equiv="Expires" content="0"');
    CODE_CHECKS.online=true; CODE_CHECKS.ok1=ok1; CODE_CHECKS.ok2=ok2; CODE_CHECKS.ok3=ok3; CODE_CHECKS.ok5=ok5;
  }).catch(()=>{ CODE_CHECKS.online=false; }).then(()=>{
    try{
      const t1=tarifaNivelMes({joinMonth:"Ago",joinYear:2025,ciclo:24},"2026-08")===10; // mes venc 12 → Nivel 1
      const t2=tarifaNivelMes({joinMonth:"Ago",joinYear:2025,ciclo:24},"2026-09")===12; // mes venc 13 → Nivel 2
      const b1=levelBenefit({joinMonth:DATA.reportMonth,joinYear:DATA.reportYear,aporte:100});
      const b2=levelBenefit({joinMonth:DATA.reportMonth,joinYear:DATA.reportYear,aporte:50});
      CODE_CHECKS.ok4 = t1 && t2 && b1===20 && b2===10;
    }catch(e){ CODE_CHECKS.ok4=false; }
    CODE_CHECKS.ran=true; CODE_CHECKS.running=false; CODE_CHECKS.ts=Date.now();
    if(TAB==="manage")render();
  });
}

// ¿Qué permanencia hace falta para esta ayuda? (AY-1 y AY-6). Devuelve la primera que vale, desde la actual.
function _simPermNecesaria(m,cap,n){
  const ini=_idxMes(DATA.reportMonth,DATA.reportYear)+1, cur=(m.ciclo!=null?m.ciclo:12);
  const cand=[cur,24,36,0].filter((c,i,a)=>a.indexOf(c)===i&&(cur===0?c===0:(c===0||c>=cur)));
  for(const c of cand){
    if(c===12&&(cap>500||n>5))continue;
    if(cap>SIM_MAX_AYUDA||n>12)continue;
    if(c!==0&&m.joinMonth){ const fin=_idxMes(m.joinMonth,m.joinYear)+c-1; if(ini+n-1>fin)continue; } // v45.7: como máximo en el último mes de permanencia
    return c;
  }

}

      <span style="font-size:18px;transform:rotate(${ab3?90:0}deg)">›</span></button>`;
  if(ab3){
    // v45.10: línea de tiempo (decisión de Ángel 04/10/2026)

// ── Modal "Dar de baja" (dos pasos: elegir mes → confirmar cifras). Solo cablea la
//    interfaz; toda la lógica vive en devolucionBaja/darDeBaja/motivoBloqueoBaja. ──
function bajaFormHTML(){
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  if(!m)return "";
  const bloqueo=motivoBloqueoBaja(m);
  if(bloqueo){ // avalista de una ayuda activa → se muestra el bloqueo, no se puede continuar
    return `<div class="modal-title">🚪 Salida — ${escH(m.name)}</div>
      <div style="background:#FDF0EE;border:2px solid #C0492C;border-radius:12px;padding:14px;font-size:13px;color:#7A2418;margin:10px 0 16px;line-height:1.55">⛔ ${escH(bloqueo)}</div>
      <button class="m-primary" onclick="closeModal()">Entendido</button>`;
  }
  const hoyIdx=_idxMes(DATA.reportMonth,DATA.reportYear);
  if(MODAL.bajaStep!==2){ // paso 1: último mes que aporta y mes en que avisó
    const u=_mesDeIdx(MODAL.bajaUltimoIdx!=null?MODAL.bajaUltimoIdx:hoyIdx);
    const fin=finPermanenciaIdx(m);
    return `<div class="modal-title">🚪 Salida — ${escH(m.name)}</div>
      ${fin!=null?`<div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">Su permanencia de ${m.ciclo} meses termina en ${_txtIdx(fin)}.</div>`:m.ciclo===0?`<div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">Permanencia indefinida.</div>`:""}
      <label class="m-label">Último mes que aporta</label>
      ${selectorMesAnio("baja-mes","baja-anio",u.mes,u.anio)}
      <label class="m-label">Mes en que avisó</label>
      ${selectorMesAnio("baja-am","baja-aa",DATA.reportMonth,DATA.reportYear)}
      <div style="font-size:12px;color:var(--muted);margin:2px 0 16px;line-height:1.4">Se le paga entre el día 5 y el 10 del mes siguiente a su último aporte. Al continuar verás las cifras antes de confirmar.</div>
      <button class="m-primary" onclick="bajaContinuar()">Continuar</button>
      <button onclick="closeModal()" style="width:100%;padding:10px;margin-top:8px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer">Cancelar</button>`;
  }
  // paso 2: cifras con las reglas v18
  const ult=MODAL.bajaUltimoIdx, aviso=MODAL.bajaAvisoIdx;
  const d=salidaV18(m,ult), armed=!!MODAL.bajaArmed;
  const minUlt=d.tipo==="fin"?null:aviso+d.avisoMeses-1;
  const corto=minUlt!=null&&ult<minUlt;
  const fila=(t,v,st)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;${st||""}"><span>${t}</span><b style="white-space:nowrap">${v}</b></div>`;
  const tipoTxt=d.tipo==="fin"?`🏁 <b>Termina su permanencia</b> de ${m.ciclo} meses (Maestro PE-5): recupera sus aportes y todo el beneficio que no haya retirado.`
    :d.tipo==="anticipada"?`🚪 <b>Sale antes de terminar</b> su permanencia (Maestro SA-2): recupera sus aportes y el beneficio de los años completos (12 aportes pagados cada uno).`
    :`🚪 <b>Sale de la permanencia indefinida</b> (Maestro SA-1): recupera sus aportes y el beneficio de los años completos (12 aportes pagados cada uno).`;
  let h=`<div class="modal-title">🚪 Confirmar salida — ${escH(m.name)}</div>
    <div style="font-size:13.5px;line-height:1.5;color:var(--dark);margin:2px 0 10px">${tipoTxt}</div>
    <div style="background:#FFF8F0;border:1px solid #F5D5B0;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#5A3A1E;margin:0 0 12px;line-height:1.45">
      ${fila(`Aportes pagados (${d.nPagados})`,fmtEur(d.capital)+" €")}
      ${fila("Beneficio generado",fmtEur(d.generado)+" €")}
      ${d.tipo!=="fin"?fila(`Conserva el de ${d.anios} año${d.anios===1?"":"s"} completo${d.anios===1?"":"s"}`,fmtEur(d.conservado)+" €"):""}
      ${d.perdido>0?fila("Pierde (año a medias, queda en el fondo)",fmtEur(d.perdido)+" €","color:#9A6A4A;font-size:12.5px"):""}
      ${d.retirado>0?fila("Ya retirado antes","−"+fmtEur(d.retirado)+" €"):""}
      ${fila("Beneficio que se le paga",fmtEur(d.aPagar)+" €")}
      ${d.ayuda.n>0?fila(`Su ayuda pendiente (${d.ayuda.n} cuota${d.ayuda.n>1?"s":""}: capital + 5 %; quedan saldadas)`,"−"+fmtEur(d.ayuda.importe)+" €","color:#C0492C"):""}
      ${d.ayuda.n>0?(()=>{const cb=Math.min(d.aPagar,d.ayuda.importe), ca=Math.min(d.capital,d.ayuda.importe-cb), falta=_r2(d.ayuda.importe-cb-ca);
        return `<div style="font-size:12.5px;color:#7A2418;margin:2px 0 4px;line-height:1.45">Se cubre primero con su beneficio (${fmtEur(cb)} €), después con sus aportes (${fmtEur(ca)} €)${falta>0?` y faltan <b>${fmtEur(falta)} €</b>: ${destinoFaltaTexto(m)}`:""}.</div>`;})():""}
      ${fila(d.total>=0?"Recibe":"Falta por cubrir",fmtEur(Math.abs(d.total))+" €","border-top:1px solid #F0D2B0;margin-top:4px;padding-top:6px;font-size:15px")}
      <div style="font-size:12.5px;margin-top:4px">${d.total>=0?`Se paga <b>${escH(d.fechaPago)}</b>.`:`Su beneficio y sus aportes no cubren la ayuda: lo que falta ${destinoFaltaTexto(m)} (Maestro SA-10).`}</div>
    </div>`;
  if(d.tipo!=="fin")h+=`<div style="background:${corto?"#FDF0EE":"#F4F7F5"};border:1.5px solid ${corto?"#C0492C":"#C9DCCF"};border-radius:12px;padding:10px 12px;font-size:13px;color:${corto?"#7A2418":"#2E4A3A"};margin-bottom:12px;line-height:1.45">
      Aviso según su saldo (${fmtEur(d.saldo)} €): <b>${d.avisoMeses} mes${d.avisoMeses>1?"es":""}</b> (Maestro SA-1). Avisó en ${_txtIdx(aviso)}${corto?`: su último aporte debería ser, como pronto, el de <b>${_txtIdx(minUlt)}</b>. Solo si lo aceptas como coordinador.`:" ✓"}</div>`;
  // v45.1 (SA-10, decisión de Ángel 03/10/2026): con una ayuda pendiente la salida no es automática
  const negociar=d.ayuda.n>0&&!MODAL.bajaNegociado;
  if(d.ayuda.n>0)h+=`<div style="background:#FDF0EE;border:1.5px solid #C0492C;border-radius:12px;padding:12px;font-size:13px;color:#5A2418;margin-bottom:12px;line-height:1.5">
      ⚠️ <b>Tiene una ayuda pendiente: la salida no es automática</b> (Maestro SA-10). Antes:<br>
      1. Negociar que siga: aplazamiento, ampliar la permanencia o lo que sea mejor.<br>
      2. Si ya cumplió sus primeros 12 meses: cubrir la ayuda con su beneficio guardado, sin salir.<br>
      3. Si no se puede: sale y la ayuda se cancela con sus aportes y su beneficio (estas cifras).<br>
      4. Si aun así no alcanza: lo que falte ${destinoFaltaTexto(m)}.
      ${negociar?`<button onclick="MODAL.bajaNegociado=true;render()" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1.5px solid #C0492C;background:#fff;color:#C0492C;font-size:13.5px;font-weight:700;cursor:pointer">Ya se negoció: no puede seguir</button>`:`<div style="margin-top:6px;font-weight:700">✓ Negociado: no puede seguir.</div>`}</div>`;
  if(ult>=hoyIdx)h+=`<div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.4">Cuenta los aportes ya cobrados. Las cifras se actualizan solas con los que cobres hasta su último mes y se fijan al marcar la devolución como pagada (Histórico).</div>`;
  if(!negociar)h+=`<button class="m-primary" style="${armed?"background:#C0492C":""}" onclick="${armed?`confirmarBaja('${esc(m.id)}')`:"MODAL.bajaArmed=true;render()"}">${armed?"⚠️ Pulsa de nuevo para CONFIRMAR la salida":corto?"Confirmar con aviso más corto":"Anotar la salida"}</button>
`;
  h+=`<button onclick="MODAL.bajaStep=1;MODAL.bajaArmed=false;render()" style="width:100%;padding:10px;margin-top:8px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer">← Cambiar meses</button>`;
  return h;
}
function bajaContinuar(){
  const ult=_idxMes(document.getElementById("baja-mes").value,parseInt(document.getElementById("baja-anio").value));
  const av=_idxMes(document.getElementById("baja-am").value,parseInt(document.getElementById("baja-aa").value));
  const m=DATA.members.find(x=>x.id===MODAL.mid);
  if(m&&m.joinMonth&&ult<_idxMes(m.joinMonth,m.joinYear)){toast("⛔ El último mes no puede ser anterior a su entrada",3500);return;}
  if(ult<av-1){toast("⛔ El último mes no puede ser anterior al aviso",3500);return;}
  MODAL.bajaUltimoIdx=ult; MODAL.bajaAvisoIdx=av; MODAL.bajaStep=2; MODAL.bajaArmed=false; render();
}
function confirmarBaja(mid){
  const m=DATA.members.find(x=>x.id===mid);
  if(!m)return;
  const r=darDeBajaV18(m,MODAL.bajaUltimoIdx,MODAL.bajaAvisoIdx);
  if(!r.ok){ closeModal(); toast(r.motivo||"No se pudo anotar la salida"); return; }
  save(); closeModal(); toast(m.name+": salida anotada ✓ · se paga "+m.baja.fechaPago);
}

function addCierreLoanSubmit(){

  const rm=DATA.reportMonth, ry=DATA.reportYear;
  const ni=(MONTHS.indexOf(rm)+1)%12;
  const ny=MONTHS.indexOf(rm)===11?ry+1:ry;
  const m=DATA.members.find(x=>x.id===mid);
  if(!m)return;
  { const c=_condicionActual(m), v=validarApoyo(m,cap,nn,c.tipo,c.ciclo,{m:MONTHS[ni],y:ny}); // v45: mismas reglas que en la ficha
    if(v.bloqueo){ const el=document.getElementById("cl-preview"); if(el)el.innerHTML=_avisoApoyoHTML(v); toast("⛔ No se puede registrar: revisa el aviso",4000); return; } }
  const rate=DATA.rate;

  for(let i=0;i<nn;i++){pays.push({m:MONTHS[mi],y:yr,paid:false});mi++;if(mi>=12){mi=0;yr++;}}
  if(!m.loans)m.loans=[];

  const tipoEnConcesion=m.type;

  const cicloEnConcesion=(m.ciclo!=null?m.ciclo:null);
  m.loans.push({id:lid,gMonth:rm,gYear:ry,capital:cap,total,n:nn,inst,cuotas,rate,pays,tipoEnConcesion,avalistaEnConcesion,cicloEnConcesion});
  if(!m.history)m.history=[];
  m.history.push({gMonth:rm,gYear:ry,capital:cap,lid});

  if(MODAL&&MODAL.sol){ const so=(DATA.solicitudes||[]).find(x=>x.id===MODAL.sol);

    if(so&&so.avalId&&m.type==="tercero"&&!m.ref)m.ref=so.avalId; // v45.15
    if(so){ so.estado="otorgada"; so.mid=mid; so.lid=lid; so.mesOtorgada=getMesKey(rm,ry); so.capitalOtorgado=cap; so.cuotasOtorgadas=nn; so.entregaGid=gidEnt||null; so.fechaOtorgada=_cgHoy(); } }
  save();closeModal();render();toast("Ayuda registrada ✓");
}
