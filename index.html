<style>
:root{--bg:#F5F0EB;--card:#fff;--accent:#2D6A4F;--dark:#1B4332;--warm:#E07A3A;--warm-lt:#FFF0E6;--text:#2C2C2C;--muted:#7A7A7A;--border:#E8E0D8;--paid:#2D6A4F;--paid-bg:#D8F3DC;--terc:#5B5EA6;--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none}
input,select,textarea{font-family:inherit;-webkit-appearance:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 28px;border-radius:30px;font-size:15px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);white-space:nowrap;transition:opacity .3s;pointer-events:none}
.toast.hidden{opacity:0}
.header{background:linear-gradient(135deg,#1B4332,#2D6A4F);padding:calc(22px + env(safe-area-inset-top)) 20px 16px;border-radius:0 0 24px 24px;text-align:center;position:relative;overflow:hidden}
.safe-top-cover{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:1;pointer-events:none}
.header::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06)}
.h-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px}
.h-sub{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:12px}
.h-date-row{display:flex;align-items:center;justify-content:center;gap:6px}
.h-date-sel{background:rgba(255,255,255,.18) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 9px center;border:none;border-radius:10px;color:#fff;font-weight:700;font-size:15px;padding:7px 26px 7px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.h-date-sel option{background:#1B4332;color:#fff}
.tabs{display:flex;gap:5px;padding:14px 16px 6px}
.tab{flex:1;padding:11px 0;border:none;border-radius:12px;font-size:13px;font-weight:700;background:#fff;color:#7A7A7A;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .2s}
.tab.active{background:var(--dark);color:#fff;box-shadow:0 2px 8px rgba(27,67,50,.3)}
.content{padding:8px 16px 30px}
.legend{display:flex;gap:14px;justify-content:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.grand{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:18px;padding:20px;text-align:center;margin-bottom:20px}
.grand-label{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.grand-val{font-size:32px;font-weight:800;color:#fff;margin:4px 0}
.grand-sub{display:flex;justify-content:center;gap:8px;font-size:14px;color:rgba(255,255,255,.7)}
.rep-filtros{display:flex;gap:8px;margin:14px 0 16px}
.rep-filtro{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid #D9CFC0;background:#fff;color:#6B5D4A;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.rep-filtro.on{background:#2D6A4F;border-color:#2D6A4F;color:#fff}
.rep-filtro{display:flex;flex-direction:column;align-items:center;gap:4px}
.filtro-num{display:inline-block;min-width:26px;padding:1px 8px;border-radius:20px;font-size:15px;font-weight:800;background:#EFE9DF;color:#2D6A4F}
.rep-filtro.on .filtro-num{background:rgba(255,255,255,.22);color:#fff}
.grand-sub b{font-weight:700;color:#fff}
.grand-breakdown{margin-top:10px;text-align:left}
.gb-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;font-size:14px;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.12)}
.gb-row>span:first-child{min-width:0;flex:1}
.gb-row b{color:#fff;font-weight:700;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;flex-shrink:0}
.rec-fila{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
.rec-l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rec-l1 .rec-lbl{font-size:14px;color:rgba(255,255,255,.85);min-width:0;flex:1}
.rec-l1 .rec-imp{font-weight:800;color:#fff;font-size:16px;white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
.gb-salida{margin-top:8px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.3)}
.gb-salida-lbl{font-size:12px;color:rgba(255,255,255,.65)}
.gb-salida-row{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.gb-salida-txt{font-size:13px;color:rgba(255,255,255,.75)}
.gb-salida-imp{font-weight:800;color:#FFAA92;font-size:15px}
.gb-salida-sub{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:3px}
.rec-sub{background:rgba(255,255,255,.06);border-radius:8px;padding:8px;border-bottom:none;margin-top:2px}
.rec-sub .rec-lbl{font-weight:700}
.toggle-asoc{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;color:#1B4332;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:16px}
.toggle-asoc .ta-num{background:#2D6A4F;color:#fff;border-radius:20px;padding:2px 10px;font-size:13px;margin-left:6px}
.toggle-asoc .ta-flecha{color:var(--muted);font-size:13px;font-weight:600}
.gb-row.gb-total{border-bottom:none;border-top:1.5px solid rgba(255,255,255,.3);margin-top:4px;padding-top:9px;font-size:15px;font-weight:700;color:#fff}
.gb-row.gb-total b{font-size:18px}
.sec-title{font-size:18px;font-weight:700;color:var(--dark);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.mg-acc-head{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);border-left:4px solid #2D6A4F;border-radius:12px;padding:14px 16px;margin:14px 0 6px;font-size:16px;font-weight:700;color:var(--dark);cursor:pointer}
.mg-acc-head.terc{border-left-color:#E07A3A}
.mg-acc-num{background:#2D6A4F;color:#fff;border-radius:20px;padding:2px 10px;font-size:13px;margin-left:6px}
.mg-acc-head.terc .mg-acc-num{background:#E07A3A}
.mg-acc-fl{font-size:13px;font-weight:600;color:var(--muted)}
.sec-title.terc{color:var(--terc)}
.card{background:#fff;border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--border)}
.card.terc{border-color:#D5D6E8}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-name{font-weight:700;font-size:18px;color:var(--dark)}
.card.terc .card-name{color:var(--terc)}
.card-ref{font-size:13px;color:var(--muted);margin-top:1px}
.share-btn{background:#25D366;border:none;border-radius:12px;padding:10px 14px;font-size:18px}
.loan{padding:14px 16px}
.loan+.loan{border-top:1px dashed var(--border)}
.loan-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.loan-lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.loan-amt{font-weight:700;font-size:17px;color:var(--text);margin-top:2px}
.loan-det{font-size:14px;color:var(--muted);margin-top:1px}
.loan-pend{text-align:right}
.loan-pend-lbl{font-size:12px;font-weight:600;color:var(--muted)}
.loan-pend-val{font-weight:700;font-size:17px;color:var(--warm)}
.timeline{display:flex;flex-wrap:wrap;gap:5px}
.cuota{flex:1 1 64px;border-radius:10px;padding:8px 4px;text-align:center;min-width:64px;border:none}
.cuota-paid{background:var(--paid-bg);outline:2px solid var(--paid)}
.cuota-due{background:var(--warm-lt);outline:2.5px solid var(--warm);box-shadow:0 0 0 3px rgba(224,122,58,.15)}
.cuota-future{background:#F5F5F5;outline:2px solid #DEDEDE}
.cuota-aplazada{background:#EEEDFE;outline:2px solid #534AB7}
.cuota-aplazada .cuota-month,.cuota-aplazada .cuota-val{color:#3C3489}
.cuota-aplazada .cuota-status{color:#26215C}
.cuota-month{font-size:12px;font-weight:600;text-transform:uppercase}
.cuota-val{font-size:15px;font-weight:700;margin-top:2px}
.cuota-status{font-size:11px;font-weight:700;margin-top:3px}

/* v44.17: documentos imprimibles (Hoja de cobro / Acta de cierre) */
/* v44.18: la barra deja libre la zona de la hora/notch del iPhone (app instalada): antes quedaba debajo y no respondía */
.doc-barra{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--border)}
.doc-aviso-imp{flex-basis:100%;font-size:12px;line-height:1.35;color:#7A2418;background:#FDF0EE;border:1px solid #f0c9c2;border-radius:10px;padding:8px 10px}
body.doc-abierto #appVersionTag{display:none}
.doc-raya{display:inline-block;width:100%;min-width:34px;border-bottom:1px solid #444;height:1.05em;vertical-align:bottom}
.doc-raya-e{display:inline-block;width:60px;border-bottom:1px solid #444;height:1.05em;vertical-align:bottom;margin-right:3px}
.doc-barra button{flex:1;padding:11px 8px;border-radius:12px;border:1.5px solid var(--accent);background:#fff;color:var(--dark);font-size:14px;font-weight:700}
.doc-barra .doc-imp{background:var(--dark);color:#fff;border-color:var(--dark)}
.doc-a4{background:#fff;color:#1d1d1d;padding:16px 14px 20px;font-size:12px;line-height:1.4}
.doc-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2.5px solid #1B4332;padding-bottom:8px;margin-bottom:10px}
.doc-org{font-size:11px;font-weight:800;letter-spacing:2px;color:#2D6A4F}
.doc-tit{font-size:18px;font-weight:800;color:#1B4332}
.doc-fecha{font-size:11px;color:#555;text-align:right}
.doc-a4 h3{font-size:13.5px;color:#1B4332;margin:14px 0 6px;border-bottom:1px solid #cfd8d2;padding-bottom:3px}
.doc-a4 h4{font-size:12px;color:#1B4332;margin:0 0 3px}
.doc-kpis{display:flex;gap:6px;margin-bottom:8px}
.doc-kpi{flex:1;border:1px solid #cfd8d2;border-radius:8px;padding:6px 8px}
.doc-kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#555;font-weight:700}
.doc-kpi .v{font-size:15px;font-weight:800;color:#1B4332}
.doc-kpi .s{font-size:10px;color:#666}
.doc-t{width:100%;border-collapse:collapse;margin-bottom:8px}
.doc-t th,.doc-t td{border:1px solid #c9c9c9;padding:4px 5px;vertical-align:top;text-align:left}
.doc-t th{background:#EEF4F0;font-size:10.5px}
.doc-t .n{text-align:right;white-space:nowrap}
.doc-t .c{text-align:center;white-space:nowrap}
.doc-t .n .doc-sub{white-space:normal;line-height:1.2}
.doc-cobro td{vertical-align:middle}
.sim-range{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:6px;background:#E3DDD2;outline:none;margin:10px 0 6px} /* v45.6 */
.sim-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:#1B4332;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.sim-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#1B4332;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
.doc-nuevos tr.doc-hueco td{height:30px;vertical-align:middle} /* v45.3 */
.doc-check{display:inline-block;width:15px;height:15px;border:1.6px solid #333;border-radius:3px;vertical-align:middle}
.doc-cobro tr.doc-cont td.doc-cpt,.doc-cobro tr.doc-cont td.n{border-top:1px dashed #b9c4bd}
.doc-cobro tr.doc-fila-ap td.doc-cpt{background:#F3F7F4}
.doc-cobro .doc-cpt .doc-sub{font-size:.9em}
.doc-gtit{background:#1B4332!important;color:#fff;font-size:12px!important;letter-spacing:.3px}
.doc-nom{font-weight:700}
.doc-fija{table-layout:fixed}
.doc-fija td{word-wrap:break-word}
.doc-conc{padding:0!important}
.doc-lin{display:flex;justify-content:space-between;gap:8px;padding:4px 5px}
.doc-lin+.doc-lin{border-top:1px dashed #b9c4bd}
.doc-lin-ap{background:#F3F7F4}
.doc-lin-imp{white-space:nowrap;font-weight:700}
.doc-caja2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.doc-caja2 .doc-t{margin-bottom:0}
/* v44.17: versión compacta (documentos que se pasan poco de una hoja) */
.doc-compacta{font-size:9px!important;line-height:1.25!important}
.doc-compacta .doc-t th,.doc-compacta .doc-t td{padding:1.5px 3px!important}
.doc-compacta h3{margin:5px 0 3px!important;font-size:11.5px!important}
.doc-compacta .doc-kpi{padding:3px 6px!important} .doc-compacta .doc-kpi .v{font-size:12px!important}
.doc-compacta .doc-lin{padding:1.5px 3px!important}
.doc-compacta .doc-mini td{font-size:9px!important}
.doc-compacta .doc-t{margin-bottom:5px}
.doc-sub{font-size:10px;color:#666;font-weight:400}
.doc-subt td{background:#F6F6F2;font-weight:700}
.doc-ya td{color:#6b7a70}
.doc-pend td{background:#FFF6EC}
.doc-mini td{font-size:11.5px}
.doc-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:6px}
.doc-ul{margin:0;padding-left:16px}
.doc-vacio{color:#888;font-style:italic}
.doc-nota{font-size:10.5px;color:#555;margin-bottom:6px}
.doc-arq td{font-size:12px;padding:6px}
.doc-pie{margin-top:8px;font-weight:700}
.doc-gen{margin-top:14px;font-size:9.5px;color:#888;text-align:center}
.doc-nueva-pag{margin-top:26px;border-top:3px dashed #cfd8d2;padding-top:14px}
/* v44.17: la medición para paginar usa los mismos tamaños que la impresión */
.doc-medir .doc-t th,.doc-medir .doc-t td{padding:2.5px 4px}
.doc-medir h3{margin:8px 0 4px;font-size:12.5px}
.doc-medir .doc-kpi{padding:4px 7px} .doc-medir .doc-kpi .v{font-size:13.5px}
.doc-medir .doc-cols{gap:3px 12px;margin-top:4px}
.doc-medir .doc-cab{margin-bottom:6px;padding-bottom:5px}
.doc-medir .doc-lin{padding:2.5px 4px}
.doc-medir .doc-mini td{font-size:10px}
/* v44.18: vista en el móvil (solo pantalla; la impresión no cambia) — columnas que caben sin montarse */
@media screen and (max-width:640px){
  .doc-a4{padding:12px 8px 18px;font-size:11px}
  .doc-tit{font-size:16px}
  .doc-kpis{gap:4px} .doc-kpi{padding:5px 6px} .doc-kpi .v{font-size:13px}
  .doc-t th,.doc-t td{padding:3px 3px}
  .doc-t th{font-size:9px}
  .doc-fija th.n,.doc-fija th.c,.doc-fija td.c{white-space:normal}
  .doc-lin{gap:4px;padding:3px}
  .doc-caja2{grid-template-columns:1fr}
  .doc-cobro col:nth-child(1){width:20%!important} .doc-cobro col:nth-child(2){width:36%!important}
  .doc-cobro col:nth-child(3){width:13%!important} .doc-cobro col:nth-child(4){width:13%!important}
  .doc-cobro col:nth-child(5){width:13%!important} .doc-cobro col:nth-child(6){width:5%!important}
  .doc-cobro.doc-actad col:nth-child(1){width:18%!important} .doc-cobro.doc-actad col:nth-child(2){width:28%!important}
  .doc-cobro.doc-actad col:nth-child(3){width:12%!important} .doc-cobro.doc-actad col:nth-child(4){width:12%!important}
  .doc-cobro.doc-actad col:nth-child(5){width:12%!important} .doc-cobro.doc-actad col:nth-child(6){width:18%!important}
  .doc-cobro .doc-raya{min-width:0}
  .doc-t th{hyphens:manual}
}
@media print{.doc-nueva-pag{margin-top:0;border-top:none;padding-top:0}}
@media print{
  body>*:not(#app){display:none!important}   /* avisos fijos, versión, banner de actualización */
  .no-print{display:none!important}
  body{background:#fff!important;max-width:none!important}
  .doc-a4{padding:0;font-size:10px;line-height:1.32}
  .doc-t th,.doc-t td{padding:2.5px 4px}
  .doc-a4 h3{margin:8px 0 4px;font-size:12.5px}
  .doc-kpi{padding:4px 7px} .doc-kpi .v{font-size:13.5px}
  .doc-cols{gap:3px 12px;margin-top:4px}
  .doc-cab{margin-bottom:6px;padding-bottom:5px}
  .doc-lin{padding:2.5px 4px}
  .doc-mini td{font-size:10px}
  .doc-t tr,.doc-cols>div,.doc-kpis,.doc-grupo,.doc-final{break-inside:avoid}
  .doc-salto{break-before:page;height:0}
  .doc-salto-antes{break-before:page}
  .doc-nueva-pag{break-before:page}
  .doc-portada{font-size:9.5px}
  .doc-portada .doc-t th,.doc-portada .doc-t td{padding:2px 4px}
  .doc-portada h3{margin:8px 0 4px}
  .doc-portada .doc-nota{font-size:9px;margin-bottom:2px}
  .doc-arq,.doc-mini{break-inside:avoid}
  .doc-a4 h3,.doc-a4 h4,.doc-nota,.doc-cabgrupos{break-after:avoid}
  thead{display:table-header-group}
  @page{size:A4;margin:12mm}
}
/* v44.17: última cuota de un apoyo — marco dorado + franja "ÚLTIMA" arriba (opción C elegida por Ángel) */
.cuota-ultima{position:relative;padding-top:20px!important;box-shadow:0 0 0 2px #fff,0 0 0 4.5px #C9A227}
.cuota-ultima::before{content:"ÚLTIMA";position:absolute;top:0;left:0;right:0;background:#C9A227;color:#fff;font-size:9px;font-weight:800;letter-spacing:.6px;padding:2px 0;border-radius:8px 8px 0 0;text-align:center}
.ult-chip{display:inline-block;padding:1px 8px;border-radius:9px;background:#C9A227;color:#fff;font-size:11px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;vertical-align:1px;white-space:nowrap}
.cuota-paid .cuota-month,.cuota-paid .cuota-val{color:var(--paid)}
.cuota-paid .cuota-status{color:var(--dark)}
.cuota-due .cuota-month,.cuota-due .cuota-val,.cuota-due .cuota-status{color:var(--warm)}
.cuota-future .cuota-month,.cuota-future .cuota-val,.cuota-future .cuota-status{color:#AAA}

/* Timeline cuotas */

.cuota-hist-right{display:flex;align-items:center;gap:8px}

/* Historial beneficios mes a mes */
.ben-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0EBE4;font-size:13px}

/* Botón volver */

/* Gestión rápida en ficha */

.mgmt-btn.secondary{background:#F0EBE4;color:var(--dark)}

/* ── DESPLEGABLES ── */
.desplegable-btn{width:100%;padding:11px 14px;border:2px solid var(--border);background:var(--bg);border-radius:12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--dark);margin-bottom:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}

.desplegable-body{background:#fff;border:2px solid var(--accent);border-top:none;border-radius:0 0 12px 12px;padding:0 12px;margin-bottom:4px}
.desp-hint{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}


/* ── FICHA v21 ── */
.ficha-id-card{background:#fff;border-radius:20px;padding:18px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.07)}

.ficha-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1B4332,#52B788);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0}
.ficha-id-name{font-size:20px;font-weight:800;color:var(--dark);line-height:1.2}

.pill-blue{background:#EEEDF8;color:#5B5EA6}

.ficha-kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fkpi{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.fkpi-v{font-size:18px;font-weight:800;color:var(--dark)}
.fkpi-l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* Bloque beneficios/aportes */

.ben-bloque-title{font-size:15px;font-weight:700;color:var(--dark)}
.ben-bloque-val{font-size:15px;font-weight:800}
.ben-bloque-arrow{font-size:20px;font-weight:900;color:var(--accent);transition:transform .2s}

.ben-sub-header{padding:12px 0 8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px dashed #EEE}

.ben-nota-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);cursor:pointer;margin:8px 0 4px}
.ben-nota-box{background:#FFF8F0;border:1px solid #F5D5B0;border-radius:12px;padding:12px 14px;font-size:13px;color:#5A3A1A;line-height:1.6;margin-bottom:10px}
.resumen-total-card{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:14px;padding:16px;margin:4px 0 8px}
.rt-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.rt-row:last-child{border-bottom:none;margin-top:6px;padding-top:10px}
.rt-lbl{font-size:13px;color:rgba(255,255,255,.75)}
.rt-val{font-size:15px;font-weight:700;color:#fff}
.rt-total-lbl{font-size:14px;font-weight:800;color:#fff}
.rt-total-val{font-size:22px;font-weight:900;color:#fff}


/* ══ FICHA v22 ══════════════════════════════════════════════════════════ */

/* Tarjeta identidad */
.fid-card{background:#fff;border-radius:20px;padding:18px 16px 14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.fid-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.fid-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1B4332,#52B788);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.5px}

.desg-lbl{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
.desg-val{font-size:14px;font-weight:700;color:#fff}

.desg-val.pend{color:#FFB347}
.desg-val.desc{color:#52B788}

.desg-total-fila{display:flex;justify-content:space-between;align-items:center}
.desg-total-lbl{font-size:14px;font-weight:800;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:.5px}
.desg-total-val{font-size:30px;font-weight:900;color:#fff}
.tot-final{margin-top:2px}
.tot-final-lbl{font-size:13px;font-weight:800;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.tot-final-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tot-final-num{font-size:34px;font-weight:900;color:#fff;line-height:1}
.tot-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(140,224,176,.18);border:1px solid rgba(140,224,176,.5);color:#8CE0B0;font-weight:800;font-size:17px;padding:9px 17px;border-radius:999px;white-space:nowrap}
.tot-chip.pend{background:rgba(224,122,58,.2);border-color:rgba(224,122,58,.55);color:#F5B989}

/* Acordeón principal */
.acord{background:#fff;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.acord-btn{width:100%;padding:15px 16px;border:none;background:transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left;-webkit-tap-highlight-color:rgba(0,0,0,.06)}

.acord-icon{font-size:20px;line-height:1}
.acord-titulo{font-size:15px;font-weight:700;color:var(--dark)}
.acord-sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.acord-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.acord-val{font-size:15px;font-weight:800;color:#2D6A4F}
.acord-arrow{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--accent);transition:transform .2s;flex-shrink:0}
.acord-arrow.open{transform:rotate(90deg)}
.acord-body{border-top:1px solid #F0EBE4;padding:0 16px}

/* Sub-acordeón */
.sub-acord-btn{width:100%;padding:11px 0;border:none;background:transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left;border-bottom:1px dashed #EEE8E0}
.sub-acord-btn:last-child{border-bottom:none}
.sub-titulo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.sub-val{font-size:13px;font-weight:700;color:var(--dark)}
.sub-arrow{font-size:16px;color:#AAA;transition:transform .2s;margin-left:6px}
.sub-arrow.open{transform:rotate(90deg) ;color:var(--accent)}
.sub-body{padding:4px 0 8px}
.sub-fila{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F9F5F1;font-size:13px}
.sub-fila:last-child{border-bottom:none}
.sub-fila-lbl{color:var(--muted);font-weight:500}
.sub-fila-val{font-weight:700;color:var(--dark)}

/* Nota informativa */
.nota-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 16px;margin:12px 0 0;border:none;border-radius:12px;background:#2D6A4F;color:#fff;cursor:pointer;width:100%;text-align:left;font-size:14px;font-weight:700;box-shadow:0 2px 6px rgba(45,106,79,.25)}
.nota-btn .nota-btn-txt{flex:1}
.nota-btn .nota-chev{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#fff;color:#2D6A4F;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;line-height:1;padding-bottom:3px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.nota-btn-txt{font-size:14px;font-weight:700;color:#fff}
.nota-cuerpo{background:#F0FAF4;border:1px solid #B7DFC7;border-radius:12px;padding:14px;font-size:13px;color:#1B4332;line-height:1.7;margin:8px 0 4px}

/* Flechas de desplegable más visibles */
.acord-arrow{width:30px;height:30px;border-radius:50%;background:#1B4332;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;transition:transform .2s;flex-shrink:0;box-shadow:0 1px 4px rgba(27,67,50,.25)}
.acord-arrow.open{transform:rotate(90deg)}
.sub-arrow{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#E5DECF;color:#1B4332;font-size:15px;font-weight:900;transition:transform .2s;margin-left:8px}
.sub-arrow.open{transform:rotate(90deg);background:#B08D3E;color:#fff}

/* Pestañas del detalle del asociado */
.ft-tabs{display:flex;gap:4px;margin:14px 0 12px;background:#EFEAE0;border-radius:14px;padding:4px}
.ft-tab{flex:1 1 0;min-width:0;padding:9px 4px;border:none;background:transparent;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s;text-align:center}
.ft-tabs.t5 .ft-tab{flex:1 1 auto;padding:9px 3px;font-size:11.5px} /* v45.2: 5 pestañas (Aval) */
.ft-tab.active{background:#1B4332;color:#fff;box-shadow:0 2px 8px rgba(27,67,50,.25)}
.ft-card{background:#fff;border:1px solid var(--border,#E5DECF);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(27,67,50,.05)}
.ft-card-soft{background:#F7F4EE}
.ft-card-title{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600;color:#1B4332;margin-bottom:12px;padding-bottom:9px;border-bottom:1.5px solid #F0EBE4;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.ft-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F5F1EA;font-size:14px}
.ft-row:last-child{border-bottom:none}
.ft-lbl{color:#5A6B61;font-weight:500;line-height:1.4}
.ft-val{font-weight:700;color:#1C2B22;text-align:right;white-space:nowrap}
.ft-total{border-top:2px solid #E5DECF;border-bottom:none;margin-top:4px;padding-top:12px}
.ft-total .ft-lbl{font-weight:700;color:#1C2B22}
.ft-total .ft-val{font-size:18px}
.ft-hero{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;color:#fff}
.ft-hero-lbl{font-size:12px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.ft-hero-val{font-family:'Fraunces',Georgia,serif;font-size:30px;font-weight:600;margin-top:4px;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.ft-empty{text-align:center;color:var(--muted);font-size:14px;padding:18px 0}

/* Desplegable claro e intuitivo (para que se note que se toca) */
.ft-drop{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid #D9E2DB;border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;box-shadow:0 1px 3px rgba(27,67,50,.05)}
.ft-drop:hover{background:#F7FAF8;border-color:#1B4332}
.ft-drop.abierto{border-color:#1B4332;border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.ft-drop-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.ft-drop-titulo{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:600;color:#1B4332}

.ft-drop-chevron{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#1B4332;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;line-height:1;padding-bottom:3px;transition:transform .25s;box-shadow:0 2px 6px rgba(27,67,50,.3)}
.ft-drop.abierto .ft-drop-chevron{transform:rotate(90deg);background:#B08D3E}
.ft-drop-body{border:1.5px solid #1B4332;border-top:none;border-radius:0 0 14px 14px;padding:6px 16px 12px;margin-bottom:12px;background:#fff;animation:ftSlide .2s ease}

.ayuda-pagada{background:#F4F6F3;border-color:#DDE6DD}
.ayuda-pagada .ayuda-titulo{color:#5A6B61}
.ap-toggle-btn{margin-top:6px;padding:5px 12px;border:1px solid #1B4332;background:#fff;color:#1B4332;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer}
.ap-toggle-btn:active{background:#1B4332;color:#fff}
.nota-cuerpo b{color:#1B4332}

/* Resumen dentro del acordeón */
.resumen-box{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:12px;padding:14px;margin:12px 0 4px}
.res-fila{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.res-fila:last-child{border-bottom:none;padding-top:10px;margin-top:4px;border-top:2px solid rgba(255,255,255,.2)}
.res-lbl{font-size:13px;color:rgba(255,255,255,.75);font-weight:500}
.res-val{font-size:14px;font-weight:700;color:#fff}
.res-total-lbl{font-size:13px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.3px}
.res-total-val{font-size:20px;font-weight:900;color:#fff}

/* Ayudas activas */
.ayuda-item{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:8px}
.ayuda-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ayuda-titulo{font-size:14px;font-weight:700;color:var(--dark)}
.ayuda-meta{font-size:11px;color:var(--muted);margin-top:2px}
.ayuda-progreso{font-size:11px;color:var(--muted);text-align:right}

.cuota-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;margin-bottom:4px;font-size:13px}

.cuota-row.due{background:#FFF0E6;outline:2px solid var(--warm)}

.cuota-mes.due{color:#C75B0E}

<script>
const NH_PROD_FIREBASE_PROJECT_ID="nuevos-horizontes-6d924";
const NH_PRODUCTION_ORIGINS=new Set(["https://xavysarmi-sketch.github.io"]);
// Identidad ficticia: el SDK se conecta después al emulador local, nunca a este
// projectId en la nube. No contiene credenciales ni corresponde a un proyecto real.
const NH_DEV_FIREBASE_CONFIG={projectId:"nh-local-dev",apiKey:"demo-local",appId:"demo-local"};

function detectarEntornoNH(loc=window.location){
  const protocol=(loc.protocol||"").toLowerCase();
  const hostname=(loc.hostname||"").toLowerCase();
  const origin=(loc.origin||"").toLowerCase();
  const local=protocol==="file:"||hostname==="localhost"||hostname==="127.0.0.1"||
    hostname==="::1"||hostname.endsWith(".localhost");
  const produccion=protocol==="https:"&&NH_PRODUCTION_ORIGINS.has(origin);
  // Fail closed: cualquier origen que no sea producción conocida es desarrollo.
  return {modo:produccion?"produccion":"desarrollo",local,origin,protocol,hostname};
}

function mostrarModoDesarrollo(){
  const mostrar=()=>{
    document.body?.classList.add("nh-development-mode");
    document.getElementById("devModeBanner")?.classList.add("visible");
  };
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",mostrar,{once:true});
  else mostrar();
}

function bloquearFirestoreProduccion(motivo){
  console.error("[NH SEGURIDAD] Firestore de producción bloqueado:",motivo);
  window._fbSave=async function(){
    console.error("[NH SEGURIDAD] Escritura remota bloqueada en modo desarrollo");
    return false;
  };
  window._fbLoad=async function(){return null;};
  window._fbReady=true;
  mostrarModoDesarrollo();
  window.dispatchEvent(new Event("firebase-ready"));
}

function initFirebase(){
  const entorno=detectarEntornoNH();
  const prodConfig={
    apiKey:"AIzaSyCLYo-VZwtsEn807EgDtcz9_M0fsfkkIuI",
    authDomain:"nuevos-horizontes-6d924.firebaseapp.com",
    projectId:NH_PROD_FIREBASE_PROJECT_ID,
    storageBucket:"nuevos-horizontes-6d924.firebasestorage.app",
    messagingSenderId:"1093738262656",
    appId:"1:1093738262656:web:405bf732dc1210b54db665"
  };
  const firebaseConfig=entorno.modo==="produccion"?prodConfig:NH_DEV_FIREBASE_CONFIG;

  if(entorno.modo!=="produccion"){
    mostrarModoDesarrollo();
    if(!entorno.local){
      bloquearFirestoreProduccion("origen no reconocido; solo localhost/127.0.0.1/file:// pueden usar DEV");
      return;
    }
    if(!firebaseConfig){
      bloquearFirestoreProduccion("origen no productivo; backend DEV no configurado");
      return;
    }
    if(firebaseConfig.projectId===NH_PROD_FIREBASE_PROJECT_ID){
      bloquearFirestoreProduccion("una configuración DEV intentó usar el projectId de producción");
      return;
    }
  }

  if(typeof firebase==="undefined"){
    // Firebase no cargó (sin conexión o bloqueado) — seguir con localStorage
    console.warn("Firebase no disponible, usando solo localStorage");
    window._fbSave=async function(){return false;};
    window._fbLoad=async function(){return null;};
    window._fbReady=true;
    window.dispatchEvent(new Event("firebase-ready"));
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();
    if(entorno.modo==="desarrollo"){
      db.useEmulator("127.0.0.1",8080);
      window.NH_FIREBASE_MODE="emulator";
      console.warn("[NH DESARROLLO] Firestore Emulator 127.0.0.1:8080 · projectId nh-local-dev");
    }else{
      window.NH_FIREBASE_MODE="production";
    }
    const DOC_REF=db.collection("nh").doc("data");

    window._fbSave=async function(data){
      try{
        const savePromise=DOC_REF.set({payload:JSON.stringify(data)});
        const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),8000));
        await Promise.race([savePromise,timeoutPromise]);
        return true;
      }catch(e){console.error("Firebase save error:",e);return false;}
    };

    window._fbLoad=async function(){
      try{
        const snap=await DOC_REF.get();
        if(snap.exists){return JSON.parse(snap.data().payload);}
        return null;
      }catch(e){console.error("Firebase load error:",e);return null;}
    };

    if(entorno.modo==="desarrollo"){
      const prepararFixture=async()=>{
        const snap=await DOC_REF.get();
        if(!snap.exists){
          if(!window.NH_DEV_FIXTURE||window.NH_DEV_FIXTURE.fixtureLabel!=="DATOS DE PRUEBA — NO PRODUCCIÓN"){
            throw new Error("Fixture ficticio ausente o sin marca de seguridad");
          }
          await DOC_REF.set({payload:JSON.stringify(window.NH_DEV_FIXTURE)});
          console.warn("[NH DESARROLLO] Fixture ficticio creado en el emulador");
        }
        const banner=document.getElementById("devModeBanner");
        if(banner)banner.textContent="MODO DESARROLLO — PRODUCCIÓN BLOQUEADA · DATOS DE PRUEBA — NO PRODUCCIÓN";
      };
      prepararFixture().catch(e=>console.error("[NH DESARROLLO] No se pudo preparar el fixture:",e)).finally(()=>{
        window._fbReady=true;
        window.dispatchEvent(new Event("firebase-ready"));
      });
      return;
    }
  }catch(e){
    console.error("Firebase init error:",e);
    window._fbSave=async function(){return false;};
    window._fbLoad=async function(){return null;};
  }
  window._fbReady=true;
  window.dispatchEvent(new Event("firebase-ready"));
}

// Esperar a que el DOM esté listo antes de inicializar
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", initFirebase);
}else{
  initFirebase();
}
</script>

// Mientras hay un conflicto de sincronización pendiente de decidir (modal en pantalla),
// save() NO debe subir a Firebase: si lo hiciera, lo local viejo pisaría lo más reciente
// de la nube antes de que el usuario decida. Se reanuda al resolver el modal.
let SYNC_DECISION_PENDING=false;

// BEGIN NH_TERCEROS_REF_MIGRATION
// Normalización compatible con el resto de la app: ignora caja, tildes y espacios
// repetidos, pero exige que el nombre normalizado completo coincida exactamente.
function _normNombre(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
}

// Convierte únicamente el avalista VIVO (member.ref). Las ayudas y, en especial,
// avalistaEnConcesion no se recorren ni se modifican. Los casos sin solución única
// se conservan literalmente y quedan expuestos como avisos estructurados.
function migrarRefsTerceros(data,{convertir=true}={}){
  const resultado={convertidos:[],conservados:[],avisos:[]};
  if(!data||!Array.isArray(data.members))return resultado;

  const idsExistentes=new Set(data.members.filter(Boolean).map(m=>m.id));
  const asociadosPorNombre=new Map();
  data.members.forEach(m=>{
    if(!m||m.type!=="asociado"||typeof m.name!=="string")return;
    const nombre=_normNombre(m.name);
    if(!nombre)return;
    if(!asociadosPorNombre.has(nombre))asociadosPorNombre.set(nombre,[]);
    asociadosPorNombre.get(nombre).push(m);
  });

  data.members.forEach(m=>{
    if(!m||m.type!=="tercero"||typeof m.ref!=="string"||!m.ref.trim())return;
    if(idsExistentes.has(m.ref)){
      resultado.conservados.push({terceroId:m.id,ref:m.ref,motivo:"id_valido"});
      return;
    }

    const candidatos=asociadosPorNombre.get(_normNombre(m.ref))||[];
    if(candidatos.length===1&&convertir){
      const refAnterior=m.ref;
      m.ref=candidatos[0].id;
      resultado.convertidos.push({terceroId:m.id,refAnterior,refNueva:m.ref});
      return;
    }

    const tipo=candidatos.length===0?"sin_coincidencia":candidatos.length>1?"ambiguo":"nombre_pendiente";
    resultado.avisos.push({
      tipo,
      terceroId:m.id,
      refConservada:m.ref,
      candidatos:candidatos.map(a=>a.id)
    });
  });

  if(typeof window!=="undefined")window.NH_TERCEROS_REF_WARNINGS=resultado.avisos;
  resultado.avisos.forEach(aviso=>{
    console.warn(`[NH MIGRACIÓN TERCEROS] ${aviso.tipo}: tercero=${aviso.terceroId}; ref conservada; candidatos=${aviso.candidatos.length}`);
  });
  return resultado;
}

function migrarRefsTercerosAV11(data){
  if(!data||(data._version!==9&&data._version!==10))return{aplicada:false,resultado:null};
  const resultado=migrarRefsTerceros(data);
  data._version=11;
  return{aplicada:true,resultado};
}
// END NH_TERCEROS_REF_MIGRATION

// Migration: merge INITIAL metadata into existing DATA without losing payment states
function migrateData(data){
  if(!data||!data.members)return data;
  // Necesario para el bloque v7→v8 de abajo: recalcularApoyo/recargoPorCuota/ayudaTotal
  // usan DATA.rate como fallback cuando una ayuda no tiene su propio l.rate, pero
  // migrateData() se ejecuta ANTES de que el global DATA se reasigne al resultado
  // (DATA=sanitizeData(migrateData(...))) — en la primera carga DATA aún es undefined.
  // Se sobrescribe de todos modos justo después de esta función, así que es seguro.
  DATA=data;

  // Alias de renombrados conocidos (cesiones de plaza — cláusula 7.6, o cambios de
  // nombre). Se aplican AQUÍ, antes de cualquier comparación por nombre contra
  // INITIAL más abajo, para que ningún paso de alta cree un "fantasma" duplicado
  // con el nombre antiguo (así se creó el id 13 duplicado: Kamen Pablov/Ariel Olivo,
  // porque el renombrado solo vivía en sanitizeData, que corre DESPUÉS de esto).
  // Único sitio del archivo donde se mantiene esta tabla — no duplicar en sanitizeData.
  const ALIAS_NOMBRES={
    "kamen pablov":"Ariel Olivo",
    "mery sarmiento":"Gloria Sarmiento"
  };
  data.members.forEach(m=>{
    const alias=ALIAS_NOMBRES[_normNombre(m.name)];
    if(alias)m.name=alias;
  });
  if(data.aportesPuntuales){
    Object.values(data.aportesPuntuales).forEach(arr=>{
      if(!Array.isArray(arr))return;
      arr.forEach(ap=>{
        if(ap&&ap.destino){
          const alias=ALIAS_NOMBRES[_normNombre(ap.destino)];
          if(alias)ap.destino=alias;
        }
      });
    });
  }

  // ── → v6: re-sincronizar datos maestros desde INITIAL, INCLUIDO el id ──
  // Los datos del ARCHIVO (INITIAL) son la fuente de verdad. Refrescamos id,
  // type, ref, ciclo, fechas de ingreso, loans e history de cada miembro
  // (cruce por nombre), y damos de alta los nuevos. Reasignar el id corrige
  // fichas cruzadas (p. ej. Amada abriendo otra persona) por ids mal guardados.
  if((data._version||0) < 6){
    const imap={};
    INITIAL.members.forEach(m=>{imap[m.name.toLowerCase().trim()]=m;});
    data.members.forEach(m=>{
      const ref=imap[(m.name||"").toLowerCase().trim()];
      if(ref){
        m.id=ref.id;                 // ← clave: anclar el id al del archivo
        m.type=ref.type;
        m.ref=ref.ref;
        m.ciclo=ref.ciclo;
        m.joinMonth=ref.joinMonth;
        m.joinYear=ref.joinYear;
        // MODO B: las ayudas (loans) e historial se registran desde la app y son
        // la fuente de verdad del usuario. NO se sobrescriben con las del archivo;
        // solo se reponen si el miembro guardado no tuviera ninguna.
        if(!Array.isArray(m.loans))m.loans=JSON.parse(JSON.stringify(ref.loans||[]));
        if(!Array.isArray(m.history))m.history=JSON.parse(JSON.stringify(ref.history||[]));
        if(!m.phone)m.phone="";
      }
    });
    // Altas que están en INITIAL pero no en los datos guardados — por ID, no por
    // nombre (mismo criterio que sanitizeData desde v43.23; el bucle de arriba ya
    // ancla m.id=ref.id a los que hacen match por nombre, así que para cuando
    // llegamos aquí los ids ya están correctos). Comparar por nombre fue la causa
    // raíz del id 13 duplicado (Kamen Pablov/Ariel Olivo) y del mismo patrón en
    // Stalyn Villafuerte — con 100+ personas, nombres iguales o parecidos generarían
    // más duplicados silenciosos. ALIAS_NOMBRES sigue haciendo falta, pero solo para
    // actualizar el NOMBRE visible — ya no es la barrera contra altas fantasma.
    const haveIds=new Set(data.members.map(m=>m.id));
    INITIAL.members.forEach(im=>{
      if(!haveIds.has(im.id)){
        const nuevo=JSON.parse(JSON.stringify(im));
        // Si INITIAL todavía usa el nombre antiguo (nadie lo ha renombrado ahí),
        // aplicar el alias también al alta fresca — si no, entraría con el nombre
        // viejo porque el barrido de ALIAS_NOMBRES de arriba ya había terminado.
        const alias=ALIAS_NOMBRES[_normNombre(nuevo.name)];
        if(alias)nuevo.name=alias;
        data.members.push(nuevo);
      }
    });
    // El mes de reporte es un dato VIVO del usuario, no de INITIAL — solo se toma de
    // INITIAL si de verdad falta (v44.2, mismo bug que causó el "615 de julio").
    if(data.reportMonth==null)data.reportMonth=INITIAL.reportMonth;
    if(data.reportYear==null)data.reportYear=INITIAL.reportYear;
    data._version=6;
    return data;
  }

  // ── v8→v9: v44.1 cambió el redondeo de ayudaTotal/ayudaCuotas de céntimos exactos
  // a euros enteros y equilibró el reparto (decisión de Ángel). Vuelve a pasar
  // recalcularApoyo(l) por cada ayuda para que total/cuotas queden en euros enteros
  // — es la ÚNICA diferencia con v8, así que este bloque es MÍNIMO a propósito: NO
  // reejecuta el resto de la migración (resincronizar con INITIAL, resetear
  // reportMonth/reportYear, dar de alta miembros nuevos...), que sería incorrecto
  // para datos que ya están al día en todo lo demás (p. ej. le resetearía el mes de
  // reporte de Ángel de vuelta a "Jul" aunque ya esté en "Ago"). Idempotente: no
  // toca pays[].paid, aplazada, instAplazada, ni monthlyData (incluido el recargo).
  if(data._version===8){
    data.members.forEach(m=>{
      [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
        recalcularApoyo(l);
      });
    });
    data._version=9;
    return data;
  }

  // ── v9/v10→v11: refs históricas por nombre pasan a IDs sin tabla fija ──
  // La conversión exige una coincidencia normalizada única entre asociados. Un ID
  // válido se conserva; cero o varias coincidencias no se resuelven automáticamente.
  // Esta es la única migración estructural nueva: APP_VERSION sigue siendo v44.5.
  const migracionTerceros=migrarRefsTercerosAV11(data);
  if(migracionTerceros.aplicada)return data;

  if(data._version>=DATA_VERSION){
    // Recalcular solo los avisos en cada carga. convertir:false garantiza que una
    // versión ya migrada nunca vuelva a mutar datos de forma silenciosa.
    migrarRefsTerceros(data,{convertir:false});
    return data;
  }
  // El mes de reporte es un dato VIVO del usuario — solo se toma de INITIAL si falta
  // (v44.2: esta línea reseteaba el mes de Ángel de "Ago" a "Jul" en cada migración,
  // lo que a su vez disparó el recalculo silencioso del recargo de julio, 565→615).
  if(data.reportMonth==null)data.reportMonth=INITIAL.reportMonth;
  if(data.reportYear==null)data.reportYear=INITIAL.reportYear;
  if(!data.monthlyData)data.monthlyData={};
  
  const initialMap={};
  INITIAL.members.forEach(m=>{initialMap[m.name.toLowerCase()]=m;});
  
  // Update existing members with new fields + loans frescos del INITIAL
  data.members.forEach(m=>{
    const ref=initialMap[m.name.toLowerCase()];
    if(ref){
      if(!m.joinMonth&&ref.joinMonth){m.joinMonth=ref.joinMonth;m.joinYear=ref.joinYear;}
      // MODO B: las ayudas (loans) se registran desde la app y mandan. Solo se
      // reponen desde el archivo si el miembro guardado no tuviera NINGUNA ayuda —
      // ni activa ni cerrada. Antes solo miraba m.loans: a quien tenía todo cerrado
      // (closedLoans no vacío, loans vacío) lo trataba como "sin ayudas" y le
      // inyectaba una copia vieja desde INITIAL con el mismo id (caso real: Stalyn
      // Villafuerte, l4_1 duplicada).
      const sinNinguna=(!Array.isArray(m.loans)||m.loans.length===0)
                      &&(!Array.isArray(m.closedLoans)||m.closedLoans.length===0);
      if(sinNinguna){
        if(ref.loans&&ref.loans.length>0){
          m.loans=JSON.parse(JSON.stringify(ref.loans));
        }
      }
      if(!m.history||m.history.length===0){m.history=JSON.parse(JSON.stringify(ref.history||[]));}
      if(!m.phone)m.phone="";
      if(m.ciclo==null&&ref.ciclo!=null){m.ciclo=ref.ciclo;} // ciclo 0 = indefinido, es un valor válido, no "falta"
    }
    if(!m.history)m.history=[];
    if(!m.joinMonth)m.joinMonth=null;
    if(!m.joinYear)m.joinYear=null;
  });
  
  // Add members that exist in INITIAL but not in saved data — por ID, no por nombre.
  // Ver el comentario detallado más arriba (misma corrección, mismo motivo: el id 13
  // duplicado Kamen Pablov/Ariel Olivo y el mismo patrón en Stalyn Villafuerte).
  const haveIds2=new Set(data.members.map(m=>m.id));
  INITIAL.members.forEach(im=>{
    if(!haveIds2.has(im.id)){
      const nuevo=JSON.parse(JSON.stringify(im));
      // Igual que arriba: aplicar el alias al alta fresca si INITIAL aún usa el nombre antiguo.
      const alias=ALIAS_NOMBRES[_normNombre(nuevo.name)];
      if(alias)nuevo.name=alias;
      data.members.push(nuevo);
    }
  });
  
  // Update report month/year — solo si falta, mismo motivo que arriba (v44.2).
  if(data.reportMonth==null)data.reportMonth=INITIAL.reportMonth;
  if(data.reportYear==null)data.reportYear=INITIAL.reportYear;

  // ── v7→v8: recalcular total/cuotas con la función central, y corregir Maribel Checa ──
  // Idempotente: puede ejecutarse N veces con resultado idéntico (recalcularApoyo y el
  // patrón exacto de M2 son deterministas y no dependen de si ya se aplicaron antes).
  {
    // M1: recalcular total y cuotas de TODA ayuda (loans + closedLoans) con
    // recalcularApoyo(l) — es la única función que puede escribir total/inst/cuotas
    // (REGLA PERMANENTE) y respeta los aplazamientos (Melanny). NO toca pays[].paid,
    // aplazada, ni instAplazada.
    data.members.forEach(m=>{
      [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
        recalcularApoyo(l);
      });
    });
    // M2: Maribel Checa (id 15) — SOLO si coincide EXACTAMENTE el patrón: en su
    // historial, un registro de Jun 2026 con capital 400 y SIN lid → capital 500 y
    // lid "l15_1". No crea una segunda ayuda, no duplica historial, no cambia la fecha.
    data.members.forEach(m=>{
      if(m.id!=="15"||!Array.isArray(m.history))return;
      m.history.forEach(h=>{
        if(h.gMonth==="Jun"&&h.gYear===2026&&h.capital===400&&!h.lid){
          h.capital=500; h.lid="l15_1";
        }
      });
    });
  }

  // Versiones antiguas que llegan por la ruta general también adoptan la regla
  // dinámica antes de marcarse como v11.
  migrarRefsTerceros(data);
  data._version=DATA_VERSION;
  return data;
}

// Saneamiento que corre SIEMPRE al cargar (venga de localStorage o Firebase),
// sin depender de la versión. Reancla el id de cada miembro al del archivo
// (INITIAL) cruzando por nombre, para que las fichas nunca queden cruzadas
// aunque los datos guardados estén corruptos. NO toca pagos ni aportes.
function sanitizeData(data){
  if(!data||!data.members)return data;
  // Renombrados conocidos (cesiones de plaza, cambios de nombre): se aplican en
  // ALIAS_NOMBRES dentro de migrateData (que corre siempre, antes que esta función),
  // no aquí — un único sitio evita que dos mecanismos hagan lo mismo en lugares
  // distintos y que uno de los dos llegue tarde (así se creó el id 13 duplicado).
  const byName={};
  INITIAL.members.forEach(m=>{byName[m.name.toLowerCase().trim()]=m;});
  // Eliminar SOLO miembros fantasma (datos viejos que ya no existen en el archivo).
  // Se CONSERVAN: los del archivo (INITIAL) y los que tú creaste desde la app
  // (marcados con origen:"app" o con id que empieza por "m"+timestamp).
  // Antes este filtro borraba por error a los asociados nuevos y con ellos sus ayudas.
  const validNames=new Set(INITIAL.members.map(m=>m.name.toLowerCase().trim()));
  const validIds=new Set(INITIAL.members.map(m=>m.id));
  data.members=data.members.filter(m=>{
    if(validNames.has((m.name||"").toLowerCase().trim()))return true; // está en el archivo
    if(validIds.has(m.id))return true;                                // está en el archivo (por id, aunque le hayan cambiado el nombre)
    if(m.origen==="app")return true;                                  // creado desde la app
    if(typeof m.id==="string" && m.id.charAt(0)==="m")return true;     // id de la app
    return false; // fantasma real: descartar
  });
  // Reconciliación puntual: Andrea Rodriguez (t3) se convirtió a asociada desde la app
  // ANTES de que existiera la marca `convertido` — su ref quedó en null pero el tipo se
  // revertía a "tercero" en cada carga (control #10 "Tercero sin avalista"). Se estampa
  // la marca UNA vez (idempotente) para que el mecanismo general de abajo la respete, y
  // se conserva constancia del aval en su ayuda saldada. Fuente del avalista: Excel
  // Maestro (Mario Orozco, ayuda marzo 2026, 300 €) e INITIAL (t3.ref="3"). Mismo estilo
  // que los parches puntuales ya existentes (Maribel Checa id 15 / l15_1 en migrateData).
  {
    const and=data.members.find(m=>m.id==="t3");
    if(and){
      and.convertido=true;
      [...(and.loans||[]),...(and.closedLoans||[])].forEach(l=>{
        if(l.id==="lt3_1"&&(l.avalistaEnConcesion===undefined||l.avalistaEnConcesion===null)){
          l.tipoEnConcesion="tercero";
          l.avalistaEnConcesion="Mario Orozco";
        }
      });
    }
  }
  data.members.forEach(m=>{
    const ref=byName[(m.name||"").toLowerCase().trim()];
    if(ref){
      m.id=ref.id;          // id correcto del archivo (fuente de verdad)
      // tipo: por defecto lo fija el archivo (INITIAL); es la fuente de verdad y evita
      // que un dato viejo del navegador falsee el tipo (regla crítica). ÚNICA excepción:
      // una conversión tercero→asociado hecha DELIBERADAMENTE desde la app deja la marca
      // m.convertido===true. Esa sí persiste, porque no es un dato viejo sino un cambio
      // real, y solo la app puede escribirla (en Firestore solo escribe la app).
      // Fallo cerrado: sin la marca, manda el archivo. El anclaje de id no se toca nunca.
      if(m.convertido===true && ref.type==="tercero"){
        m.type="asociado";
      }else{
        m.type=ref.type;      // asociado / tercero
      }
      // avalista (ref = avalistaId): ahora EDITABLE desde la app (Fase 1B, "Cambiar
      // avalista"). Igual que loans/history, NO se sobrescribe con el de INITIAL si
      // el miembro ya lo trae guardado — si no, cada carga revertiría la edición del
      // admin. Solo se repone si faltase (primera sincronización de un alta nueva).
      if(m.ref===undefined)m.ref=ref.ref;
    }
  });
  // Fusionar referidos del archivo (INITIAL) sin pisar los ya registrados
  if(INITIAL.referidos){
    if(!data.referidos)data.referidos={};
    Object.keys(INITIAL.referidos).forEach(mid=>{
      if(!data.referidos[mid])data.referidos[mid]={};
      Object.keys(INITIAL.referidos[mid]).forEach(k=>{
        if(!data.referidos[mid][k])data.referidos[mid][k]=INITIAL.referidos[mid][k];
      });
    });
  }
  // Reponer el HISTORIAL FIJO de aportes mensuales desde el archivo (INITIAL).
  // Los meses cerrados (hasta junio 2026) son dato histórico que no debe perderse
  // aunque el navegador tenga datos viejos. El mes en curso y futuros se respetan.
  if(INITIAL.monthlyData){
    if(!data.monthlyData)data.monthlyData={};
    const CIERRE="2026-06"; // último mes del histórico fijo (inclusive)
    Object.keys(INITIAL.monthlyData).forEach(k=>{
      if(k<=CIERRE){
        // reponer/garantizar los aportes históricos de ese mes
        if(!data.monthlyData[k])data.monthlyData[k]={};
        if(!data.monthlyData[k].aportes)data.monthlyData[k].aportes={};
        const ini=INITIAL.monthlyData[k].aportes||{};
        Object.keys(ini).forEach(mid=>{
          if(ini[mid])data.monthlyData[k].aportes[mid]=true;
        });
      }
    });
  }
  // Vinculación automática del historial: para cada entrada de historial sin lid,
  // buscar su ayuda (loans o closedLoans) que coincida EXACTO en capital+mes+año y
  // asignarle el lid. Solo vincula cuando el emparejamiento es único (sin ambigüedad),
  // así el historial queda conectado a sus ayudas sin tocar importes ni borrar nada.
  if(data.members){
    data.members.forEach(m=>{
      if(!Array.isArray(m.history)||!m.history.length)return;
      const todas=[...(m.loans||[]),...(m.closedLoans||[])];
      m.history.forEach(h=>{
        if(h.lid)return;
        const matches=todas.filter(l=>l.capital===h.capital&&l.gMonth===h.gMonth&&l.gYear===h.gYear);
        if(matches.length===1) h.lid=matches[0].id;
      });
    });
  }
  parcheBonosReferidos2026(data); // v44.12: bonos de referido pendientes (una sola vez, idempotente)
  parcheBajasPagoOct2026(data);   // v44.13: bajas de Jorge y Yanessa se pagan en Oct 2026 con la reserva
  parcheJavierGarcia2026(data);   // v44.15: historial completo — ayuda cerrada de Javier Garcia (ene 2026)
  parcheJavierGarciaDuplicado2026(data); // v44.16: quita la copia de esa ayuda añadida a mano el 28/09
  parcheGrupoGabrielRefs2026(data);      // v44.16: quita 2 referencias a fichas que ya no existen
  parcheCondicionHistorica2026(data);    // v44.17: condición histórica de los 54 apoyos anteriores a ago-2026
  parcheApoyosAgosto2025(data);          // v44.17: los dos primeros apoyos (ago-2025) que faltaban
  parcheCuotasCobradas2026(data);
  parcheReferidosGabriel2026(data);
  parchePermanenciasOct2026(data);       // v45: Walter España (12) y Joaquín Matos (24) sin permanencia guardada
  parcheAvalesOct2026(data);             // v45.1: quién recomendó a cada asociado = su aval (Maestro GE-1)
  parcheCicloGloriaOct2026(data);        // v44.21: apoyo de Gloria (oct-2026) concedido con la permanencia ya a 24       // v44.19: bono de Joaquín duplicado en octubre → Andrea Rodríguez        // v44.17: cuotas antiguas = lo que realmente se cobró (actas originales)
  return data;
}

function esc(str){return String(str).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function escH(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// Registra el año actual del sistema en la lista de años (sin tocar el mes/año elegido)
function setCurrentMonthYear(persistir){
  if(!DATA)return;
  const now=new Date();
  const curY=now.getFullYear();
  if(YEARS.indexOf(curY)===-1)YEARS.push(curY);
  // Opción A: respetar el mes/año que el usuario dejó guardado.
  // Solo se fija el mes actual si por algún motivo no hubiera ninguno guardado.
  if(!DATA.reportMonth)DATA.reportMonth=MONTHS[now.getMonth()];
  if(!DATA.reportYear)DATA.reportYear=curY;
  // v44.12: excepción declarada — cambio automático de mes en el día de aviso.
  avanceMesPorDiaAviso(now,!!persistir);
}
// Mes "operativo" según la fecha de hoy: desde el día de aviso (Configuración →
// "Día de aviso del próximo aporte", por defecto 25) ya es el mes siguiente.
function mesOperativoHoy(now){
  now=now||new Date();
  const dia=(DATA.diaAvisoProximo!=null?DATA.diaAvisoProximo:25);
  let mi=now.getMonth(), y=now.getFullYear();
  if(now.getDate()>=dia){mi++; if(mi>11){mi=0;y++;}}
  return {mes:MONTHS[mi],anio:y,key:y+"-"+String(mi+1).padStart(2,"0")};
}
// Desde el día de aviso la app pasa sola al mes siguiente (lo mismo que hacía el
// administrador a mano), para que asociados y administrador vean ya los aportes y
// cuotas del mes que viene. Reglas:
//  · Solo avanza, nunca retrocede, y solo si el mes guardado es anterior al operativo.
//  · UNA vez por mes (marca DATA.mesAutoAplicado): si después el administrador vuelve
//    a un mes anterior a mano, se respeta su decisión hasta el siguiente día de aviso.
//  · Solo se guarda (persistir) en modo administrador y tras la comprobación con la
//    nube; en los enlaces de asociados se aplica solo en pantalla, sin escribir nada,
//    para que vean el mes nuevo aunque el administrador aún no haya abierto la app.
//  · Se llama desde la carga de datos, nunca desde render() (regla crítica 7).
function avanceMesPorDiaAviso(now,persistir){
  const obj=mesOperativoHoy(now);
  if(DATA.mesAutoAplicado===obj.key)return;
  const repKey=getMesKey(DATA.reportMonth,DATA.reportYear);
  if(repKey<obj.key){
    DATA.reportMonth=obj.mes; DATA.reportYear=obj.anio;
    if(YEARS.indexOf(obj.anio)===-1)YEARS.push(obj.anio);
  }
  if(persistir&&!READONLY_ID&&!ES_MODO_GRUPO){
    DATA.mesAutoAplicado=obj.key;
    save();
  }
}
// ¿Mostrar ya el mes siguiente al del reporte (aviso "Próximo", cascada de cuotas)?
// Solo si hoy es día de aviso o posterior Y el reporte sigue en un mes anterior al
// operativo. Si la app ya pasó al mes siguiente, no se adelanta un segundo mes.
function avisoSiguienteActivo(){
  const hoy=new Date();
  const dia=(DATA.diaAvisoProximo!=null?DATA.diaAvisoProximo:25);
  if(hoy.getDate()<dia)return false;
  return getMesKey(DATA.reportMonth,DATA.reportYear)<mesOperativoHoy(hoy).key;
}

// Devuelve la cuota "activa" de una ayuda en el mes-año dado.
// Lógica:
//  1) Si hay alguna cuota anterior al mes actual sin pagar (atraso), devolver la más antigua.
//  2) Si no hay atrasos y la cuota del mes actual existe y no está pagada, devolverla.
//  3) Si no hay atrasos y la cuota del mes actual está pagada (o no existe),
//     devolver la siguiente cuota futura no pagada (cascada).
function activePayIndex(loan,rm,ry){
  const ri=MONTHS.indexOf(rm);
  // 1) Buscar atraso más antiguo (cuotas estrictamente anteriores al mes actual)
  for(let i=0;i<loan.pays.length;i++){
    const p=loan.pays[i];
    if(p.paid)continue;
    const pi=MONTHS.indexOf(p.m);
    const isBefore=(p.y<ry)||(p.y===ry&&pi<ri);
    if(isBefore)return i;
  }
  // 2) ¿Hay cuota del mes actual sin pagar?
  for(let i=0;i<loan.pays.length;i++){
    const p=loan.pays[i];
    if(p.m===rm&&p.y===ry&&!p.paid)return i;
  }
  // 3) Cascada: primera cuota futura sin pagar — SOLO a partir del día de aviso
  // (si no, una cuota de un mes que aún no ha llegado se vería "POR PAGAR").
  if(avisoSiguienteActivo()){
    for(let i=0;i<loan.pays.length;i++){
      if(!loan.pays[i].paid)return i;
    }
  }
  return -1;
}

// Construye el orden de la lista única en pantalla principal:
// 1) Asociados con ayudas activas (con sus terceros referidos justo debajo)
// 2) Asociados sin ayudas activas (con sus terceros referidos justo debajo)
// 3) Terceros huérfanos (sin asociado avalista que coincida) al final
function buildOrderedMembers(){
  const asoc=DATA.members.filter(m=>m.type==="asociado");
  const terc=DATA.members.filter(m=>m.type==="tercero");
  // Clave de fecha de ingreso (año*100+mes) para ordenar cronológicamente
  const ingresoKey=m=>{
    const mi=MONTHS.indexOf(m.joinMonth);
    return (m.joinYear||9999)*100+(mi>=0?mi:99);
  };
  // Asociados por orden de ingreso a la asociación (más antiguos primero)
  const asocOrdenados=[...asoc].sort((a,b)=>ingresoKey(a)-ingresoKey(b));
  // Terceros al final, ordenados por nº de ayudas activas (más ayudas primero)
  const ayudasActivas=m=>m.loans.filter(l=>l.pays.some(p=>!p.paid)).length;
  const tercOrdenados=[...terc].sort((a,b)=>ayudasActivas(b)-ayudasActivas(a));
  return [...asocOrdenados,...tercOrdenados];
}

// Fusiona un tercero existente en un asociado nuevo cuando comparten nombre.
// Mantiene historial, ayudas activas y aportes; convierte el tipo a asociado.
function mergeTerceroIntoAsociado(name,joinMonth,joinYear){
  const key=_normNombre(name); // mismo criterio que el detector y la auditoría (control 7)
  const tercero=DATA.members.find(m=>m.type==="tercero"&&_normNombre(m.name)===key);
  if(!tercero)return false;
  // Antes de perder el ref: congelar en cada ayuda a nombre de quién estaba avalada,
  // para conservar esa constancia. Solo se rellena si falta; nunca se pisa una condición
  // histórica ya registrada (mismo criterio "texto congelado" que addLoanSubmit).
  const avalNombre=avalistaNombre(tercero);
  if(avalNombre&&avalNombre!=="⚠️ avalista no encontrado"){
    [...(tercero.loans||[]),...(tercero.closedLoans||[])].forEach(l=>{
      if(l.tipoEnConcesion===undefined)l.tipoEnConcesion="tercero";
      if(l.avalistaEnConcesion===undefined||l.avalistaEnConcesion===null)l.avalistaEnConcesion=avalNombre;
    });
  }
  tercero.type="asociado";
  tercero.convertido=true;   // marca deliberada: sanitizeData respeta esta conversión y no la revierte con INITIAL
  tercero.ref=null;
  tercero.joinMonth=joinMonth||DATA.reportMonth;
  tercero.joinYear=joinYear||DATA.reportYear;
  if(!tercero.history)tercero.history=[];
  if(!tercero.phone)tercero.phone="";
  return true;
}

// Resuelve el nombre del avalista de un tercero a partir de su avalistaId (m.ref).
// Busca en TODOS los miembros (no solo activos) para no romper apoyos vivos cuyo
// avalista ya no esté activo. Si el id no resuelve, avisa en vez de romper el render.
function avalistaNombre(m){
  if(!m||!m.ref)return null;
  const a=DATA.members.find(x=>x.id===m.ref);
  return a?a.name:"⚠️ avalista no encontrado";
}


function memberMonths(m){
  if(!m.joinMonth||!m.joinYear)return 0;
  const ji=MONTHS.indexOf(m.joinMonth),jy=m.joinYear;
  const ri=MONTHS.indexOf(DATA.reportMonth),ry=DATA.reportYear;
  return (ry-jy)*12+(ri-ji)+1;
}
// Nº de cuotas mensuales REALMENTE marcadas como pagadas (aportes[id]===true),
// no meses de permanencia transcurridos.
function aportesPagadosCount(m){
  if(!DATA.monthlyData)return 0;
  let n=0;
  Object.values(DATA.monthlyData).forEach(md=>{ if(md.aportes&&md.aportes[m.id]===true)n++; });
  return n;
}
function memberTotalAportes(m){
  if(!m.joinMonth)return 0;
  return totalAportadoMiembro(m);
}
// v45 (Maestro v18.2 · AP-1..AP-4): cada mes el asociado pone 50, 100, 150 o 200 €.
// m.aporte = APORTE HABITUAL (lo que suele poner; la hoja de cobro lo propone).
// DATA.extras[id][mes].monto = AJUSTE de ese mes respecto al habitual (puede ser negativo:
// habitual 100 que un mes pone 50 → −50). Aporte del mes = habitual + ajuste.
const APORTE_OPCIONES=[50,100,150,200];
function aporteBaseDe(m){ return (m&&m.aporte)||DATA.monthlyFee; }
function ajusteAporteKey(m,key){ const e=DATA.extras&&DATA.extras[m.id]&&DATA.extras[m.id][key]; return (e&&e.monto)||0; }
function aporteBrutoKey(m,key){ return Math.max(0,aporteBaseDe(m)+ajusteAporteKey(m,key)); }
function aporteBrutoMes(m,rm,ry){ return aporteBrutoKey(m,getMesKey(rm,ry)); }
// Total aportado = suma del aporte de cada mes PAGADO (se devuelve al terminar o salir · AP-5)
function totalAportadoMiembro(m){
  if(!DATA.monthlyData)return 0;
  let t=0;
  Object.keys(DATA.monthlyData).forEach(k=>{ const md=DATA.monthlyData[k]; if(md&&md.aportes&&md.aportes[m.id]===true)t+=aporteBrutoKey(m,k); });
  return t;
}
// Elegir el aporte de un mes (cierre, cierre grupal o ficha). Solo 50/100/150/200 (AP-2, AP-3).
function setAporteMes(mid,monto,key){
  const m=DATA.members.find(x=>x.id===mid); if(!m)return;
  monto=parseInt(monto)||0;
  if(!APORTE_OPCIONES.includes(monto)){toast("El aporte debe ser 50, 100, 150 o 200 €");render();return;}
  key=key||getMesKey(DATA.reportMonth,DATA.reportYear);
  if(!DATA.extras)DATA.extras={};
  if(!DATA.extras[mid])DATA.extras[mid]={};
  DATA.extras[mid][key]={monto:monto-aporteBaseDe(m)}; // 0 = el habitual
  save();render();
  toast(m.name.split(" ")[0]+": aporte de "+monto+" € ✓");
}
// Selector compacto de aporte (50–200). En solo lectura muestra el importe.
function selectorAporteHTML(m,key,ro){
  const v=aporteBrutoKey(m,key);
  if(ro)return `${v} €`;
  const ops=APORTE_OPCIONES.slice(); if(!ops.includes(v))ops.push(v);
  return `<select class="ap-sel" aria-label="Aporte del mes" onclick="event.stopPropagation()" onchange="setAporteMes('${esc(m.id)}',this.value,'${key}')">${ops.map(o=>`<option value="${o}"${o===v?" selected":""}>${o} €</option>`).join("")}</select>`;
}
function memberHistoryCount(m){return (m.history||[]).length;}
function memberHistoryTotal(m){return (m.history||[]).reduce((s,h)=>s+h.capital,0);}
