<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Nuevos Horizontes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NH Reportes">
<meta name="theme-color" content="#1B4332">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxODAgMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMUI0MzMyIi8+PHRleHQgeD0iOTAiIHk9IjcwIiBmb250LXNpemU9IjUwIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9InN5c3RlbS11aSI+8J+PpjwvdGV4dD48dGV4dCB4PSI5MCIgeT0iMTI1IiBmb250LXNpemU9IjI0IiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjgwMCIgZm9udC1mYW1pbHk9InN5c3RlbS11aSI+Tkg8L3RleHQ+PC9zdmc+">
<style>
:root{--bg:#F5F0EB;--card:#fff;--accent:#2D6A4F;--dark:#1B4332;--warm:#E07A3A;--warm-lt:#FFF0E6;--text:#2C2C2C;--muted:#7A7A7A;--border:#E8E0D8;--paid:#2D6A4F;--paid-bg:#D8F3DC;--terc:#5B5EA6;--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);max-width:500px;margin:0 auto;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none}
input,select,textarea{font-family:inherit;-webkit-appearance:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 28px;border-radius:30px;font-size:15px;font-weight:600;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.3);white-space:nowrap;transition:opacity .3s;pointer-events:none}
.toast.hidden{opacity:0}
.header{background:linear-gradient(135deg,#1B4332,#2D6A4F);padding:22px 20px 16px;border-radius:0 0 24px 24px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06)}
.h-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px}
.h-sub{font-size:12px;color:rgba(255,255,255,.6);margin-bottom:12px}
.h-date-row{display:flex;align-items:center;justify-content:center;gap:6px}
.h-date-sel{background:rgba(255,255,255,.18) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 9px center;border:none;border-radius:10px;color:#fff;font-weight:700;font-size:15px;padding:7px 26px 7px 12px;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.h-date-sel option{background:#1B4332;color:#fff}
.tabs{display:flex;gap:5px;padding:14px 16px 6px}
.tab{flex:1;padding:11px 0;border:none;border-radius:12px;font-size:13px;font-weight:700;background:#fff;color:#7A7A7A;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .2s}
.tab.active{background:var(--dark);color:#fff;box-shadow:0 2px 8px rgba(27,67,50,.3)}
.content{padding:8px 16px 30px}
.legend{display:flex;gap:14px;justify-content:center;margin-bottom:14px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.grand{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:18px;padding:20px;text-align:center;margin-bottom:20px}
.grand-label{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.grand-val{font-size:32px;font-weight:800;color:#fff;margin:4px 0}
.grand-sub{display:flex;justify-content:center;gap:8px;font-size:14px;color:rgba(255,255,255,.7)}
.rep-filtros{display:flex;gap:8px;margin:14px 0 16px}
.rep-filtro{flex:1;padding:12px 8px;border-radius:12px;border:1.5px solid #D9CFC0;background:#fff;color:#6B5D4A;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.rep-filtro.on{background:#2D6A4F;border-color:#2D6A4F;color:#fff}
.rep-filtro{display:flex;flex-direction:column;align-items:center;gap:4px}
.filtro-num{display:inline-block;min-width:26px;padding:1px 8px;border-radius:20px;font-size:15px;font-weight:800;background:#EFE9DF;color:#2D6A4F}
.rep-filtro.on .filtro-num{background:rgba(255,255,255,.22);color:#fff}
.grand-sub b{font-weight:700;color:#fff}
.grand-breakdown{margin-top:10px;text-align:left}
.gb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;font-size:14px;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.12)}
.gb-row b{color:#fff;font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.rec-fila{padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
.rec-l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rec-l1 .rec-lbl{font-size:14px;color:rgba(255,255,255,.85)}
.rec-l1 .rec-imp{font-weight:800;color:#fff;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-l2{text-align:right;margin-top:3px}
.chip-falta{display:inline-block;background:rgba(255,180,70,.18);color:#FFC98B;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip-ok{display:inline-block;background:rgba(149,213,178,.2);color:#95D5B2;font-size:12px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.rec-sub{background:rgba(255,255,255,.06);border-radius:8px;padding:8px;border-bottom:none;margin-top:2px}
.rec-sub .rec-lbl{font-weight:700}
.toggle-asoc{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:13px 16px;font-size:15px;font-weight:700;color:#1B4332;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:16px}
.toggle-asoc .ta-num{background:#2D6A4F;color:#fff;border-radius:20px;padding:2px 10px;font-size:13px;margin-left:6px}
.toggle-asoc .ta-flecha{color:var(--muted);font-size:13px;font-weight:600}
.gb-row.gb-total{border-bottom:none;border-top:1.5px solid rgba(255,255,255,.3);margin-top:4px;padding-top:9px;font-size:15px;font-weight:700;color:#fff}
.gb-row.gb-total b{font-size:18px}
.sec-title{font-size:18px;font-weight:700;color:var(--dark);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.mg-acc-head{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--border);border-left:4px solid #2D6A4F;border-radius:12px;padding:14px 16px;margin:14px 0 6px;font-size:16px;font-weight:700;color:var(--dark);cursor:pointer}
.mg-acc-head.terc{border-left-color:#E07A3A}
.mg-acc-num{background:#2D6A4F;color:#fff;border-radius:20px;padding:2px 10px;font-size:13px;margin-left:6px}
.mg-acc-head.terc .mg-acc-num{background:#E07A3A}
.mg-acc-fl{font-size:13px;font-weight:600;color:var(--muted)}
.sec-title.terc{color:var(--terc)}
.card{background:#fff;border-radius:18px;margin-bottom:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--border)}
.card.terc{border-color:#D5D6E8}
.card-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-name{font-weight:700;font-size:18px;color:var(--dark)}
.card.terc .card-name{color:var(--terc)}
.card-ref{font-size:13px;color:var(--muted);margin-top:1px}
.share-btn{background:#25D366;border:none;border-radius:12px;padding:10px 14px;font-size:18px}
.loan{padding:14px 16px}
.loan+.loan{border-top:1px dashed var(--border)}
.loan-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.loan-lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.loan-amt{font-weight:700;font-size:17px;color:var(--text);margin-top:2px}
.loan-det{font-size:14px;color:var(--muted);margin-top:1px}
.loan-pend{text-align:right}
.loan-pend-lbl{font-size:12px;font-weight:600;color:var(--muted)}
.loan-pend-val{font-weight:700;font-size:17px;color:var(--warm)}
.timeline{display:flex;gap:5px}
.cuota{flex:1;border-radius:10px;padding:8px 4px;text-align:center;min-width:0;border:none}
.cuota-paid{background:var(--paid-bg);outline:2px solid var(--paid)}
.cuota-due{background:var(--warm-lt);outline:2.5px solid var(--warm);box-shadow:0 0 0 3px rgba(224,122,58,.15)}
.cuota-future{background:#F5F5F5;outline:2px solid #DEDEDE}
.cuota-month{font-size:12px;font-weight:600;text-transform:uppercase}
.cuota-val{font-size:15px;font-weight:700;margin-top:2px}
.cuota-status{font-size:11px;font-weight:700;margin-top:3px}
.cuota-paid .cuota-month,.cuota-paid .cuota-val{color:var(--paid)}
.cuota-paid .cuota-status{color:var(--dark)}
.cuota-due .cuota-month,.cuota-due .cuota-val,.cuota-due .cuota-status{color:var(--warm)}
.cuota-future .cuota-month,.cuota-future .cuota-val,.cuota-future .cuota-status{color:#AAA}
.total-ban{background:var(--warm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.total-ban-lbl{font-size:14px;color:rgba(255,255,255,.9);font-weight:600}
.total-ban-val{font-size:24px;font-weight:800;color:#fff}
.note{text-align:center;font-size:13px;color:var(--muted);padding:10px 12px;background:#fff;border-radius:12px;border:1px solid var(--border)}
.note b{color:var(--dark)}
.btn-pdf{width:100%;padding:16px;border:none;border-radius:14px;background:#25D366;color:#fff;font-size:16px;font-weight:700;margin-top:16px}
.btn-pdf:disabled{opacity:.6}
.btn-pdf-note{text-align:center;font-size:12px;color:#999;margin:6px 0 0}
.btn-txt{width:100%;padding:16px;border:none;border-radius:14px;background:var(--dark);color:#fff;font-size:15px;font-weight:700;margin-top:10px}
.add-btn{width:100%;padding:14px;border:2px dashed var(--accent);border-radius:14px;background:transparent;color:var(--accent);font-size:15px;font-weight:700;margin-bottom:12px}
.add-btn.terc{border-color:var(--terc);color:var(--terc)}
.mg-card{background:#fff;border-radius:16px;margin-bottom:12px;padding:16px;border:1px solid var(--border)}
.mg-loan{background:#F9F9F7;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #EEEBE6}
.del-btn{background:#FEE2E2;border:none;border-radius:10px;padding:8px 12px;color:#DC2626;font-size:14px;font-weight:600;cursor:pointer}
.del-btn.armed{background:#DC2626;color:#fff;font-size:12px;animation:pulseDel .8s infinite}
@keyframes pulseDel{0%,100%{opacity:1}50%{opacity:.6}}
.edit-btn{background:#E7F0EA;border:none;border-radius:10px;padding:8px 12px;color:#1B4332;font-size:14px;font-weight:600;cursor:pointer}
.add-loan-btn{width:100%;padding:10px;border:1px dashed #ccc;border-radius:10px;background:transparent;color:var(--muted);font-size:13px;margin-top:4px}
.reset-btn{width:100%;padding:14px;border:2px solid #DC2626;border-radius:14px;background:transparent;color:#DC2626;font-size:15px;font-weight:700;margin-top:8px}
/* ── PESTAÑA MES ── */
.mes-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.mes-title{font-size:15px;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.mes-kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mes-kpi{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
.mes-kpi-val{font-size:22px;font-weight:800;color:var(--dark)}
.mes-kpi-lbl{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.mes-kpi.green .mes-kpi-val{color:#2D6A4F}
.mes-kpi.orange .mes-kpi-val{color:var(--warm)}
.mes-kpi.blue .mes-kpi-val{color:#5B5EA6}
.aporte-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0EBE4}
.aporte-row:last-child{border-bottom:none}
.aporte-name{font-size:14px;font-weight:600;color:var(--text)}
.aporte-meta{font-size:11px;color:var(--muted)}
.aporte-toggle{display:flex;align-items:center;gap:8px}
.toggle-btn{width:44px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle-btn.on{background:var(--accent)}
.toggle-btn.off{background:#D0D0D0}
.toggle-btn::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-btn.on::after{transform:translateX(18px)}
.aporte-amt{font-size:14px;font-weight:700;color:var(--dark);min-width:42px;text-align:right}
.reserva-bar-bg{background:#E8E8E8;border-radius:8px;height:10px;overflow:hidden;margin:8px 0}
.reserva-bar-fill{background:linear-gradient(90deg,#2D6A4F,#52B788);height:100%;border-radius:8px;transition:width .5s}
/* ── FICHA DETALLE ASOCIADO ── */
.member-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.mstat{background:var(--bg);border-radius:10px;padding:10px 8px;text-align:center}
.mstat-val{font-size:17px;font-weight:800;color:var(--dark)}
.mstat-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:1px}
.nivel-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#D8F3DC;color:#1B4332}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:998;display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:4px;margin:0 auto 20px}
.modal-title{font-size:19px;font-weight:700;margin-bottom:20px;color:var(--dark)}
.m-input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--border);font-size:16px;margin-bottom:12px;outline:none;box-sizing:border-box}
.m-select{width:100%;padding:12px;border-radius:12px;border:2px solid var(--border);font-size:15px;outline:none}
.m-label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.m-opt{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:700}
.m-opt.active{background:var(--dark);color:#fff}
.m-opt:not(.active){background:#F5F5F5;color:#777}
.m-primary{width:100%;padding:16px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.m-summary{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:16px}
.send-header{background:linear-gradient(135deg,#1a472a,#25855a);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.send-header-left .send-title{font-size:16px;font-weight:800;color:#fff}
.send-header-left .send-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
.send-counter{background:rgba(255,255,255,.2);border-radius:20px;padding:6px 14px;color:#fff;font-weight:700;font-size:14px}
.send-controls{display:flex;gap:8px;margin-bottom:10px}
.send-ctrl-btn{flex:1;padding:11px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}
.select-all-btn{background:var(--dark);color:#fff}
.select-none-btn{background:#fff;color:var(--dark);border:2px solid var(--dark)}
.send-filter{display:flex;gap:6px;margin-bottom:10px}
.send-filter-btn{flex:1;padding:9px 6px;border:2px solid transparent;border-radius:10px;font-size:12px;font-weight:700;background:#fff;color:#999;transition:all .15s}
.send-filter-btn.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.send-filter-btn.terc-on{background:var(--terc);color:#fff;border-color:var(--terc)}
.send-search{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--border);font-size:15px;outline:none;margin-bottom:10px;box-sizing:border-box;background:#fff}
.send-search:focus{border-color:var(--accent)}
.send-card{background:#fff;border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);border:2px solid transparent;transition:all .2s}
.send-card.selected{border-color:var(--accent);background:#F0FBF4}
.send-card.terc-selected{border-color:var(--terc);background:#F3F3FB}
.send-card.no-cuota-this-month{opacity:.7}
.send-card-head{padding:14px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.send-card-info{flex:1;min-width:0}
.send-card-check{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;border:2px solid #ddd;background:#fff;font-size:14px;flex-shrink:0;transition:all .15s;margin-top:2px}
.send-card.selected .send-card-check{background:var(--accent);border-color:var(--accent);color:#fff}
.send-card.terc-selected .send-card-check{background:var(--terc);border-color:var(--terc);color:#fff}
.send-card-name{font-weight:700;font-size:16px;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send-card.terc-selected .send-card-name{color:var(--terc)}
.send-card-meta{font-size:12px;color:var(--muted);margin-top:2px}
.send-amt-wrap{text-align:right;flex-shrink:0}
.send-amt-this{font-size:18px;font-weight:800;color:var(--warm)}
.send-amt-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.send-amt-none{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.5px}
.send-amt-future{font-size:11px;color:var(--muted);margin-top:2px}
.send-card-bottom{padding:0 14px 12px;display:flex;gap:6px}
.copy-btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:700;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.copy-btn:active{transform:scale(.97)}
.copy-btn.copied{background:var(--accent)}
.copy-btn.terc-type{background:var(--terc)}
.copy-btn.terc-type.copied{background:#3D4080}
.preview-btn{padding:8px 14px;border:2px solid var(--accent);border-radius:10px;background:#fff;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
.send-section-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;padding:0 2px}
.send-batch-bar{position:sticky;bottom:16px;z-index:10;margin-top:10px}
.send-batch-btn{width:100%;padding:17px;border:none;border-radius:16px;background:var(--wa);color:#fff;font-size:16px;font-weight:700;box-shadow:0 4px 20px rgba(37,211,102,.4);display:flex;align-items:center;justify-content:center;gap:8px}
.send-batch-btn:disabled{opacity:.5;box-shadow:none}
.send-group-btn{width:100%;padding:14px;border:none;border-radius:16px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.send-batch-info{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.preview-text{background:#F5F0EB;border-radius:12px;padding:14px;font-size:13px;font-family:monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;border:1px solid var(--border);color:#333;margin-bottom:16px}
.copy-full-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--wa);color:#fff;font-size:15px;font-weight:700}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-text{font-size:15px;font-weight:600}
.empty-sub{font-size:13px;margin-top:6px}
.resumen-final{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:18px;padding:18px;margin-top:16px}
.rf-title{font-size:14px;font-weight:800;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.rf-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:rgba(255,255,255,.8)}
.rf-val{font-weight:700;color:#fff}
.rf-pend{color:#FFB347}
.rf-sec{font-size:11px;font-weight:800;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1.2px;margin:12px 0 6px}
.rf-neto{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#fff;font-size:15px;margin-bottom:8px}
.rf-neto b{font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.v-pos{color:#95D5B2}
.v-neg{color:#FFAA92}
.v-res{color:#C5C6F5}
.rf-divider{height:1px;background:rgba(255,255,255,.15);margin:10px 0}
.rf-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:2px solid rgba(255,255,255,.25);font-size:18px;font-weight:800;color:#fff}
.img-btn{flex:1;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:700;background:#FF6B35;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s}
.img-btn:active{transform:scale(.97)}
.img-btn:disabled{opacity:.5}
.link-btn{padding:10px 12px;border:2px solid var(--accent);border-radius:10px;background:#fff;color:var(--accent);font-size:13px;font-weight:700;white-space:nowrap}
.link-btn.terc-type{border-color:var(--terc);color:var(--terc)}
.readonly-banner{background:linear-gradient(135deg,#5B5EA6,#3D4080);padding:16px 20px;text-align:center}
.link-modal-url{background:#F5F0EB;border-radius:12px;padding:14px;font-size:13px;font-family:monospace;word-break:break-all;border:1px solid var(--border);color:#333;margin-bottom:14px;line-height:1.5}
.link-copy-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--dark);color:#fff;font-size:15px;font-weight:700;margin-bottom:10px}
.link-wa-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--wa);color:#fff;font-size:15px;font-weight:700}
.cfg-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.cfg-row:last-child{border-bottom:none}
.cfg-label{font-size:15px;font-weight:600;color:var(--dark)}
.cfg-sub{font-size:12px;color:var(--muted);margin-top:2px}
.cfg-input{width:90px;padding:8px 10px;border-radius:10px;border:2px solid var(--border);font-size:15px;font-weight:700;text-align:center;outline:none}
.cfg-input:focus{border-color:var(--accent)}
.backup-btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:700;margin-bottom:10px}
.backup-export{background:var(--dark);color:#fff}
.backup-import{background:#fff;color:var(--dark);border:2px solid var(--dark)}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.sync-ok{background:#25D366}
.sync-err{background:#E07A3A}
.sync-ing{background:#FFD600;animation:pulse .8s infinite alternate;will-change:opacity}
@keyframes pulse{from{opacity:1}to{opacity:.3}}

.hist-badge{position:absolute;top:14px;right:14px;background:var(--accent);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.hist-badge .hist-num{font-size:16px;font-weight:900}
.member-info{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.member-info span{display:flex;align-items:center;gap:3px}
.card-head{position:relative}
.hist-modal-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.hist-modal-item:last-child{border-bottom:none}
.hist-modal-date{font-size:14px;font-weight:600;color:var(--dark)}
.hist-modal-amt{font-size:16px;font-weight:700;color:var(--accent)}
.hist-total{background:var(--bg);border-radius:12px;padding:14px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.hist-total-lbl{font-size:14px;font-weight:600;color:var(--muted)}
.hist-total-val{font-size:20px;font-weight:800;color:var(--dark)}
.app-version{position:fixed;bottom:6px;right:8px;font-size:10px;color:var(--muted);opacity:.5;z-index:100;pointer-events:none;font-weight:600}
.app-version-ok{position:fixed;bottom:6px;right:62px;font-size:10px;color:#2D6A4F;opacity:.75;z-index:100;pointer-events:none;font-weight:700}
.update-banner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#E07A3A,#D96926);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.2);z-index:9998;transform:translateY(100%);transition:transform .3s ease-out;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.update-banner.show{transform:translateY(0)}
.update-banner-text{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.update-banner-text small{display:block;font-size:11px;opacity:.85;font-weight:500;margin-top:2px}
.update-banner-btn{background:#fff;color:#D96926;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
.update-banner-close{background:rgba(255,255,255,.2);border:none;border-radius:8px;color:#fff;width:32px;height:32px;font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0}

/* ── PESTAÑA ASOCIADOS ── */
.asoc-list-item{background:#fff;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
.asoc-list-btn{width:100%;padding:14px 16px;border:none;background:transparent;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.asoc-list-name{font-size:16px;font-weight:700;color:var(--dark)}
.asoc-list-meta{font-size:12px;color:var(--muted);margin-top:2px}
.asoc-list-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.asoc-chevron{font-size:18px;color:var(--muted)}
.asoc-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge-nivel{background:#D8F3DC;color:#1B4332}
.badge-deuda{background:#FFF0E6;color:#C75B0E}
.badge-ok{background:#D8F3DC;color:#1B4332}

/* ── FICHA COMPLETA ASOCIADO ── */
.ficha-header{background:linear-gradient(135deg,#1B4332,#2D6A4F);padding:20px 16px 16px;border-radius:0 0 24px 24px;margin-bottom:16px}
.ficha-name{font-size:22px;font-weight:800;color:#fff}
.ficha-sub{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
.ficha-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.ficha-stat{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 8px;text-align:center}
.ficha-stat-val{font-size:18px;font-weight:800;color:#fff}
.ficha-stat-lbl{font-size:10px;color:rgba(255,255,255,.65);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

.ficha-section{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.ficha-sec-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #F0EBE4;padding-bottom:10px}
.ficha-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #F9F5F1}
.ficha-row:last-child{border-bottom:none}
.ficha-row-lbl{font-size:13px;color:var(--muted);font-weight:600}
.ficha-row-val{font-size:14px;font-weight:700;color:var(--dark)}
.ficha-row-val.green{color:#2D6A4F}
.ficha-row-val.orange{color:var(--warm)}
.ficha-row-val.purple{color:#5B5EA6}
.ficha-row-val.red{color:#DC2626}

/* Desglose mensual */
.desglose-card{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:16px;padding:16px;margin-bottom:12px}
.desglose-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.desglose-total{font-size:32px;font-weight:900;color:#fff;margin-bottom:12px}
.desglose-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.desglose-line:last-child{border-bottom:none}
.desglose-line-lbl{font-size:13px;color:rgba(255,255,255,.8)}
.desglose-line-val{font-size:14px;font-weight:700;color:#fff}
.desglose-line-val.desc{color:#52B788}
.desglose-line-val.red{color:#FF6B6B}

/* Timeline cuotas */
.cuota-hist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cuota-hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;font-size:13px}
.cuota-hist-row.paid{background:#D8F3DC}
.cuota-hist-row.due{background:#FFF0E6;outline:2px solid var(--warm)}
.cuota-hist-row.future{background:#F5F5F5}
.cuota-hist-mes{font-weight:700}
.cuota-hist-mes.paid{color:#1B4332}
.cuota-hist-mes.due{color:var(--warm)}
.cuota-hist-mes.future{color:#AAA}
.cuota-hist-right{display:flex;align-items:center;gap:8px}
.cuota-hist-val{font-weight:700}

/* Historial beneficios mes a mes */
.ben-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0EBE4;font-size:13px}
.ben-row:last-child{border-bottom:none}

/* Botón volver */
.btn-back{display:flex;align-items:center;gap:8px;padding:10px 16px;border:none;background:transparent;color:var(--dark);font-size:15px;font-weight:700;cursor:pointer;width:100%}
.btn-back:active{opacity:.7}

/* Gestión rápida en ficha */
.mgmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.mgmt-btn{padding:11px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.mgmt-btn.primary{background:var(--accent);color:#fff}
.mgmt-btn.secondary{background:#F0EBE4;color:var(--dark)}
.mgmt-btn.warn{background:#FFF0E6;color:#C75B0E}
.mgmt-btn.purple{background:#EEEDF8;color:#5B5EA6}


/* ── DESPLEGABLES ── */
.desplegable-btn{width:100%;padding:11px 14px;border:2px solid var(--border);background:var(--bg);border-radius:12px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--dark);margin-bottom:4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.desplegable-btn:active{opacity:.8;transform:scale(.99)}
.desplegable-btn.open{background:#fff;border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.desplegable-arrow{font-size:20px;color:var(--accent);font-weight:900;transition:transform .2s;min-width:24px;text-align:center}
.desplegable-arrow.open{transform:rotate(90deg)}
.desplegable-body{background:#fff;border:2px solid var(--accent);border-top:none;border-radius:0 0 12px 12px;padding:0 12px;margin-bottom:4px}
.desp-hint{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}


/* ── FICHA v21 ── */
.ficha-id-card{background:#fff;border-radius:20px;padding:18px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,.07)}
.ficha-id-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ficha-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#1B4332,#52B788);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;flex-shrink:0}
.ficha-id-name{font-size:20px;font-weight:800;color:var(--dark);line-height:1.2}
.ficha-id-sub{font-size:12px;color:var(--muted);margin-top:3px}
.ficha-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.pill-green{background:#D8F3DC;color:#1B4332}
.pill-orange{background:#FFF0E6;color:#C75B0E}
.pill-blue{background:#EEEDF8;color:#5B5EA6}
.pill-grey{background:#F0F0F0;color:#666}
.ficha-kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fkpi{background:var(--bg);border-radius:12px;padding:10px 8px;text-align:center}
.fkpi-v{font-size:18px;font-weight:800;color:var(--dark)}
.fkpi-l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* Bloque beneficios/aportes */
.ben-bloque{background:#fff;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden}
.ben-bloque-header{padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.ben-bloque-header:active{background:var(--bg)}
.ben-bloque-title{font-size:15px;font-weight:700;color:var(--dark)}
.ben-bloque-val{font-size:15px;font-weight:800}
.ben-bloque-arrow{font-size:20px;font-weight:900;color:var(--accent);transition:transform .2s}
.ben-bloque-arrow.open{transform:rotate(90deg)}
.ben-bloque-body{border-top:1px solid var(--border);padding:0 16px}
.ben-sub-header{padding:12px 0 8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px dashed #EEE}
.ben-sub-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ben-sub-arrow{font-size:16px;color:var(--muted);transition:transform .2s}
.ben-sub-arrow.open{transform:rotate(90deg)}
.ben-sub-body{padding-bottom:8px}
.ben-nota-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);cursor:pointer;margin:8px 0 4px}
.ben-nota-box{background:#FFF8F0;border:1px solid #F5D5B0;border-radius:12px;padding:12px 14px;font-size:13px;color:#5A3A1A;line-height:1.6;margin-bottom:10px}
.resumen-total-card{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:14px;padding:16px;margin:4px 0 8px}
.rt-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.rt-row:last-child{border-bottom:none;margin-top:6px;padding-top:10px}
.rt-lbl{font-size:13px;color:rgba(255,255,255,.75)}
.rt-val{font-size:15px;font-weight:700;color:#fff}
.rt-total-lbl{font-size:14px;font-weight:800;color:#fff}
.rt-total-val{font-size:22px;font-weight:900;color:#fff}


/* ══ FICHA v22 ══════════════════════════════════════════════════════════ */

/* Tarjeta identidad */
.fid-card{background:#fff;border-radius:20px;padding:18px 16px 14px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.fid-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.fid-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1B4332,#52B788);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.fid-name{font-size:23px;font-weight:800;color:var(--dark);line-height:1.2}
.fid-since{font-size:14px;color:var(--muted);margin-top:4px;font-weight:500}
.fid-pills{display:flex;flex-wrap:wrap;gap:6px}
.fpill{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.2px}
.fpill-g{background:#D8F3DC;color:#1B4332}
.fpill-o{background:#FFF0E6;color:#C75B0E}
.fpill-b{background:#EEEDF8;color:#5B5EA6}
.fpill-d{background:#F0F0F0;color:#555}

/* Desglose del mes */
.desg-card{background:linear-gradient(135deg,#1B4332,#2D6A4F);border-radius:18px;padding:16px;margin-bottom:12px}
.desg-titulo{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.desg-fila{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.desg-fila:last-of-type{border-bottom:none}
.desg-lbl{font-size:13px;color:rgba(255,255,255,.8);font-weight:500}
.desg-val{font-size:14px;font-weight:700;color:#fff}
.desg-val.ok{color:#52B788}
.desg-val.pend{color:#FFB347}
.desg-val.desc{color:#52B788}
.desg-separador{border-top:2px solid rgba(255,255,255,.25);margin:10px 0 12px}
.desg-total-fila{display:flex;justify-content:space-between;align-items:center}
.desg-total-lbl{font-size:14px;font-weight:800;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:.5px}
.desg-total-val{font-size:30px;font-weight:900;color:#fff}
.tot-final{margin-top:2px}
.tot-final-lbl{font-size:13px;font-weight:800;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.tot-final-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tot-final-num{font-size:34px;font-weight:900;color:#fff;line-height:1}
.tot-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(140,224,176,.18);border:1px solid rgba(140,224,176,.5);color:#8CE0B0;font-weight:800;font-size:17px;padding:9px 17px;border-radius:999px;white-space:nowrap}
.tot-chip.pend{background:rgba(224,122,58,.2);border-color:rgba(224,122,58,.55);color:#F5B989}

/* Acordeón principal */
.acord{background:#fff;border-radius:16px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.acord-btn{width:100%;padding:15px 16px;border:none;background:transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
.acord-btn:active{background:#F9F5F1}
.acord-left{display:flex;align-items:center;gap:10px}
.acord-icon{font-size:20px;line-height:1}
.acord-titulo{font-size:15px;font-weight:700;color:var(--dark)}
.acord-sub{font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.acord-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.acord-val{font-size:15px;font-weight:800;color:#2D6A4F}
.acord-arrow{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--accent);transition:transform .2s;flex-shrink:0}
.acord-arrow.open{transform:rotate(90deg)}
.acord-body{border-top:1px solid #F0EBE4;padding:0 16px}

/* Sub-acordeón */
.sub-acord-btn{width:100%;padding:11px 0;border:none;background:transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center;text-align:left;border-bottom:1px dashed #EEE8E0}
.sub-acord-btn:last-child{border-bottom:none}
.sub-titulo{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.sub-val{font-size:13px;font-weight:700;color:var(--dark)}
.sub-arrow{font-size:16px;color:#AAA;transition:transform .2s;margin-left:6px}

<script>
function initFirebase(){
  if(typeof firebase==="undefined"){
    // Firebase no cargó (sin conexión o bloqueado) — seguir con localStorage
    console.warn("Firebase no disponible, usando solo localStorage");
    window._fbSave=async function(){return false;};
    window._fbLoad=async function(){return null;};
    window._fbReady=true;
    window.dispatchEvent(new Event("firebase-ready"));
    return;
  }
  try{
    firebase.initializeApp({
      apiKey:"AIzaSyCLYo-VZwtsEn807EgDtcz9_M0fsfkkIuI",
      authDomain:"nuevos-horizontes-6d924.firebaseapp.com",
      projectId:"nuevos-horizontes-6d924",
      storageBucket:"nuevos-horizontes-6d924.firebasestorage.app",
      messagingSenderId:"1093738262656",
      appId:"1:1093738262656:web:405bf732dc1210b54db665"
    });
    const db=firebase.firestore();
    const DOC_REF=db.collection("nh").doc("data");

    window._fbSave=async function(data){
      try{
        const savePromise=DOC_REF.set({payload:JSON.stringify(data)});
        const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(new Error("timeout")),8000));
        await Promise.race([savePromise,timeoutPromise]);
        return true;
      }catch(e){console.error("Firebase save error:",e);return false;}
    };

    window._fbLoad=async function(){
      try{
        const snap=await DOC_REF.get();
        if(snap.exists){return JSON.parse(snap.data().payload);}
        return null;
      }catch(e){console.error("Firebase load error:",e);return null;}
    };

  }catch(e){
    console.error("Firebase init error:",e);
    window._fbSave=async function(){return false;};
    window._fbLoad=async function(){return null;};
  }
  window._fbReady=true;
  window.dispatchEvent(new Event("firebase-ready"));
}

// Esperar a que el DOM esté listo antes de inicializar
if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded", initFirebase);
}else{
  initFirebase();
}
</script>

<script>
const MONTHS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MONTHS_FULL=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const KEY="nh-app-v9";
const KEY_BACKUPS="nh-app-v9-backups"; // respaldos locales con fecha (máx 3), ver guardarRespaldoLocal()
const YEARS=[2025,2026,2027,2028];
const DATA_VERSION=7; // bump this when INITIAL data changes
const APP_VERSION="v43.23"; // versión visible de la app (una sola fuente de verdad)
// Mientras hay un conflicto de sincronización pendiente de decidir (modal en pantalla),
// save() NO debe subir a Firebase: si lo hiciera, lo local viejo pisaría lo más reciente
// de la nube antes de que el usuario decida. Se reanuda al resolver el modal.
let SYNC_DECISION_PENDING=false;

// Migration: merge INITIAL metadata into existing DATA without losing payment states
function migrateData(data){
  if(!data||!data.members)return data;

  // ── → v6: re-sincronizar datos maestros desde INITIAL, INCLUIDO el id ──
  // Los datos del ARCHIVO (INITIAL) son la fuente de verdad. Refrescamos id,
  // type, ref, ciclo, fechas de ingreso, loans e history de cada miembro
  // (cruce por nombre), y damos de alta los nuevos. Reasignar el id corrige
  // fichas cruzadas (p. ej. Amada abriendo otra persona) por ids mal guardados.
  if((data._version||0) < 6){
    const imap={};
    INITIAL.members.forEach(m=>{imap[m.name.toLowerCase().trim()]=m;});
    data.members.forEach(m=>{
      const ref=imap[(m.name||"").toLowerCase().trim()];
      if(ref){
        m.id=ref.id;                 // ← clave: anclar el id al del archivo
        m.type=ref.type;
        m.ref=ref.ref;
        m.ciclo=ref.ciclo;
        m.joinMonth=ref.joinMonth;
        m.joinYear=ref.joinYear;
        // MODO B: las ayudas (loans) e historial se registran desde la app y son
        // la fuente de verdad del usuario. NO se sobrescriben con las del archivo;
        // solo se reponen si el miembro guardado no tuviera ninguna.
        if(!Array.isArray(m.loans))m.loans=JSON.parse(JSON.stringify(ref.loans||[]));
        if(!Array.isArray(m.history))m.history=JSON.parse(JSON.stringify(ref.history||[]));
        if(!m.phone)m.phone="";
      }
    });
    // Altas que están en INITIAL pero no en los datos guardados
    const have=new Set(data.members.map(m=>(m.name||"").toLowerCase().trim()));
    INITIAL.members.forEach(im=>{
      if(!have.has(im.name.toLowerCase().trim())){
        data.members.push(JSON.parse(JSON.stringify(im)));
      }
    });
    data.reportMonth=INITIAL.reportMonth;
    data.reportYear=INITIAL.reportYear;
    data._version=6;
    return data;
  }

  if(data._version>=DATA_VERSION)return data; // already up to date
  // v3→v4: actualizar mes de reporte y monthlyData
  data.reportMonth=INITIAL.reportMonth;
  data.reportYear=INITIAL.reportYear;
  if(!data.monthlyData)data.monthlyData={};
  
  const initialMap={};
  INITIAL.members.forEach(m=>{initialMap[m.name.toLowerCase()]=m;});
  
  // Update existing members with new fields + loans frescos del INITIAL
  data.members.forEach(m=>{
    const ref=initialMap[m.name.toLowerCase()];
    if(ref){
      if(!m.joinMonth&&ref.joinMonth){m.joinMonth=ref.joinMonth;m.joinYear=ref.joinYear;}
      // MODO B: las ayudas (loans) se registran desde la app y mandan. Solo se
      // reponen desde el archivo si el miembro guardado no tuviera ninguna.
      if(!Array.isArray(m.loans)||m.loans.length===0){
        if(ref.loans&&ref.loans.length>0){
          m.loans=JSON.parse(JSON.stringify(ref.loans));
        }
      }
      if(!m.history||m.history.length===0){m.history=JSON.parse(JSON.stringify(ref.history||[]));}
      if(!m.phone)m.phone="";
      if(!m.ciclo&&ref.ciclo){m.ciclo=ref.ciclo;}
    }
    if(!m.history)m.history=[];
    if(!m.joinMonth)m.joinMonth=null;
    if(!m.joinYear)m.joinYear=null;
  });
  
  // Add members that exist in INITIAL but not in saved data
  const existingNames=new Set(data.members.map(m=>m.name.toLowerCase()));
  INITIAL.members.forEach(im=>{
    if(!existingNames.has(im.name.toLowerCase())){
      data.members.push(JSON.parse(JSON.stringify(im)));
    }
  });
  
  // Update report month/year
  data.reportMonth=INITIAL.reportMonth;
  data.reportYear=INITIAL.reportYear;
  data._version=DATA_VERSION;
  return data;
}

// Saneamiento que corre SIEMPRE al cargar (venga de localStorage o Firebase),
// sin depender de la versión. Reancla el id de cada miembro al del archivo
// (INITIAL) cruzando por nombre, para que las fichas nunca queden cruzadas
// aunque los datos guardados estén corruptos. NO toca pagos ni aportes.
function sanitizeData(data){
  if(!data||!data.members)return data;
  // Renombrados conocidos: nombre antiguo en datos guardados → nombre actual del archivo.
  // Mery Sarmiento es la misma persona que Gloria Sarmiento (id 7).
  data.members.forEach(m=>{
    if((m.name||"").toLowerCase().trim()==="mery sarmiento")m.name="Gloria Sarmiento";
  });
  const byName={};
  INITIAL.members.forEach(m=>{byName[m.name.toLowerCase().trim()]=m;});
  // Eliminar SOLO miembros fantasma (datos viejos que ya no existen en el archivo).
  // Se CONSERVAN: los del archivo (INITIAL) y los que tú creaste desde la app
  // (marcados con origen:"app" o con id que empieza por "m"+timestamp).
  // Antes este filtro borraba por error a los asociados nuevos y con ellos sus ayudas.
  const validNames=new Set(INITIAL.members.map(m=>m.name.toLowerCase().trim()));
  const validIds=new Set(INITIAL.members.map(m=>m.id));
  data.members=data.members.filter(m=>{
    if(validNames.has((m.name||"").toLowerCase().trim()))return true; // está en el archivo
    if(validIds.has(m.id))return true;                                // está en el archivo (por id, aunque le hayan cambiado el nombre)
    if(m.origen==="app")return true;                                  // creado desde la app
    if(typeof m.id==="string" && m.id.charAt(0)==="m")return true;     // id de la app
    return false; // fantasma real: descartar
  });
  data.members.forEach(m=>{
    const ref=byName[(m.name||"").toLowerCase().trim()];
    if(ref){
      m.id=ref.id;          // id correcto del archivo (fuente de verdad)
      m.type=ref.type;      // asociado / tercero
      m.ref=ref.ref;        // avalista (o null)
    }
  });
  // Fusionar referidos del archivo (INITIAL) sin pisar los ya registrados
  if(INITIAL.referidos){
    if(!data.referidos)data.referidos={};
    Object.keys(INITIAL.referidos).forEach(mid=>{
      if(!data.referidos[mid])data.referidos[mid]={};
      Object.keys(INITIAL.referidos[mid]).forEach(k=>{
        if(!data.referidos[mid][k])data.referidos[mid][k]=INITIAL.referidos[mid][k];
      });
    });
  }
  // Reponer el HISTORIAL FIJO de aportes mensuales desde el archivo (INITIAL).
  // Los meses cerrados (hasta junio 2026) son dato histórico que no debe perderse
  // aunque el navegador tenga datos viejos. El mes en curso y futuros se respetan.
  if(INITIAL.monthlyData){
    if(!data.monthlyData)data.monthlyData={};
    const CIERRE="2026-06"; // último mes del histórico fijo (inclusive)
    Object.keys(INITIAL.monthlyData).forEach(k=>{
      if(k<=CIERRE){
        // reponer/garantizar los aportes históricos de ese mes
        if(!data.monthlyData[k])data.monthlyData[k]={};
        if(!data.monthlyData[k].aportes)data.monthlyData[k].aportes={};
        const ini=INITIAL.monthlyData[k].aportes||{};
        Object.keys(ini).forEach(mid=>{
          if(ini[mid])data.monthlyData[k].aportes[mid]=true;
        });
      }
    });
  }
  // Vinculación automática del historial: para cada entrada de historial sin lid,
  // buscar su ayuda (loans o closedLoans) que coincida EXACTO en capital+mes+año y
  // asignarle el lid. Solo vincula cuando el emparejamiento es único (sin ambigüedad),
  // así el historial queda conectado a sus ayudas sin tocar importes ni borrar nada.
  if(data.members){
    data.members.forEach(m=>{
      if(!Array.isArray(m.history)||!m.history.length)return;
      const todas=[...(m.loans||[]),...(m.closedLoans||[])];
      m.history.forEach(h=>{
        if(h.lid)return;
        const matches=todas.filter(l=>l.capital===h.capital&&l.gMonth===h.gMonth&&l.gYear===h.gYear);
        if(matches.length===1) h.lid=matches[0].id;
      });
    });
  }
  return data;
}

function esc(str){return String(str).replace(/\\/g,"\\\\").replace(/'/g,"\\'");}
function escH(str){return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// Registra el año actual del sistema en la lista de años (sin tocar el mes/año elegido)
function setCurrentMonthYear(){
  if(!DATA)return;
  const now=new Date();
  const curY=now.getFullYear();
  if(YEARS.indexOf(curY)===-1)YEARS.push(curY);
  // Opción A: respetar siempre el mes/año que el usuario dejó guardado.
  // Solo se fija el mes actual si por algún motivo no hubiera ninguno guardado.
  if(!DATA.reportMonth)DATA.reportMonth=MONTHS[now.getMonth()];
  if(!DATA.reportYear)DATA.reportYear=curY;
}

// Devuelve la cuota "activa" de una ayuda en el mes-año dado.
// Lógica:
//  1) Si hay alguna cuota anterior al mes actual sin pagar (atraso), devolver la más antigua.
//  2) Si no hay atrasos y la cuota del mes actual existe y no está pagada, devolverla.
//  3) Si no hay atrasos y la cuota del mes actual está pagada (o no existe),
//     devolver la siguiente cuota futura no pagada (cascada).
function activePayIndex(loan,rm,ry){
  const ri=MONTHS.indexOf(rm);
  // 1) Buscar atraso más antiguo (cuotas estrictamente anteriores al mes actual)
  for(let i=0;i<loan.pays.length;i++){
    const p=loan.pays[i];
    if(p.paid)continue;
    const pi=MONTHS.indexOf(p.m);
    const isBefore=(p.y<ry)||(p.y===ry&&pi<ri);
    if(isBefore)return i;
  }
  // 2) ¿Hay cuota del mes actual sin pagar?
  for(let i=0;i<loan.pays.length;i++){
    const p=loan.pays[i];
    if(p.m===rm&&p.y===ry&&!p.paid)return i;
  }
  // 3) Cascada: primera cuota futura sin pagar
  for(let i=0;i<loan.pays.length;i++){
    if(!loan.pays[i].paid)return i;
  }
  return -1;
}

// Construye el orden de la lista única en pantalla principal:
// 1) Asociados con ayudas activas (con sus terceros referidos justo debajo)
// 2) Asociados sin ayudas activas (con sus terceros referidos justo debajo)
// 3) Terceros huérfanos (sin asociado avalista que coincida) al final
function buildOrderedMembers(){
  const asoc=DATA.members.filter(m=>m.type==="asociado");
  const terc=DATA.members.filter(m=>m.type==="tercero");
  // Clave de fecha de ingreso (año*100+mes) para ordenar cronológicamente
  const ingresoKey=m=>{
    const mi=MONTHS.indexOf(m.joinMonth);
    return (m.joinYear||9999)*100+(mi>=0?mi:99);
  };
  // Asociados por orden de ingreso a la asociación (más antiguos primero)
  const asocOrdenados=[...asoc].sort((a,b)=>ingresoKey(a)-ingresoKey(b));
  // Terceros al final, ordenados por nº de ayudas activas (más ayudas primero)
  const ayudasActivas=m=>m.loans.filter(l=>l.pays.some(p=>!p.paid)).length;
  const tercOrdenados=[...terc].sort((a,b)=>ayudasActivas(b)-ayudasActivas(a));
  return [...asocOrdenados,...tercOrdenados];
}

// Fusiona un tercero existente en un asociado nuevo cuando comparten nombre.
// Mantiene historial, ayudas activas y aportes; convierte el tipo a asociado.
function mergeTerceroIntoAsociado(name,joinMonth,joinYear){
  const key=name.toLowerCase().trim();
  const tercero=DATA.members.find(m=>m.type==="tercero"&&m.name.toLowerCase().trim()===key);
  if(!tercero)return false;
  tercero.type="asociado";
  tercero.ref=null;
  tercero.joinMonth=joinMonth||DATA.reportMonth;
  tercero.joinYear=joinYear||DATA.reportYear;
  if(!tercero.history)tercero.history=[];
  if(!tercero.phone)tercero.phone="";
  return true;
}


function memberMonths(m){
  if(!m.joinMonth||!m.joinYear)return 0;
  const ji=MONTHS.indexOf(m.joinMonth),jy=m.joinYear;
  const ri=MONTHS.indexOf(DATA.reportMonth),ry=DATA.reportYear;
  return (ry-jy)*12+(ri-ji)+1;
}
function memberTotalAportes(m){
  if(!m.joinMonth)return 0;
  return memberMonths(m)*DATA.monthlyFee;
}
function memberHistoryCount(m){return (m.history||[]).length;}
function memberHistoryTotal(m){return (m.history||[]).reduce((s,h)=>s+h.capital,0);}

let SYNC_STATUS="init";

function load(){
  if(READONLY_ID||ES_MODO_GRUPO){
    DATA=JSON.parse(JSON.stringify(INITIAL));
    document.getElementById("app").innerHTML='<div style="text-align:center;padding:60px 20px"><div style="font-size:40px;margin-bottom:12px">⏳</div><div style="font-size:16px;font-weight:600;color:#2D6A4F">Cargando datos...</div></div>';
    const tryLoad=async()=>{
      if(!window._fbReady){
        await new Promise(res=>{
          const t=setTimeout(res,7000);
          window.addEventListener("firebase-ready",()=>{clearTimeout(t);res();},{once:true});
        });
      }
      try{
        const fbData=await window._fbLoad();
        if(fbData){DATA=sanitizeData(migrateData(fbData));if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});}
        SYNC_STATUS="ok";
      }catch(e){console.error("Firebase readonly load failed:",e);SYNC_STATUS="error";}
      setCurrentMonthYear();
      render();
    };
    tryLoad();
    return;
  }

  // Modo administrador: localStorage primero (inmediato), Firebase después (en background)
  try{
    const s=localStorage.getItem(KEY);
    DATA=s?sanitizeData(migrateData(JSON.parse(s))):JSON.parse(JSON.stringify(INITIAL));
    if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
  }catch{DATA=JSON.parse(JSON.stringify(INITIAL));}
  // Respetar el mes/año guardado (solo se fija el actual si no hubiera ninguno)
  setCurrentMonthYear();
  SYNC_STATUS="init";
  render(); // Renderizar con datos locales inmediatamente

  // FIX IPHONE: sincronizar con Firebase UNA SOLA VEZ al cargar
  // Sin onSnapshot — sin WebSocket persistente — sin congelados
  const tryFirebase=async()=>{
    if(!window._fbReady){
      await new Promise(res=>{
        const t=setTimeout(res,5000);
        window.addEventListener("firebase-ready",()=>{clearTimeout(t);res();},{once:true});
      });
    }
    try{
      const fbData=await window._fbLoad();
      const hayLocal = !!localStorage.getItem(KEY) && DATA && DATA.members && DATA.members.length>0;
      if(!hayLocal && fbData){
        // localStorage vacío (teléfono nuevo, app reinstalada o caché borrada):
        // recuperar los datos desde el respaldo de la nube.
        DATA=sanitizeData(migrateData(fbData));
        if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
        localStorage.setItem(KEY,JSON.stringify(DATA));
      }else if(hayLocal && fbData && typeof fbData.updatedAt==="number" && fbData.updatedAt>(DATA.updatedAt||0)){
        // La nube tiene datos MÁS RECIENTES que este dispositivo (editaste desde otro
        // aparato). No se decide en automático: se pregunta. Mientras esté pendiente,
        // save() no debe subir nada a Firebase (evitaría pisar lo reciente con esto viejo).
        SYNC_DECISION_PENDING=true;
        MODAL={type:"sync_conflict",cloudData:fbData,localUpdatedAt:DATA.updatedAt||null,cloudUpdatedAt:fbData.updatedAt};
        SYNC_STATUS="ok";
        render();
        return; // el flujo continúa en resolverConflictoSync() cuando se elija una opción
      }else{
        // CASO NORMAL (un solo dispositivo): lo LOCAL es la verdad. Firebase NUNCA
        // pisa lo local; solo se usa como respaldo, subiendo la copia local a la nube.
        // Así una ayuda recién registrada no puede desaparecer al reabrir.
        try{await window._fbSave(DATA);}catch(e){}
      }
      SYNC_STATUS="ok";
    }catch(e){
      console.error("Firebase load failed:",e);
      SYNC_STATUS="error";
    }
    setCurrentMonthYear();
    render();
    // FIX IPHONE: NO llamamos a _fbListen aquí — eliminado completamente
  };
  tryFirebase();
}

// Guarda una copia de `data` en los respaldos locales (máx 3, se descarta la más
// antigua). origen indica de dónde viene esa copia ("local" o "nube") y ts la fecha
// de esos datos (DATA.updatedAt), para mostrarla luego en Gestión.
function guardarRespaldoLocal(data,origen,ts){
  try{
    const raw=localStorage.getItem(KEY_BACKUPS);
    const arr=raw?JSON.parse(raw):[];
    arr.push({ts:ts||Date.now(),origen,guardadoEn:Date.now(),data});
    while(arr.length>3)arr.shift();
    localStorage.setItem(KEY_BACKUPS,JSON.stringify(arr));
  }catch(e){console.error("No se pudo guardar el respaldo local:",e);}
}
function listarRespaldosLocales(){
  try{const raw=localStorage.getItem(KEY_BACKUPS);return raw?JSON.parse(raw):[];}catch{return[];}
}

// El usuario decide qué hacer ante un conflicto de sincronización (modal "sync_conflict").
async function resolverConflictoSync(choice){
  if(!MODAL||MODAL.type!=="sync_conflict")return;
  const cloudData=MODAL.cloudData;
  if(choice==="cloud"){
    // Antes de reemplazar lo local por lo de la nube, respaldar lo local actual con su fecha.
    guardarRespaldoLocal(DATA,"local",MODAL.localUpdatedAt);
    DATA=sanitizeData(migrateData(cloudData));
    if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
    try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch{}
    toast("☁️ Datos de la nube cargados ✓");
  }else{
    // Mantener local: los de la nube van a quedar pisados por la subida de abajo, así
    // que primero se respaldan (con su propia fecha) para que no se destruyan sin copia.
    guardarRespaldoLocal(cloudData,"nube",MODAL.cloudUpdatedAt);
    toast("📱 Mantienes los datos de este dispositivo");
  }
  MODAL=null;
  SYNC_DECISION_PENDING=false; // se reanuda el flujo normal de save()
  render();
  if(choice==="local"){
    // Continúa el flujo normal (caso de siempre): lo local es la verdad, se sube como respaldo.
    try{await window._fbSave(DATA);}catch(e){}
  }
  setCurrentMonthYear();
  render();
}

// Restaura una copia de respaldo (por índice en listarRespaldosLocales()). Antes de
// restaurar, guarda el estado actual como respaldo también: ninguna restauración
// puede destruir datos sin que quede su copia.
async function restaurarRespaldoLocal(idx){
  const arr=listarRespaldosLocales();
  const bk=arr[idx];
  if(!bk)return;
  guardarRespaldoLocal(DATA,"local",DATA.updatedAt||Date.now());
  DATA=sanitizeData(migrateData(JSON.parse(JSON.stringify(bk.data))));
  if(DATA.members)DATA.members.forEach(m=>{if(!m.phone)m.phone="";if(!m.history)m.history=[];if(!m.joinMonth)m.joinMonth=null;if(!m.joinYear)m.joinYear=null;});
  closeModal();
  await save();
  toast("♻️ Copia de seguridad restaurada ✓");
  render();
}

// Diagnóstico: releer localStorage SIN tocar nada y comparar con memoria
function diagLeerLS(){
  let raw=""; try{raw=localStorage.getItem(KEY)||"";}catch(e){toast("No se puede leer localStorage: "+e.message);return;}
  if(!raw){toast("⚠️ localStorage VACÍO — el teléfono está borrando los datos");return;}
  let c=0; try{const o=JSON.parse(raw);(o.members||[]).forEach(m=>{c+=(m.loans||[]).length;});}catch(e){toast("localStorage corrupto");return;}
  let mem=0; DATA.members.forEach(m=>{mem+=(m.loans||[]).length;});
  toast("Teléfono: "+c+" ayudas · Memoria: "+mem+" ayudas");
}
async function subirAhoraNube(){
  DATA.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch{}
  if(!window._fbReady){toast("Conectando con la nube, espera un momento e inténtalo de nuevo");return;}
  toast("Subiendo a la nube...");
  try{
    const ok=await window._fbSave(DATA);
    if(ok){SYNC_STATUS="ok";toast("✓ Datos subidos a la nube ("+DATA.members.length+" miembros)");}
    else{SYNC_STATUS="error";toast("No se pudo subir. Revisa tu conexión.");}
  }catch(e){SYNC_STATUS="error";toast("Error al subir a la nube");}
  const dot=document.querySelector(".sync-indicator");
  if(dot)dot.innerHTML=syncHTML();
}

async function save(){
  DATA.updatedAt=Date.now(); // marca de tiempo: para que gane siempre la versión más reciente
  try{localStorage.setItem(KEY,JSON.stringify(DATA));}catch{}

  if(SYNC_DECISION_PENDING)return; // hay un conflicto de sync sin resolver: solo local, nada de Firebase

  if(!READONLY_ID&&!ES_MODO_GRUPO){
    SYNC_STATUS="saving";
    // FIX IPHONE: actualizar solo el indicador, sin re-renderizar todo
    const dot=document.querySelector(".sync-indicator");
    if(dot)dot.innerHTML=syncHTML();

    try{
      if(window._fbReady){
        const ok=await window._fbSave(DATA);
        SYNC_STATUS=ok?"ok":"error";
      }else{
        SYNC_STATUS="offline";
      }
    }catch{SYNC_STATUS="error";}

    // Actualizar solo el indicador de sync, no todo el render
    const dot2=document.querySelector(".sync-indicator");
    if(dot2)dot2.innerHTML=syncHTML();
  }
}

function syncHTML(){
  if(SYNC_STATUS==="ok")return'<span class="sync-dot sync-ok"></span>Sincronizado';
  if(SYNC_STATUS==="saving")return'<span class="sync-dot sync-ing"></span>Guardando...';
  if(SYNC_STATUS==="error")return'<span class="sync-dot sync-err"></span>Sin conexión — guardado local';
  if(SYNC_STATUS==="offline")return'<span class="sync-dot sync-err"></span>Offline — guardado local';
  return'<span class="sync-dot sync-ing"></span>Conectando...';
}

function toast(msg,dur=2500){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add("hidden"),dur);}

// Total real de aportes de un mes: aporte de cada asociado que pagó (50 o 100)
// + sus aportes extra de ese mes. Refleja el dinero real aportado.
function totalAportesMes(rm,ry){
  const md=getMesData(rm,ry);
  const aportes=(md&&md.aportes)||{};
  const mesKey=getMesKey(rm,ry);
  let t=0;
  DATA.members.forEach(m=>{
    if(m.type==="tercero")return;
    if(aportes[m.id]) t+=aporteNetoMes(m,rm,ry);
    // aportes extra de ese mes (los paga aunque cuenten aparte)
    const ex=(DATA.extras&&DATA.extras[m.id]&&DATA.extras[m.id][mesKey]);
    if(ex&&ex.monto) t+=ex.monto;
  });
  return t;
}

// Salidas por devoluciones de aportaciones puntuales en un mes (capital+5% que se
// devuelve al aportante). Es dinero que SALE del fondo ese mes.
function salidasPuntualesMes(rm,ry){
  let t=0;
  if(DATA.aportesPuntuales){
    Object.values(DATA.aportesPuntuales).forEach(arr=>{
      (arr||[]).forEach(ap=>{ if(ap.mesDev===rm&&ap.anioDev===ry) t+=ap.total; });
    });
  }
  return t;
}
// Desglose de las devoluciones de aportes puntuales que TOCAN devolverse en rm/ry,
// separando lo ya devuelto de lo aún pendiente (devuelto:false). Ambos importes salen
// del disponible: el pendiente es un compromiso ya adquirido, no dinero disponible.
function salidasPuntualesSplit(rm,ry){
  let devuelto=0,pendiente=0;const items=[];
  if(DATA.aportesPuntuales){
    Object.entries(DATA.aportesPuntuales).forEach(([mid,arr])=>{
      (arr||[]).forEach(ap=>{
        if(ap.mesDev===rm&&ap.anioDev===ry){
          const nom=(DATA.members.find(x=>x.id===mid)||{}).name||"";
          if(ap.devuelto){devuelto+=ap.total;}else{pendiente+=ap.total;}
          items.push({nombre:nom,total:ap.total,devuelto:!!ap.devuelto});
        }
      });
    });
  }
  return {devuelto,pendiente,total:devuelto+pendiente,items};
}

function due(m,rm,ry){
  // Suma la cuota cuyo mes es EXACTAMENTE rm/ry (no la próxima sin pagar),
  // incluyendo ayudas cerradas (una cuota pagada ese mes es devolución contable real).
  // Si la cuota está aplazada/ampliada, usa su importe especial (instAplazada), igual que dueSplit.
  let t=0;
  const todas=[...(m.loans||[]),...(m.closedLoans||[])];
  todas.forEach(l=>{
    l.pays.forEach(p=>{ if(p.m===rm&&p.y===ry) t+=(p.aplazada?p.instAplazada:l.inst); });
  });
  return t;
}
function pendLoan(l){return l.pays.filter(p=>!p.paid).length*l.inst;}
function pendAll(m){let t=0;m.loans.forEach(l=>t+=pendLoan(l));return t;}

// Cuotas de un miembro que vencen EXACTAMENTE en rm/ry, separando pagado/pendiente.
// (No arrastra atrasos de meses anteriores: solo el mes en curso.)
function dueSplit(m,rm,ry){
  let cobrado=0,pendiente=0;
  const todas=[...(m.loans||[]),...(m.closedLoans||[])];
  todas.forEach(l=>{
    l.pays.forEach(p=>{ if(p.m===rm&&p.y===ry){ const imp=p.aplazada?p.instAplazada:l.inst; if(p.paid)cobrado+=imp; else pendiente+=imp; } });
  });
  return {cobrado,pendiente};
}
// Aportes del mes rm/ry: cobrado (los que pagaron) y pendiente (asociados activos
// con derecho a aportar ese mes que aún no han pagado).
function aportesSplit(rm,ry){
  const md=getMesData(rm,ry);
  const aportes=(md&&md.aportes)||{};
  const ri=MONTHS.indexOf(rm);
  let cobrado=0,pendiente=0;
  DATA.members.forEach(m=>{
    if(m.type==="tercero"||!m.joinMonth)return;
    // Solo cuenta si el asociado ya estaba activo ese mes (ingresó antes o en ese mes)
    const ji=MONTHS.indexOf(m.joinMonth),jy=m.joinYear;
    const activoEseMes=(jy<ry)||(jy===ry&&ji<=ri);
    if(!activoEseMes)return;
    const cuota=aporteNetoMes(m,rm,ry);
    if(aportes[m.id])cobrado+=cuota; else pendiente+=cuota;
  });
  return {cobrado,pendiente};
}

// Recargo por cuota de una ayuda = 5% del capital (una vez por cuota)
function recargoPorCuota(l){return Math.round(l.capital*((l.rate!=null?l.rate:DATA.rate)/100));}

// Recargo automático del mes = suma del recargo de cada cuota PAGADA cuyo mes es rm/ry
function recargoAutoMes(rm,ry){
  let t=0;
  DATA.members.forEach(m=>{
    [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
      l.pays.forEach(p=>{ if(p.m===rm&&p.y===ry&&p.paid) t+=recargoPorCuota(l); });
    });
  });
  return t;
}

// Lista de cuotas cuyo mes es rm/ry (para el bloque de cuotas cobradas del cierre)
// ── CIERRE GRUPAL (varios grupos, persistentes) ──
function gruposCierre(){ if(!DATA.gruposCierre)DATA.gruposCierre=[]; return DATA.gruposCierre; }

// Descuento por referido de un asociado en un mes concreto (misma regla en toda la app):
// 10€ por referido, máximo 3 (30€). Se usa TANTO en la ficha como en el Cierre para
// que las sumas coincidan siempre. Devuelve {nReferidos, descuento}.
function descuentoReferidoMes(mid,rm,ry){
  const refData=(DATA.referidos&&DATA.referidos[mid]&&DATA.referidos[mid][getMesKey(rm,ry)])||null;
  const nReferidos=refData?Math.min(refData.n,3):0;
  return {nReferidos, descuento:nReferidos*10};
}
// Aporte NETO que corresponde pagar a un asociado ese mes (base − descuento, mínimo 0).
function aporteNetoMes(m,rm,ry){
  const base=(m.aporte||DATA.monthlyFee);
  const {descuento}=descuentoReferidoMes(m.id,rm,ry);
  return Math.max(0, base-descuento);
}

// Items (aporte + cuotas) de un miembro en el mes seleccionado
function itemsDeMiembro(mid){
  const rm=DATA.reportMonth, ry=DATA.reportYear;
  const m=DATA.members.find(x=>x.id===mid);
  if(!m)return [];
  const items=[];
  if(m.type==="asociado"){
    const md=getMesData(rm,ry);
    const pagado=!!(md.aportes&&md.aportes[m.id]);
    const {nReferidos,descuento}=descuentoReferidoMes(m.id,rm,ry);
    const neto=aporteNetoMes(m,rm,ry);
    const concepto=descuento>0?`Aporte mensual (−${descuento}€ por ${nReferidos} referido${nReferidos>1?"s":""})`:"Aporte mensual";
    items.push({tipo:"aporte",mid:m.id,nombre:m.name,concepto,importe:neto,yaPagado:pagado});
  }
  cuotasDelMes(rm,ry).filter(c=>c.mid===mid).forEach(c=>{
    items.push({tipo:"cuota",mid:c.mid,lid:c.lid,pi:c.pi,nombre:c.nombre,concepto:`Cuota ${c.numCuota}/${c.totalCuotas}${c.aplazada?" · aplazada":""}`,importe:c.inst,recargo:c.recargo,yaPagado:c.paid,aplazada:c.aplazada});
  });
  return items;
}
function itemsDeGrupo(g){
  const ids=[g.principalId,...(g.miembros||[])];
  let items=[];
  ids.forEach(id=>{ items=items.concat(itemsDeMiembro(id)); });
  return items;
}
function crearGrupo(principalId){
  if(!principalId)return;
  gruposCierre().push({id:"G"+Date.now(),principalId,miembros:[]});
  save();render();
}
function borrarGrupo(gid){
  DATA.gruposCierre=gruposCierre().filter(g=>g.id!==gid);
  save();render();
}
function añadirMiembroGrupo(gid,mid){
  if(!mid)return;
  const g=gruposCierre().find(x=>x.id===gid);
  if(g&&g.principalId!==mid&&!(g.miembros||[]).includes(mid)){
    if(!g.miembros)g.miembros=[];
    g.miembros.push(mid);
    save();render();
  }
}
function quitarMiembroGrupo(gid,mid){
  const g=gruposCierre().find(x=>x.id===gid);
  if(g){ g.miembros=(g.miembros||[]).filter(x=>x!==mid); save();render(); }
}
function marcarItemGrupo(tipo,mid,lid,pi){
  if(tipo==="aporte"){
    const md=getMesData(DATA.reportMonth,DATA.reportYear);
    if(!md.aportes)md.aportes={};
    md.aportes[mid]=!md.aportes[mid];
  } else {
    const m=DATA.members.find(x=>x.id===mid);
    if(m)[...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{if(l.id===lid)l.pays[pi].paid=!l.pays[pi].paid;});
    recolocarAyudas();
  }
  recalcMesRecargo();save();render();
}
function marcarTodoGrupo(gid){
  const g=gruposCierre().find(x=>x.id===gid);
  if(!g)return;
  itemsDeGrupo(g).forEach(it=>{
    if(it.yaPagado)return;
    if(it.tipo==="aporte"){
      const md=getMesData(DATA.reportMonth,DATA.reportYear);
      if(!md.aportes)md.aportes={};
      md.aportes[it.mid]=true;
    } else {
      const m=DATA.members.find(x=>x.id===it.mid);
      if(m)[...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{if(l.id===it.lid)l.pays[it.pi].paid=true;});
    }
  });
  recolocarAyudas();recalcMesRecargo();save();render();
  toast("Grupo marcado como pagado ✓");
}
function recolocarAyudas(){
  DATA.members.forEach(m=>{
    const t=[...(m.loans||[]),...(m.closedLoans||[])];
    m.loans=t.filter(l=>l.pays.some(p=>!p.paid));
    m.closedLoans=t.filter(l=>l.pays.every(p=>p.paid));
  });
}

function cuotasDelMes(rm,ry){
  const out=[];
  DATA.members.forEach(m=>{
    [...(m.loans||[]),...(m.closedLoans||[])].forEach(l=>{
      l.pays.forEach((p,pi)=>{
        if(p.m===rm&&p.y===ry){
          const rec=recargoPorCuota(l);
          const imp=p.aplazada?(p.instAplazada||rec):l.inst; // aplazada = solo retorno
          const cap=p.aplazada?0:(l.inst-rec);               // aplazada = 0 capital
          out.push({mid:m.id,nombre:m.name,tipo:m.type,lid:l.id,pi,inst:imp,
            recargo:rec,capital:cap,paid:p.paid,aplazada:!!p.aplazada,
            numCuota:pi+1,totalCuotas:l.pays.length,gMonth:l.gMonth,gYear:l.gYear});
        }
      });
    });
  });
  // asociados primero, terceros después
  return out.sort((a,b)=>(a.tipo===b.tipo?0:a.tipo==="asociado"?-1:1));
}

function togglePay(mid,lid,pi){
  UNDO_SNAPSHOT=JSON.stringify(DATA);
  clearTimeout(UNDO_TIMER);

  let loanCompleted=false;
  DATA.members.forEach(m=>{
    if(m.id===mid){
      // Buscar en loans activos Y en closedLoans
      const allLoans=[...(m.loans||[]),...(m.closedLoans||[])];
      allLoans.forEach(l=>{if(l.id===lid)l.pays[pi].paid=!l.pays[pi].paid;});
      // Separar: loans con alguna cuota pendiente → activos; todos pagados → cerrados
      const activos=allLoans.filter(l=>l.pays.some(p=>!p.paid));
      const cerrados=allLoans.filter(l=>l.pays.every(p=>p.paid));
      if(cerrados.length>(m.closedLoans||[]).length)loanCompleted=true;
      m.loans=activos;
      m.closedLoans=cerrados;
    }
  });
  save();

  const msg=loanCompleted?"✅ Ayuda completada":"✓ Pago registrado — toca Deshacer si fue error";
  const t=document.getElementById("toast");
  t.innerHTML=`${msg} &nbsp;<span onclick="undoPay()" style="text-decoration:underline;cursor:pointer;font-weight:800">↩ Deshacer</span>`;
  t.classList.remove("hidden");
  clearTimeout(t._t);
  UNDO_TIMER=setTimeout(()=>{t.classList.add("hidden");UNDO_SNAPSHOT=null;},6000);

  render();
}

function undoPay(){
  if(!UNDO_SNAPSHOT)return;
  DATA=JSON.parse(UNDO_SNAPSHOT);
  UNDO_SNAPSHOT=null;
  clearTimeout(UNDO_TIMER);
  save();
  toast("↩ Pago deshecho ✓");
  render();
}

let _delMemberArmed=null;
// ¿Es este asociado el principal de algún grupo de Cierre? (su enlace de grupo
// dejaría de encontrar miembros si se le elimina)
function esPrincipalDeGrupo(mid){
  return (DATA.gruposCierre||[]).some(g=>g.principalId===mid);
}
function delMember(mid){

    _delMemberArmed=mid;
    render();

    setTimeout(()=>{if(_delMemberArmed===mid){_delMemberArmed=null;render();}},4000);
    return;
  }
  _delMemberArmed=null;
  DATA.members=DATA.members.filter(m=>m.id!==mid);
  save();toast("Eliminado ✓");render();
}
let _delLoanArmed=null;
// Recalcula los importes de un apoyo respetando las cuotas APLAZADAS.
// - Las cuotas aplazadas pagan solo el retorno (5% del capital original).
// - El capital se reparte entre las cuotas NO aplazadas (al alza).
// - Cada cuota no aplazada = capitalPorCuota + retorno.
function recalcularApoyo(l){
  const tasa=(l.rate!=null?l.rate:DATA.rate);
  const retorno=Math.round(l.capital*(tasa/100)); // % del capital original
  const nAplazadas=l.pays.filter(p=>p.aplazada).length;
  const nNormales=l.pays.length-nAplazadas;
  const capPorCuota=nNormales>0?Math.ceil(l.capital/nNormales):0;
  l.pays.forEach(p=>{
    if(p.aplazada){ p.instAplazada=retorno; }
  });
  l.inst=capPorCuota+retorno;         // cuota normal completa (ej. 125)
  l.n=l.pays.length;                  // plazo real (incluye el mes extra)
  // Total = suma real de lo que se cobrará (normales completas + aplazadas solo retorno)
  l.total=nNormales*l.inst + nAplazadas*retorno;
}
function delLoan(mid,lid){
  // Sin confirm() (se bloquea en móvil). Primer toque arma, segundo elimina.
  const key=mid+"|"+lid;
  if(_delLoanArmed!==key){
    _delLoanArmed=key;
    render();
    toast("Toca de nuevo ✕ para confirmar");
    setTimeout(()=>{if(_delLoanArmed===key){_delLoanArmed=null;render();}},4000);
    return;
  }
  _delLoanArmed=null;
  DATA.members.forEach(m=>{if(m.id===mid){
    m.loans=m.loans.filter(l=>l.id!==lid);
    // Eliminar la entrada de historial vinculada a este apoyo (si la tiene)
    if(Array.isArray(m.history))m.history=m.history.filter(h=>h.lid!==lid);
  }});
  save();toast("Ayuda eliminada ✓");render();
}

function mText(member){

  let t=`━━━━━━━━━━━━━━━━━━━━\n📋 *NUEVOS HORIZONTES*\nReporte ${rm} ${ry}\n━━━━━━━━━━━━━━━━━━━━\n\n👤 *${member.name}*\n`;
  if(member.ref)t+=`   Referido por: ${member.ref}\n`;

    loan.pays.forEach(p=>{

  });

  t+=`━━━━━━━━━━━━━━━━━━━━\n💰 *TOTAL A PAGAR EN ${rm.toUpperCase()} ${ry}: ${d} €*\n`;
  if(member.loans.length>1)t+=`   (${member.loans.length} ayudas activas)\n`;

  return t;
}

// FIX IPHONE: html2canvas y jsPDF se cargan LAZY aquí, solo cuando se necesitan
async function loadPDFLibs(){
  if(window.html2canvas&&window.jspdf)return true;
  return new Promise((resolve)=>{
    const s1=document.createElement("script");
    s1.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
    s1.onload=()=>{
      const s2=document.createElement("script");
      s2.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      s2.onload=()=>resolve(true);
      s2.onerror=()=>resolve(false);
      document.head.appendChild(s2);
    };
    s1.onerror=()=>resolve(false);
    document.head.appendChild(s1);
  });
}

async function sharePDF(){
  if(BUSY)return;
  BUSY=true;render();
  toast("⏳ Cargando librerías PDF...",4000);

  const loaded=await loadPDFLibs();
  if(!loaded){toast("Error al cargar PDF. Comprueba tu conexión.");BUSY=false;render();return;}

  toast("📄 Generando PDF...",4000);
  try{
    const el=document.getElementById("capture");
    const canvas=await html2canvas(el,{backgroundColor:"#F5F0EB",scale:2,useCORS:true,logging:false});
    const{jsPDF}=window.jspdf;
    const imgData=canvas.toDataURL("image/jpeg",.92);
    const pW=100,pH=170,ratio=pW/canvas.width,totalH=canvas.height*ratio,pages=Math.ceil(totalH/pH);
    const pdf=new jsPDF({unit:"mm",format:[pW,pH]});
    for(let i=0;i<pages;i++){if(i>0)pdf.addPage([pW,pH]);pdf.addImage(imgData,"JPEG",0,-i*pH,pW,totalH);}
    const blob=pdf.output("blob");
    const file=new File([blob],`Reporte_${DATA.reportMonth}_${DATA.reportYear}.pdf`,{type:"application/pdf"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"Reporte NH"});toast("Compartido ✓");BUSY=false;render();return;}catch(e){if(e.name==="AbortError"){BUSY=false;render();return;}}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);toast("PDF descargado ✓");
  }catch(err){console.error(err);toast("Error al generar PDF");}
  BUSY=false;render();
}

// Lista de copias de seguridad locales (hasta 3), con confirmación de doble toque
// por copia (mismo patrón que eliminar una ayuda: primer toque arma, segundo restaura).
let _restoreArmedIdx=null;
function armarRestaurar(idx){
  if(_restoreArmedIdx!==idx){
    _restoreArmedIdx=idx;
    render();
    toast("Toca de nuevo ♻️ Restaurar para confirmar");
    setTimeout(()=>{if(_restoreArmedIdx===idx){_restoreArmedIdx=null;render();}},4000);
    return;
  }
  _restoreArmedIdx=null;
  restaurarRespaldoLocal(idx);
}

    h+=`<p style="font-size:14px;color:var(--muted);text-align:center;padding:12px 0">Todavía no hay copias de seguridad guardadas.</p>`;
